<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Page</title>
    <script src="set-vars.js"></script>
    <link rel="stylesheet" href="../../../../packs/_renderer/base.css">
    <style>
      :root { --s1: 28px; }
      header { display: flex; justify-content: space-between; align-items: center; padding: 16px 48px; border-bottom: 1px solid #d0d7de; }
      header strong { font-size: 18px; }
      header a { display: inline-block; padding: 10px 18px; background: #1f2328; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 15px; font-weight: 700; }
      main { width: 860px; margin: 36px auto 0; }
      h1 { font-size: 26px; margin-bottom: 16px; }
      .bar { display: flex; gap: 2px; align-items: center; padding: 6px 8px; border: 1px solid #d0d7de; border-bottom: 0; border-radius: 8px 8px 0 0; background: #f6f8fa; }
      .bar button { width: var(--s1); height: var(--s1); border: 0; border-radius: 4px; background: transparent; color: #1f2328; font: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      .bar i { width: 1px; height: 18px; background: #d0d7de; margin: 0 6px; }
      textarea { display: block; width: 860px; height: 420px; border: 1px solid #d0d7de; border-radius: 0 0 8px 8px; padding: 18px 20px; font: inherit; font-size: 16px; line-height: 1.6; color: #1f2328; resize: none; }
      .foot { display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px; }
      .foot button { height: 42px; padding: 0 20px; border-radius: 6px; font: inherit; font-size: 15px; font-weight: 700; border: 1px solid #1f2328; background: #ffffff; color: #1f2328; }
      .foot button + button { background: #1f2328; color: #ffffff; }
    </style>
  </head>
  <body>
    <header><strong>Parish Newsletter</strong><a href="#">View site</a></header>
    <main>
      <h1>Edit post</h1>
      <div class="bar">
        <button>B</button><button>I</button><button>U</button><button>S</button><i></i><button>H1</button><button>H2</button><i></i><button>1.</button><button>&bull;</button><button>&ldquo;</button><i></i><button>&lt;/&gt;</button>
      </div>
      <textarea>The spring fair is back on the green this year. Stalls open at ten on the first Saturday of May, and the tea tent will run until the cake runs out.

We still need two people to help set up the marquee on Friday evening. If you can lift a pole and hold a mallet, please reply to this post or speak to Margaret after the Sunday service.</textarea>
      <div class="foot"><button>Save draft</button><button>Publish</button></div>
    </main>
  </body>
</html>
