<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Page</title>
    <script src="set-vars.js"></script>
    <link rel="stylesheet" href="../../../../packs/_renderer/base.css">
    <style>
      :root { --s1: 26px; }
      header { padding: 20px 120px; border-bottom: 1px solid #d0d7de; font-size: 19px; font-weight: 700; }
      main { display: flex; gap: 48px; padding: 36px 120px; }
      .list { flex: 1; }
      h1 { font-size: 28px; margin-bottom: 18px; }
      .item { display: flex; align-items: center; gap: 20px; padding: 18px 0; border-top: 1px solid #d0d7de; }
      .img { width: 72px; height: 72px; border-radius: 8px; flex: none; }
      .name { flex: 1; }
      .name h2 { font-size: 17px; margin-bottom: 2px; }
      .name p { font-size: 14px; color: #424a53; }
      .qty { display: flex; align-items: center; }
      .qty button { width: var(--s1); height: var(--s1); border: 1px solid #8c959f; border-radius: 0; margin-left: -1px; background: #ffffff; color: #1f2328; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      .qty button:first-child { border-radius: 4px 0 0 4px; }
      .qty button:last-child { border-radius: 0 4px 4px 0; }
      .cost { width: 80px; text-align: right; font-size: 16px; font-weight: 700; }
      .sum { width: 320px; background: #f6f8fa; border-radius: 10px; padding: 24px; align-self: flex-start; }
      .sum h2 { font-size: 18px; margin-bottom: 14px; }
      .sum p { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 8px; }
      .sum a { display: block; margin-top: 18px; padding: 13px 0; text-align: center; background: #1f2328; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 16px; font-weight: 700; }
    </style>
  </head>
  <body>
    <header>Tidewater Tea Co.</header>
    <main>
      <div class="list">
        <h1>Your basket</h1>
        <div class="item"><div class="img" style="background:#c8b28e"></div><div class="name"><h2>Smoked lapsang, loose leaf</h2><p>100 g tin</p></div><div class="qty"><button>&minus;</button><button>+</button><button>&times;</button></div><div class="cost">$24.00</div></div>
        <div class="item"><div class="img" style="background:#9fb48a"></div><div class="name"><h2>Sencha first flush</h2><p>50 g pouch</p></div><div class="qty"><button>&minus;</button><button>+</button><button>&times;</button></div><div class="cost">$14.50</div></div>
        <div class="item"><div class="img" style="background:#b98b6e"></div><div class="name"><h2>Glass teapot with strainer</h2><p>600 ml</p></div><div class="qty"><button>&minus;</button><button>+</button><button>&times;</button></div><div class="cost">$32.00</div></div>
        <div class="item"><div class="img" style="background:#d9c7a3"></div><div class="name"><h2>Bamboo tea scoop</h2><p>Single</p></div><div class="qty"><button>&minus;</button><button>+</button><button>&times;</button></div><div class="cost">$9.00</div></div>
      </div>
      <div class="sum"><h2>Summary</h2><p><span>Items</span><span>$79.50</span></p><p><span>Shipping</span><span>$5.00</span></p><p><strong>Total</strong><strong>$84.50</strong></p><a href="#">Check out</a></div>
    </main>
  </body>
</html>
