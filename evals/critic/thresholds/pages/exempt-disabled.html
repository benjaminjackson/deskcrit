<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Page</title>
    <script src="set-vars.js"></script>
    <link rel="stylesheet" href="../../../../packs/_renderer/base.css">
    <style>
      :root { --c1: #a8a8a8; }
      body { display: flex; }
      aside { width: 260px; height: 800px; border-right: 1px solid #d0d7de; padding: 32px 24px; }
      aside strong { display: block; font-size: 18px; color: #1f2328; margin-bottom: 24px; }
      aside a { display: block; padding: 10px 12px; color: #1f2328; text-decoration: none; font-size: 15px; border-radius: 6px; }
      aside a.on { background: #eaeef2; font-weight: 700; }
      main { padding: 40px 64px; width: 760px; }
      h1 { font-size: 28px; color: #1f2328; margin-bottom: 8px; }
      .lede { font-size: 16px; color: #1f2328; margin-bottom: 28px; }
      .f { margin-bottom: 24px; }
      label { display: block; font-size: 15px; font-weight: 700; color: #1f2328; margin-bottom: 6px; }
      input { display: block; width: 480px; height: 40px; border: 1px solid #6e7781; border-radius: 6px; padding: 0 12px; font: inherit; font-size: 15px; color: #1f2328; background: #ffffff; }
      .f p { font-size: 14px; color: #1f2328; margin-top: 6px; }
      .row { display: flex; gap: 12px; margin-top: 8px; }
      button { height: 42px; padding: 0 22px; border: 0; border-radius: 6px; font: inherit; font-size: 15px; font-weight: 700; background: #1f2328; color: #ffffff; }
      button:disabled { background: #eef0f2; color: var(--c1); }
    </style>
  </head>
  <body>
    <aside>
      <strong>Settings</strong>
      <a href="#" class="on">Profile</a><a href="#">Notifications</a><a href="#">Billing</a><a href="#">Team</a>
    </aside>
    <main>
      <h1>Profile</h1>
      <p class="lede">Changes apply to every workspace you belong to.</p>
      <div class="f"><label>Display name</label><input value="Priya Raman"><p>Shown on your comments and in the team list.</p></div>
      <div class="f"><label>Email</label><input value="priya@northwind.example"><p>We send receipts and sign-in links here.</p></div>
      <div class="f"><label>Time zone</label><input value="Europe/Lisbon"><p>Reminders and reports follow this time zone.</p></div>
      <div class="row"><button disabled>Save changes</button><button>Sign out</button></div>
    </main>
  </body>
</html>
