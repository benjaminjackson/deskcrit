<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Marrow</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#f6f7f9;color:#1b2230;font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:16px;line-height:1.5}
.shell{display:flex;flex-direction:row;height:800px}
.nav{width:224px;flex:none;border-right:1px solid #dfe3ea;padding:24px 12px;background:#fff}
.brand{font-weight:700;font-size:18px;padding:0 12px 24px}
.nav-links{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#5d6677;font-size:15px}
.nav-item.active{color:#c2512a;font-weight:600;background:#fbece5}
.main{flex:1;padding:36px 40px 0 40px}
.inner{max-width:1000px}
h1{font-size:32px;line-height:1.2;font-weight:700;letter-spacing:-0.01em}
h2{font-size:20px;line-height:1.3;font-weight:600;margin-bottom:12px}
.sub{color:#5d6677;margin:6px 0 24px}
.row{display:flex;gap:16px;margin-bottom:24px}
.card{flex:1;background:#fff;border:1px solid #dfe3ea;border-radius:8px;padding:16px 18px}
.stat{font-size:28px;font-weight:700;margin-top:4px}
.delta{font-size:13px;color:#5d6677}
.btn{display:inline-block;background:#c2512a;color:#fff;font-weight:600;font-size:15px;padding:9px 18px;border-radius:6px;}
.btn.ghost{background:transparent;color:#c2512a;border:1px solid #c2512a}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #dfe3ea}
th{text-align:left;font-size:13px;color:#5d6677;font-weight:600;padding:10px 16px;border-bottom:1px solid #dfe3ea}
td{padding:11px 16px;border-bottom:1px solid #dfe3ea;font-size:15px}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:#fbece5;color:#c2512a;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.input{border:1px solid #dfe3ea;background:#fff;border-radius:6px;padding:9px 12px;font-size:15px}
.cols{display:flex;gap:32px}.cols>div{flex:1}
.list{background:#fff;border:1px solid #dfe3ea;border-radius:8px}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #dfe3ea}.list-row:last-child{border-bottom:none}
.list-row small{color:#5d6677;font-size:13px}
.sw{width:38px;height:22px;border-radius:11px;background:#dfe3ea;position:relative}.sw.on{background:#c2512a}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:8px;background:#fff}.sw.on::after{left:19px}
.cardicon{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-weight:600}
</style></head><body><div class="shell">
<div class="nav"><div class="brand">Marrow</div><div class="nav-links"><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M19 19v2H6"/></svg><span>Recipes</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M4 6h16v15H4zM4 10h16M8 3v4M16 3v4"/></svg><span>Plan</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M8 3h8v3H8zM7 6h10l1 3v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9zM6 12h12"/></svg><span>Pantry</span></a><a class="nav-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c2512a" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M3 4h2l2.5 11h11L21 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg><span>Shopping</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></a></div></div>
<div class="main"><div class="inner">
<h1>Shopping</h1><p class="sub">Everything you need for the plan</p>
<h2>Add an item</h2>
<div class="cols"><div><div class="field"><label>Item</label><div class="input">Eggs</div></div><div class="field"><label>Quantity</label><div class="input">12</div></div></div><div><div class="field"><label>Aisle</label><div class="input">Dairy</div></div><div class="field"><label>For</label><div class="input">Shakshuka</div></div></div></div><div class="row"><span class="btn">Add item</span><span class="btn ghost">Cancel</span></div>
</div></div></div></body></html>
