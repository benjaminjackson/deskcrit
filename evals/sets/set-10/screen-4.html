<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Orchard Credit Union</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#f6f7f9;color:#1b2230;font-family:Georgia, 'Times New Roman', serif;font-size:16px;line-height:1.5}
.shell{display:flex;flex-direction:row;height:800px}
.nav{width:224px;flex:none;border-right:1px solid #dfe3ea;padding:24px 12px;background:#fff}
.brand{font-weight:700;font-size:18px;padding:0 12px 24px}
.nav-links{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#5d6677;font-size:15px}
.nav-item.active{color:#8a2b45;font-weight:600;background:#f6e6ea}
.main{flex:1;padding:36px 40px 0 48px}
.inner{max-width:1000px}
h1{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-0.01em}
h2{font-size:22px;line-height:1.3;font-weight:600;margin-bottom:12px}
.sub{color:#5d6677;margin:6px 0 24px}
.row{display:flex;gap:16px;margin-bottom:24px}
.card{flex:1;background:#fff;border:1px solid #dfe3ea;border-radius:10px;padding:16px 18px}
.stat{font-size:28px;font-weight:700;margin-top:4px}
.delta{font-size:13px;color:#5d6677}
.btn{display:inline-block;background:#8a2b45;color:#fff;font-weight:600;font-size:15px;padding:9px 18px;border-radius:10px;}
.btn.ghost{background:transparent;color:#8a2b45;border:1px solid #8a2b45}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #dfe3ea}
th{text-align:left;font-size:13px;color:#5d6677;font-weight:600;padding:10px 16px;border-bottom:1px solid #dfe3ea}
td{padding:11px 16px;border-bottom:1px solid #dfe3ea;font-size:15px}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:#f6e6ea;color:#8a2b45;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.input{border:1px solid #dfe3ea;background:#fff;border-radius:8px;padding:9px 12px;font-size:15px}
.cols{display:flex;gap:32px}.cols>div{flex:1}
.list{background:#fff;border:1px solid #dfe3ea;border-radius:10px}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #dfe3ea}.list-row:last-child{border-bottom:none}
.list-row small{color:#5d6677;font-size:13px}
.sw{width:38px;height:22px;border-radius:11px;background:#dfe3ea;position:relative}.sw.on{background:#8a2b45}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:8px;background:#fff}.sw.on::after{left:19px}
.cardicon{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-weight:600}
</style></head><body><div class="shell">
<div class="nav"><div class="brand">Orchard Credit Union</div><div class="nav-links"><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M3 7h15a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-3v3M16 13h1"/></svg><span>Accounts</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg><span>Transfers</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M3 6h18v12H3zM3 10h18M7 15h4"/></svg><span>Cards</span></a><a class="nav-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a2b45" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Support</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></a></div></div>
<div class="main"><div class="inner">
<h1>Support</h1><p class="sub">Talk to a member of the team</p>
<h2>Send us a message</h2>
<div class="cols"><div><div class="field"><label>Topic</label><div class="input">Lost card</div></div><div class="field"><label>Account</label><div class="input">Everyday account</div></div></div><div><div class="field"><label>Phone</label><div class="input">555 0193</div></div><div class="field"><label>Best time to call</label><div class="input">Mornings</div></div></div></div><div class="row"><span class="btn">Send message</span><span class="btn ghost">Cancel</span></div>
</div></div></div></body></html>
