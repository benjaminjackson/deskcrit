<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cobalt Freight</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#f6f7f9;color:#1b2230;font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:16px;line-height:1.5}
.shell{display:flex;flex-direction:row;height:800px}
.nav{width:224px;flex:none;border-right:1px solid #dfe3ea;padding:24px 12px;background:#fff}
.brand{font-weight:700;font-size:18px;padding:0 12px 24px}
.nav-links{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#5d6677;font-size:15px}
.nav-item.active{color:#1f4fa3;font-weight:600;background:#e4ecf8}
.main{flex:1;padding:36px 40px 0 40px}
.inner{max-width:1000px}
h1{font-size:32px;line-height:1.2;font-weight:700;letter-spacing:-0.01em}
h2{font-size:20px;line-height:1.3;font-weight:600;margin-bottom:12px}
.sub{color:#5d6677;margin:6px 0 24px}
.row{display:flex;gap:16px;margin-bottom:24px}
.card{flex:1;background:#fff;border:1px solid #dfe3ea;border-radius:8px;padding:16px 18px}
.stat{font-size:28px;font-weight:700;margin-top:4px}
.delta{font-size:13px;color:#5d6677}
.btn{display:inline-block;background:#1f4fa3;color:#fff;font-weight:600;font-size:15px;padding:9px 18px;border-radius:4px;}
.btn.ghost{background:transparent;color:#1f4fa3;border:1px solid #1f4fa3}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #dfe3ea}
th{text-align:left;font-size:13px;color:#5d6677;font-weight:600;padding:10px 16px;border-bottom:1px solid #dfe3ea}
td{padding:11px 16px;border-bottom:1px solid #dfe3ea;font-size:15px}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:#e4ecf8;color:#1f4fa3;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.input{border:1px solid #dfe3ea;background:#fff;border-radius:4px;padding:9px 12px;font-size:15px}
.cols{display:flex;gap:32px}.cols>div{flex:1}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #dfe3ea}
.sw{width:38px;height:22px;border-radius:11px;background:#dfe3ea;position:relative}.sw.on{background:#1f4fa3}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:8px;background:#fff}.sw.on::after{left:19px}
.tl{border-left:2px solid #dfe3ea;padding-left:18px;margin-left:6px}
.tl div{margin-bottom:18px}.tl small{color:#5d6677;display:block;font-size:13px}
.cardicon{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-weight:600}
</style></head><body><div class="shell">
<div class="nav"><div class="brand">Cobalt Freight</div><div class="nav-links"><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Shipments</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Carriers</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span>Rates</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6z"/></svg><span>Documents</span></a><a class="nav-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f4fa3" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>Settings</span></a></div></div>
<div class="main"><div class="inner">
<h1>Settings</h1><p class="sub">Company and billing</p>
<div style="max-width:560px"><div class="toggle"><span>Email me when a shipment is delayed</span><span class="sw on"></span></div><div class="toggle"><span>Require a signature on delivery</span><span class="sw on"></span></div><div class="toggle"><span>Show prices with VAT</span><span class="sw"></span></div><div class="toggle"><span>Share tracking links with customers</span><span class="sw on"></span></div></div>
</div></div></div></body></html>
