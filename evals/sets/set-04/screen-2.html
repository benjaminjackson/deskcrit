<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Quillnote</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;background:#f6f7f9;color:#1b2230;font-family:Inter, 'Helvetica Neue', Arial, sans-serif;font-size:16px;line-height:1.5}
.shell{display:flex;flex-direction:row;height:800px}
.nav{width:224px;flex:none;border-right:1px solid #dfe3ea;padding:24px 12px;background:#fff}
.brand{font-weight:700;font-size:18px;padding:0 12px 24px}
.nav-links{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:#5d6677;font-size:15px}
.nav-item.active{color:#16897d;font-weight:600;background:#e1f2f0}
.main{flex:1;padding:36px 40px 0 40px}
.inner{max-width:1000px}
h1{font-size:32px;line-height:1.2;font-weight:700;letter-spacing:-0.01em}
h2{font-size:20px;line-height:1.3;font-weight:600;margin-bottom:12px}
.sub{color:#5d6677;margin:6px 0 24px}
.row{display:flex;gap:16px;margin-bottom:24px}
.card{flex:1;background:#fff;border:1px solid #dfe3ea;border-radius:8px;padding:16px 18px}
.stat{font-size:28px;font-weight:700;margin-top:4px}
.delta{font-size:13px;color:#5d6677}
.btn{display:inline-block;background:#16897d;color:#fff;font-weight:600;font-size:15px;padding:9px 18px;border-radius:6px;}
.btn.ghost{background:transparent;color:#16897d;border:1px solid #16897d}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #dfe3ea}
th{text-align:left;font-size:13px;color:#5d6677;font-weight:600;padding:10px 16px;border-bottom:1px solid #dfe3ea}
td{padding:11px 16px;border-bottom:1px solid #dfe3ea;font-size:15px}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:#e1f2f0;color:#16897d;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.input{border:1px solid #dfe3ea;background:#fff;border-radius:6px;padding:9px 12px;font-size:15px}
.cols{display:flex;gap:32px}.cols>div{flex:1}
.list{background:#fff;border:1px solid #dfe3ea;border-radius:8px}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #dfe3ea}.list-row:last-child{border-bottom:none}
.list-row small{color:#5d6677;font-size:13px}
.sw{width:38px;height:22px;border-radius:11px;background:#dfe3ea;position:relative}.sw.on{background:#16897d}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:8px;background:#fff}.sw.on::after{left:19px}
.cardicon{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-weight:600}
</style></head><body><div class="shell">
<div class="nav"><div class="brand">Quillnote</div><div class="nav-links"><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg><span>Notes</span></a><a class="nav-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16897d" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M19 19v2H6"/></svg><span>Notebooks</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg><span>Search</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/></svg><span>Shared</span></a><a class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6677" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></a></div></div>
<div class="main"><div class="inner">
<h1>Notebooks</h1><p class="sub">Group notes by project</p>
<div class="row"><span class="btn">New notebook</span><span class="btn ghost">Import</span></div>
<h2>All notebooks</h2>
<table><tr><th>Notebook</th><th>Notes</th><th>Sharing</th><th>Edited</th></tr><tr><td>Work</td><td>58</td><td><span class="tag">Shared</span></td><td>Today</td></tr><tr><td>Kitchen</td><td>41</td><td><span class="tag">Private</span></td><td>Yesterday</td></tr><tr><td>Reading</td><td>73</td><td><span class="tag">Private</span></td><td>Sun</td></tr><tr><td>Trips</td><td>12</td><td><span class="tag">Shared</span></td><td>Mon</td></tr></table>
</div></div></div></body></html>
