# A pack the schema rejects, for the EV-1 golden case of `crit packs validate` (FR-44, FR-45, US-6): the pack has a field the schema does not define, and its criterion has no fix. The fixtures check does not run until these are fixed.
name: validate-schema
version: 1.0.0
title: Validate schema test pack
license: MIT
homepage: https://example.com
criteria:
  - id: faint-body-text
    title: Body text is too faint to read
    source: Matthew Butterick, Practical Typography
    question:
      type: noul
      instructions: Is the body text in the image at image faint against its background?
      criteria:
        true: The body text is faint against its background.
        false: The body text stands out clearly from its background.
    fail_when:
      probability_at_least: 0.7
