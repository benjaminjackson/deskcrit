# A pack for the crit gate golden cases (EV-1). It is named golden and copies criteria from evals/golden/packs/golden/pack.yaml without changes, so the criterion ids match the question ids in evals/golden/answers/page.answers.json. With the recorded answers, the only finding is uncertain, so crit gate exits 0 under either policy.
name: golden
version: 1.0.0
title: Golden test pack
license: MIT
criteria:
  - id: competing-focal-points
    title: Several elements compete to be seen first
    source: Carl Dair, Design with Type
    question:
      type: score
      instructions: How many elements in the image at image compete to be seen first?
      levels:
        - One element is clearly seen first.
        - Two elements compete to be seen first.
        - Three or more elements compete to be seen first.
    pass_when:
      level_at_most: 0
    warn_when:
      level_at_most: 1
    min_confidence: 0.6
    fix: Make one element larger or stronger than the rest.
