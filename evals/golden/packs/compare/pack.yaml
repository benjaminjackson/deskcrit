# The pack the crit compare golden cases run (EV-1, EV-2). It is written for the tests and is not a first-party pack. It has one score, one choice, and two noul criteria with no locate, so each compare answers file in evals/golden/answers/compare-*.answers.json holds four answers per run, and one criterion that requires a fact, which both runs skip because the compare cases give no facts file. single-focal-point has the thresholds of the PRD verdict rule example, so the US-3 case moves it from level 2 (fail) to level 0 (pass).
name: compare
version: 1.0.0
title: Compare test pack
license: MIT
criteria:
  - id: single-focal-point
    title: Several elements compete to be seen first
    source: Carl Dair, Design with Type
    question:
      type: score
      instructions: How many elements in the image at image compete to be seen first?
      levels:
        - One element is clearly seen first.
        - Two elements compete to be seen first.
        - Three or more elements compete to be seen first.
    pass_when:
      level_at_most: 0
    warn_when:
      level_at_most: 1
    min_confidence: 0.6
    fix: Make one element larger or stronger than the rest.
  - id: faint-body-text
    title: Body text is too faint to read
    source: W3C, WCAG 2.2, Success Criterion 1.4.3
    link: https://www.w3.org/TR/WCAG22/#contrast-minimum
    question:
      type: noul
      instructions: Is the paragraph of body text in the image at image faint against its background?
      criteria:
        true: The body text is faint against its background.
        false: The body text stands out clearly from its background.
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: Darken the body text or lighten its background until the text stands out.
  - id: faint-chart-labels
    title: Chart labels are faint
    source: W3C, WCAG 2.2, Success Criterion 1.4.3
    link: https://www.w3.org/TR/WCAG22/#contrast-minimum
    question:
      type: noul
      instructions: Are the labels under the bars of the chart in the image at image faint against their background?
      criteria:
        true: The chart labels are faint against their background.
        false: The chart labels stand out clearly from their background.
    warn_when:
      probability_at_least: 0.7
    fix: Darken the chart labels until they stand out from the background.
  - id: line-length
    title: Lines of body text are too long or too short
    source: Robert Bringhurst, The Elements of Typographic Style
    question:
      type: choice
      instructions: How long are the lines of body text in the image at image?
      criteria:
        short: Most lines hold fewer than 45 characters.
        comfortable: Most lines hold 45 to 75 characters.
        long: Most lines hold more than 75 characters.
    pass_when:
      option_is: comfortable
    warn_when:
      option_in: [long]
    min_confidence: 0.6
    fix: Set the text column width so lines hold 45 to 75 characters.
  - id: content-fills-viewport
    title: The content leaves most of the viewport empty
    source: Ethan Marcotte, Responsive Web Design
    question:
      type: noul
      instructions: Does the content in the image at image leave most of the page width empty?
      criteria:
        true: The content leaves most of the page width empty.
        false: The content uses most of the page width.
    fail_when:
      probability_at_least: 0.7
    requires: [facts.viewport_width]
    fix: Let the content column grow with the viewport up to a comfortable maximum width.
