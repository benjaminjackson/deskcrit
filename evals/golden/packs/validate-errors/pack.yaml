# A pack that passes the schema but breaks the fixtures rule in four ways, for the EV-1 golden case of `crit packs validate` (FR-49): a path that leaves the pack, a missing negative list, a file that does not exist, and an empty negative list.
name: validate-errors
version: 1.0.0
title: Validate errors test pack
license: MIT
criteria:
  - id: faint-body-text
    title: Body text is too faint to read
    source: Matthew Butterick, Practical Typography
    question:
      type: noul
      instructions: Is the body text in the image at image faint against its background?
      criteria:
        true: The body text is faint against its background.
        false: The body text stands out clearly from its background.
    fail_when:
      probability_at_least: 0.7
    fix: Darken the body text or lighten its background.
    fixtures:
      positive:
        - fixtures/faint-body-text.positive.png
        - ../validate-ok/fixtures/faint-body-text.positive.png
  - id: faint-captions
    title: Captions are too faint to read
    source: Matthew Butterick, Practical Typography
    question:
      type: noul
      instructions: Are the captions in the image at image faint against their background?
      criteria:
        true: The captions are faint against their background.
        false: The captions stand out clearly from their background.
    fail_when:
      probability_at_least: 0.7
    fix: Darken the captions.
    fixtures:
      positive:
        - fixtures/faint-captions.positive.png
      negative: []
