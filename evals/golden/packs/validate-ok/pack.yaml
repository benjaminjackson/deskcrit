# A pack the EV-1 golden case for `crit packs validate` accepts: every criterion lists a positive and a negative fixture, and both files exist (FR-49). The fixtures are 8 by 8 px placeholders, because validate checks only that the files exist.
name: validate-ok
version: 1.0.0
title: Validate test pack
license: MIT
criteria:
  - id: faint-body-text
    title: Body text is too faint to read
    source: Matthew Butterick, Practical Typography
    question:
      type: noul
      instructions: Is the body text in the image at image faint against its background?
      criteria:
        true: The body text is faint against its background.
        false: The body text stands out clearly from its background.
    fail_when:
      probability_at_least: 0.7
    fix: Darken the body text or lighten its background.
    fixtures:
      positive:
        - fixtures/faint-body-text.positive.png
      negative:
        - fixtures/faint-body-text.negative.png
