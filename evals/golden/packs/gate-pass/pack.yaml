# A pack for the crit gate golden cases (EV-1). It is named golden and copies criteria from evals/golden/packs/golden/pack.yaml without changes, so the criterion ids match the question ids in evals/golden/answers/page.answers.json. With the recorded answers, every finding passes, so crit gate exits 0.
name: golden
version: 1.0.0
title: Golden test pack
license: MIT
criteria:
  - id: heading-larger-than-body
    title: The heading is not larger than the body text
    source: Carl Dair, Design with Type
    question:
      type: noul
      instructions: Is the heading in the image at image not clearly larger than the body text?
      criteria:
        true: The heading is not clearly larger than the body text.
        false: The heading is clearly larger than the body text.
    pass_when:
      probability_at_most: 0.3
    fix: Make the heading larger or bolder than the body text.
  - id: line-length
    title: Lines of body text are too long or too short
    source: Robert Bringhurst, The Elements of Typographic Style
    question:
      type: choice
      instructions: How long are the lines of body text in the image at image?
      criteria:
        short: Most lines hold fewer than 45 characters.
        comfortable: Most lines hold 45 to 75 characters.
        long: Most lines hold more than 75 characters.
    pass_when:
      option_is: comfortable
    warn_when:
      option_in: [long]
    fix: Set the text column width so lines hold 45 to 75 characters.
