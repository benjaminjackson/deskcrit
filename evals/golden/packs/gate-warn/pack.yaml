# A pack for the crit gate golden cases (EV-1). It is named golden and copies criteria from evals/golden/packs/golden/pack.yaml without changes, so the criterion ids match the question ids in evals/golden/answers/page.answers.json. With the recorded answers, the worst finding is a warn, so crit gate exits 0 by default and 1 with warn_fails_gate: true.
name: golden
version: 1.0.0
title: Golden test pack
license: MIT
criteria:
  - id: faint-chart-labels
    title: Chart labels are faint
    source: W3C, WCAG 2.2, Success Criterion 1.4.3
    link: https://www.w3.org/TR/WCAG22/#contrast-minimum
    question:
      type: noul
      instructions: Are the labels under the bars of the chart in the image at image faint against their background?
      criteria:
        true: The chart labels are faint against their background.
        false: The chart labels stand out clearly from their background.
    warn_when:
      probability_at_least: 0.7
    fix: Darken the chart labels until they stand out from the background.
  - id: heading-larger-than-body
    title: The heading is not larger than the body text
    source: Carl Dair, Design with Type
    question:
      type: noul
      instructions: Is the heading in the image at image not clearly larger than the body text?
      criteria:
        true: The heading is not clearly larger than the body text.
        false: The heading is clearly larger than the body text.
    pass_when:
      probability_at_most: 0.3
    fix: Make the heading larger or bolder than the body text.
