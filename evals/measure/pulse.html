<!doctype html>
<!--
  A page with no dark mode whose button color pulses on its own, for measure.mjs --dark (PRD FR-85,
  crit-9w5.4). The review of crit-9w5.4 found that two loads read at different moments gave
  different button colors, which the system-setting check took for a dark mode.
  evals/measure/browser-check.mjs measures it with --dark and checks that dark_mode.found_by is none.
-->
<html><head><meta charset="utf-8"><title>Pulse</title>
<style>body{font:16px sans-serif;margin:24px;background:#fff;color:#222}
@keyframes pulse{0%{background:#0055cc}50%{background:#3388ff}100%{background:#0055cc}}
button{animation:pulse 1.7s infinite;color:#fff;border:0;padding:12px 20px}</style></head>
<body><h1>Plain page, no dark mode</h1><p>Some text.</p><button type="button">Buy now</button></body></html>
