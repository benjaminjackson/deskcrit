<!doctype html>
<!--
  A page that respects the system setting, for measure.mjs --dark (PRD FR-85, crit-9w5.4).
  evals/measure/browser-check.mjs measures it with --dark and checks that facts.json has a
  desktop-dark entry with color_scheme dark and dark_mode.found_by system_setting;
  dark-media.facts.json is its committed output from a --dark run.
  Known values: light is #111111 text on #ffffff; a prefers-color-scheme: dark rule makes it
  #eeeeee text on #121212. The body has a 0.3 s color transition, so a measure that read colors
  during a transition would get a mixed color.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dark by system setting</title>
  <style>
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("../../packs/_renderer/fonts/inter-latin-400-normal.woff2") format("woff2");
    }
    body { margin: 0; background: #ffffff; color: #111111; font-family: "Inter", sans-serif; transition: background-color 0.3s, color 0.3s; }
    main { padding: 40px; }
    h1 { margin: 0 0 24px; font-size: 32px; line-height: 40px; font-weight: 400; }
    p { margin: 0 0 24px; font-size: 16px; line-height: 24px; max-width: 40ch; }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #eeeeee; }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Follows the system</h1>
    <p id="body">This page turns dark when the system asks for a dark color scheme, through a media rule.</p>
  </main>
</body>
</html>
