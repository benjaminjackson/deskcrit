<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hash slides</title>
<!-- A two-slide deck for the browser check of measure.mjs (FR-82, crit-3wg). The hash picks the
     slide: hash-slides.html#2 shows slide 2 only, and with no hash or with #1 only slide 1 shows. -->
<style>
  body { margin: 0; font-family: sans-serif; color: #111; background: #fff; }
  section { display: none; width: 1280px; height: 800px; box-sizing: border-box; padding: 120px; }
  section:target { display: block; }
  body:not(:has(section:target)) section[id="1"] { display: block; }
</style>
</head>
<body>
<section id="1"><h1 id="heading-one">Slide one</h1></section>
<section id="2"><h1 id="heading-two">Slide two</h1></section>
</body>
</html>
