<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hash scroll</title>
<!-- A three-slide deck for the browser check of measure.mjs (FR-79, FR-82, crit-3wg). Every slide
     shows, one under the other, and the hash only scrolls: hash-scroll.html#2 must still measure
     slide 2 alone, at 1280 x 800 px, with its heading 120 px from the slide's top and left. The 40 px padding of the body puts the slide off the page origin, so the boxes must move into the slide's pixels. -->
<style>
  body { margin: 0; padding: 40px; font-family: sans-serif; color: #111; background: #fff; }
  section { width: 1280px; height: 800px; box-sizing: border-box; padding: 120px; }
  h1 { margin: 0; font-size: 48px; line-height: 60px; }
</style>
</head>
<body>
<section id="1"><h1 id="heading-one">Slide one</h1></section>
<section id="2"><h1 id="heading-two">Slide two</h1></section>
<section id="3"><h1 id="heading-three">Slide three</h1></section>
</body>
</html>
