<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hash anchor</title>
<!-- A page whose hash names an anchor with no size, for the browser check of measure.mjs
     (FR-79, crit-3wg): hash-anchor.html#top must measure the same text blocks as the page with
     no hash, plus a note that the whole page is measured. -->
<style>
  body { margin: 0; padding: 40px; font-family: sans-serif; color: #111; background: #fff; }
</style>
</head>
<body>
<a id="top"></a>
<h1 id="title">A page with a top anchor</h1>
<p id="intro">The anchor above has no size, so it cannot be a slide.</p>
</body>
</html>
