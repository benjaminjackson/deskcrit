# A pack for the crit packs test durable test (EV-4, FR-50): the negative fixture fixtures/missing.png does not exist, so the run exits 2 before it reads the key.
name: missing-image
version: 1.0.0
title: Packs test pack missing-image
license: MIT
criteria:
  - id: solid-red
    title: The image is solid red
    source: A test question for the crit packs test durable test, not a design guideline
    question:
      type: noul
      instructions: Is the image at image filled edge to edge with one solid red color?
      criteria:
        true: The whole image is one solid red color.
        false: The image is not red; it is filled with white, blue, or another color that is not red.
    fail_when:
      probability_at_least: 0.7
    fix: Fill the image with a color that is not red.
    fixtures:
      positive:
        - fixtures/red.png
      negative:
        - fixtures/missing.png
