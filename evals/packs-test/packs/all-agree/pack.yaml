# A pack for the crit packs test durable test (EV-4, FR-50): red.png is solid red and white.png is solid white, so both fixtures agree and the live run exits 0.
name: all-agree
version: 1.0.0
title: Packs test pack all-agree
license: MIT
criteria:
  - id: solid-red
    title: The image is solid red
    source: A test question for the crit packs test durable test, not a design guideline
    question:
      type: noul
      instructions: Is the image at image filled edge to edge with one solid red colour?
      criteria:
        true: The whole image is one solid red colour.
        false: The image is not red; it is filled with white, blue, or another colour that is not red.
    fail_when:
      probability_at_least: 0.7
    fix: Fill the image with a colour that is not red.
    fixtures:
      positive:
        - fixtures/red.png
      negative:
        - fixtures/white.png
