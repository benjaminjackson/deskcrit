# A pack for the crit packs test durable test (EV-4, FR-50): the criterion has no fix, so the schema rejects the pack and the run exits 2 before it reads the key.
name: invalid-pack
version: 1.0.0
title: Packs test pack invalid-pack
license: MIT
criteria:
  - id: solid-red
    title: The image is solid red
    source: A test question for the crit packs test durable test, not a design guideline
    question:
      type: noul
      instructions: Is the image at image filled edge to edge with one solid red colour?
      criteria:
        true: The whole image is one solid red colour.
        false: The image is not red; it is filled with white, blue, or another colour that is not red.
    fail_when:
      probability_at_least: 0.7
    fixtures:
      positive:
        - fixtures/red.png
      negative:
        - fixtures/white.png
