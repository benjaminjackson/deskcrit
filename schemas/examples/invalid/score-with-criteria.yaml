# A score question also has criteria.
# expect: /criteria/0/question not
name: example
version: 1.0.0
title: Example pack
license: MIT
criteria:
  - id: single-focal-point
    title: The page has no single focal point
    source: Robin Williams, The Non-Designer's Design Book
    question:
      type: score
      instructions: How many elements in the image at image compete to be seen first?
      criteria:
        one: One element.
      levels:
        - One element is seen first.
        - Two or more elements compete.
    pass_when:
      level_at_most: 0
    fix: Make one element stronger than the rest.
