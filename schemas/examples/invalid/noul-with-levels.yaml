# A noul question also has levels.
# expect: /criteria/0/question not
name: example
version: 1.0.0
title: Example pack
license: MIT
criteria:
  - id: faint-body-text
    title: Body text is too faint to read
    source: Matthew Butterick, Practical Typography
    question:
      type: noul
      instructions: Is the body text in the image at image faint against its background?
      levels: [Faint, Dark]
      criteria:
        true: The body text is faint.
        false: The body text is dark enough to read.
    fail_when:
      probability_at_least: 0.7
    fix: Darken the body text.
