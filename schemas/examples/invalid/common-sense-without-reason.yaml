# A common-sense criterion has no reason (FR-45).
# expect: /criteria/0 required
name: example
version: 1.0.0
title: Example pack
license: MIT
criteria:
  - id: actions-look-like-plain-text
    title: An action looks like plain text
    source: Common sense
    question:
      type: noul
      instructions: Does the image at image show an action, such as a button or link, that looks like plain text?
      criteria:
        true: An action looks the same as the plain text around it.
        false: Every action looks different from plain text.
    warn_when:
      probability_at_least: 0.7
    fix: Give each action a shape, color, or underline that plain text does not have.
