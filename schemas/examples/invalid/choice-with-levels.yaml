# A choice question also has levels.
# expect: /criteria/0/question not
name: example
version: 1.0.0
title: Example pack
license: MIT
criteria:
  - id: line-length
    title: Lines of body text are too long
    source: Robert Bringhurst, The Elements of Typographic Style
    question:
      type: choice
      instructions: How long are the lines of body text in the image at image?
      levels: [Short, Long]
      criteria:
        comfortable: Most lines hold 45 to 75 characters.
        long: Most lines hold more than 75 characters.
    pass_when:
      option_is: comfortable
    fix: Narrow the text column.
