# Only the required fields: one noul criterion with one fail_when predicate.
name: minimal
version: 1.0.0
title: Minimal pack
license: MIT
criteria:
  - id: faint-body-text
    title: Body text is too faint to read
    source: Matthew Butterick, Practical Typography
    question:
      type: noul
      instructions: Is the body text in the image at image hard to read because it is faint against its background?
      criteria:
        true: The body text is faint and hard to read.
        false: The body text is dark enough to read with ease.
    fail_when:
      probability_at_least: 0.7
    fix: Darken the body text or lighten its background.
