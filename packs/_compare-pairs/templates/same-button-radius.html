<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Compare pair: same, button corner radius</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * EV-9 same pair. A sign-up page for a community radio newsletter. The only
 * change is the corner radius of the two buttons, 4 px on one side and 8 px
 * on the other. No criterion covers it, so every verdict should stay the same.
 */
body { background: #f4f5f7; }
.card { width: 460px; margin: 110px auto 0; padding: 40px 44px; background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(16, 24, 40, 0.08); }
.card .station { font-size: 14px; font-weight: 700; color: #7b3fa0; margin-bottom: 10px; }
h1 { font-size: 28px; font-weight: 700; line-height: 1.25; margin-bottom: 10px; }
.card p { font-size: 16px; line-height: 1.55; color: #3d434b; margin-bottom: 24px; }
label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.field { height: 44px; border: 1px solid #c5cad1; border-radius: 6px; margin-bottom: 18px; padding: 10px 12px; font-size: 15px; color: #6b7280; }
.button { display: block; padding: 12px 0; text-align: center; font-size: 16px; font-weight: 700; background: #7b3fa0; color: #fff; border-radius: 4px; }
.alt { display: block; margin-top: 12px; padding: 12px 0; text-align: center; font-size: 15px; color: #3d434b; border: 1px solid #c5cad1; border-radius: 4px; }

[data-defect="on"] .button,
[data-defect="on"] .alt { border-radius: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="station">Riverside FM 97.4</p>
      <h1>Get the weekly show list</h1>
      <p>Every Friday we send the next week's programmes, guest names, and any changes to the schedule.</p>
      <label>Email address</label>
      <div class="field">you@example.com</div>
      <span class="button">Subscribe</span>
      <span class="alt">Read last week's list</span>
    </div>
  </body>
</html>
