<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Compare pair: no dominant element, pair 2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * EV-9 pair, criterion no-dominant-element. A sales dashboard. The revenue
 * card spans two columns and shows its figure at 52 px, so it is seen first.
 * With the defect it takes one column and its figure is 32 px, the same as
 * the other six cards, so seven equal cards compete. Nothing else changes.
 */
body { background: #f5f6f8; }
.top { height: 64px; padding: 0 48px; display: flex; align-items: center; background: #fff; border-bottom: 1px solid #e3e6ea; font-size: 17px; font-weight: 700; }
main { padding: 36px 48px; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.card { background: #fff; border-radius: 8px; padding: 22px 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); height: 156px; }
.card .label { font-size: 14px; color: #555d68; margin-bottom: 8px; }
.card .value { font-size: 32px; font-weight: 700; line-height: 1.15; }
.card .delta { font-size: 14px; color: #15803d; margin-top: 6px; }
.card.lead { grid-column-start: 1; grid-column-end: 3; }
.card.lead .value { font-size: 52px; }
.chart { margin-top: 20px; height: 300px; background: #fff; border-radius: 8px; padding: 22px 24px; }
.chart .label { font-size: 14px; color: #555d68; }
.bars { display: flex; align-items: flex-end; gap: 14px; height: 220px; margin-top: 16px; }
.bars span { width: 64px; background: #9db4d6; border-radius: 3px 3px 0 0; }

[data-defect="on"] .card.lead { grid-column-start: auto; grid-column-end: auto; }
[data-defect="on"] .card.lead .value { font-size: 32px; }
    </style>
  </head>
  <body>
    <div class="top">Tidewater Supply · Sales</div>
    <main>
      <h1>October so far</h1>
      <div class="grid">
        <div class="card lead"><p class="label">Revenue</p><p class="value">$184,320</p><p class="delta">+12% on September</p></div>
        <div class="card"><p class="label">Orders</p><p class="value">1,406</p><p class="delta">+5%</p></div>
        <div class="card"><p class="label">Average order</p><p class="value">$131</p><p class="delta">+7%</p></div>
        <div class="card"><p class="label">Returns</p><p class="value">2.1%</p><p class="delta">-0.4 points</p></div>
        <div class="card"><p class="label">New customers</p><p class="value">318</p><p class="delta">+9%</p></div>
        <div class="card"><p class="label">Repeat customers</p><p class="value">61%</p><p class="delta">+2 points</p></div>
        <div class="card"><p class="label">Items per order</p><p class="value">3.4</p><p class="delta">+0.2</p></div>
      </div>
      <div class="chart"><p class="label">Revenue by week</p><div class="bars"><span style="height:120px"></span><span style="height:150px"></span><span style="height:132px"></span><span style="height:176px"></span><span style="height:160px"></span><span style="height:190px"></span><span style="height:204px"></span><span style="height:182px"></span></div></div>
    </main>
  </body>
</html>
