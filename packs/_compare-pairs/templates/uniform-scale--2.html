<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Compare pair: uniform scale, pair 2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * EV-9 pair, criterion uniform-scale. An architecture studio's project page.
 * The page title is 48 px and the featured project fills a wide first column.
 * With the defect the title drops to 22 px, the size of the project names,
 * and the grid becomes three equal columns, so every element is the same
 * size. Nothing else changes.
 */
body { background: #f2f1ee; }
header { height: 64px; padding: 0 72px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; }
header b { font-size: 17px; letter-spacing: 0.04em; }
main { margin: 36px 72px 0; }
h1 { font-size: 48px; font-weight: 300; line-height: 1.1; margin-bottom: 28px; color: #22201c; }
.grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 24px; }
.project .img { height: 360px; margin-bottom: 12px; }
.project h2 { font-size: 22px; font-weight: 400; color: #22201c; }
.project p { font-size: 14px; color: #5a5650; }

[data-defect="on"] h1 { font-size: 22px; }
[data-defect="on"] .grid { grid-template-columns: 1fr 1fr 1fr; }
    </style>
  </head>
  <body>
    <header><b>OKAFOR HALE ARCHITECTS</b><span>Projects · Studio · Contact</span></header>
    <main>
      <h1>Recent work</h1>
      <div class="grid">
        <article class="project"><div class="img" style="background:#b9ad9b"></div><h2>Coldharbour Lane library</h2><p>Public library, 2,400 m², completed 2025</p></article>
        <article class="project"><div class="img" style="background:#a4a9a2"></div><h2>Two houses on Weir Road</h2><p>Housing, completed 2024</p></article>
        <article class="project"><div class="img" style="background:#c8bfb2"></div><h2>Ferry terminal canopy</h2><p>Transport, completed 2023</p></article>
      </div>
    </main>
  </body>
</html>
