<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="crit-viewport" content="390x844">
    <title>Compare pair: all caps long text, pair 2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * EV-9 pair, criterion all-caps-long-text. A phone screen of a yoga studio
 * app. The welcome paragraph under the heading runs to four lines in sentence
 * case, or entirely in capitals with the defect. Nothing else changes.
 */
html, body { width: 390px; height: 844px; }
body { background: #f3efe9; }
.top { height: 56px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 700; }
.hero { margin: 8px 20px 0; height: 210px; border-radius: 12px; background: linear-gradient(140deg, #c7b9a6, #8f8a7b); }
main { padding: 24px 20px 0; }
h1 { font-family: var(--font-serif); font-size: 30px; font-weight: 700; line-height: 1.2; margin-bottom: 12px; color: #2f2a24; }
.welcome { font-size: 16px; line-height: 1.55; color: #3c362f; margin-bottom: 24px; }
.class { display: flex; justify-content: space-between; padding: 14px 0; border-top: 1px solid #ddd5ca; font-size: 15px; }
.class b { display: block; font-size: 16px; }
.book { margin: 20px 0 0; padding: 14px 0; text-align: center; background: #2f2a24; color: #fff; font-size: 16px; font-weight: 700; border-radius: 24px; }

[data-defect="on"] .welcome { text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="top"><span>Stillwater Yoga</span><span>Menu</span></div>
    <div class="hero" role="img" aria-label="The studio room"></div>
    <main>
      <h1>Good morning, Dana</h1>
      <p class="welcome">Your class pass has six sessions left and runs until 30 November. Book at least two hours ahead, and cancel by 8 pm the night before to keep the session.</p>
      <div class="class"><div><b>Slow flow</b>7:00 am · Room 2</div><span>4 spaces</span></div>
      <div class="class"><div><b>Mobility</b>12:15 pm · Room 1</div><span>9 spaces</span></div>
      <div class="book">Book a class</div>
    </main>
  </body>
</html>
