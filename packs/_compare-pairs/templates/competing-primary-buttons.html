<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Compare pair: competing primary buttons</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * EV-9 pair, criterion competing-primary-buttons. A project page with a
 * dialog that asks to archive the project. "Archive project" is the filled
 * button. "Cancel" is an outlined button, or the same filled blue button with
 * the defect. Nothing else changes.
 */
body { background: #e9ecf0; }
.page { padding: 36px 64px; color: #9aa1aa; }
.page h1 { font-size: 26px; margin-bottom: 18px; }
.ghost { height: 52px; margin-bottom: 12px; background: #dde1e7; border-radius: 6px; }
.dialog { position: absolute; left: 400px; top: 210px; width: 480px; padding: 30px 32px; background: #fff; border-radius: 10px; box-shadow: 0 12px 40px rgba(20, 30, 50, 0.25); }
.dialog h2 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
.dialog p { font-size: 16px; line-height: 1.55; margin-bottom: 28px; color: #2d333b; }
.actions { display: flex; justify-content: flex-end; gap: 12px; }
.button { padding: 10px 22px; font-size: 15px; border-radius: 6px; border: 1px solid #c4cad3; background-color: #fff; color: #2d333b; font-weight: 400; }
.button.primary { background-color: #2457c5; border-color: #2457c5; color: #fff; font-weight: 700; }

[data-defect="on"] .button { background-color: #2457c5; border-color: #2457c5; color: #fff; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Harbour Road refit</h1>
      <div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div>
    </div>
    <div class="dialog">
      <h2>Archive this project?</h2>
      <p>The project and its 38 tasks move to the archive. Members can still read them, but no one can add tasks or comments until you restore it.</p>
      <div class="actions"><span class="button">Cancel</span><span class="button primary">Archive project</span></div>
    </div>
  </body>
</html>
