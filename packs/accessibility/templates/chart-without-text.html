<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Accessibility fixture: chart without text</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion chart-without-text. A web analytics dashboard with three summary
 * tiles and a line chart of visits from three channels over twelve weeks.
 * The defect switch hides the chart's legend, its value axis numbers, and its
 * week labels, so the three colored lines carry no words. The card title
 * stays on both sides. No text changes.
 */
body { background: #f5f6f8; }
.top { height: 60px; background: #ffffff; border-bottom: 1px solid #e3e6ea; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; font-size: 15px; color: #3d444d; }
.top b { color: #1f2328; font-size: 17px; }
.main { padding: 28px 48px; }
h1 { font-size: 24px; margin-bottom: 18px; }
.tiles { display: flex; gap: 20px; margin-bottom: 20px; }
.tile { flex: 1; background: #ffffff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 16px 20px; }
.tile .k { font-size: 14px; color: #59636e; }
.tile .v { font-size: 26px; font-weight: 700; margin-top: 4px; }
.tile .d { font-size: 13px; color: #1a7f37; margin-top: 2px; }
.card { background: #ffffff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 18px 22px; }
.card h2 { font-size: 17px; margin-bottom: 8px; }
.legend { display: flex; gap: 22px; font-size: 14px; color: #3d444d; margin-bottom: 4px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
svg text { font-family: var(--font-sans); font-size: 12px; fill: #59636e; }
.grid { stroke: #eceef1; }
.l { fill: none; stroke-width: 2.5; }
[data-defect="on"] .legend, [data-defect="on"] svg text { display: none; }
    </style>
  </head>
  <body>
    <div class="top"><b>Brightpath Analytics</b><span>Last 12 weeks</span></div>
    <div class="main">
      <h1>Overview</h1>
      <div class="tiles">
        <div class="tile"><div class="k">Visits</div><div class="v">184,220</div><div class="d">+6.1% vs previous 12 weeks</div></div>
        <div class="tile"><div class="k">Sign-ups</div><div class="v">3,912</div><div class="d">+2.4% vs previous 12 weeks</div></div>
        <div class="tile"><div class="k">Conversion rate</div><div class="v">2.12%</div><div class="d">+0.1 pts vs previous 12 weeks</div></div>
      </div>
      <div class="card">
        <h2>Visits by channel</h2>
        <div class="legend"><span><i style="background:#2f6fde"></i>Search</span><span><i style="background:#e0812f"></i>Social</span><span><i style="background:#2a9d7c"></i>Email</span></div>
        <svg width="1140" height="400" viewBox="0 0 1140 400">
          <line class="grid" x1="50" y1="30" x2="1130" y2="30"/><line class="grid" x1="50" y1="110" x2="1130" y2="110"/><line class="grid" x1="50" y1="190" x2="1130" y2="190"/><line class="grid" x1="50" y1="270" x2="1130" y2="270"/><line x1="50" y1="350" x2="1130" y2="350" stroke="#c3c8cf"/>
          <text x="40" y="34" text-anchor="end">8k</text><text x="40" y="114" text-anchor="end">6k</text><text x="40" y="194" text-anchor="end">4k</text><text x="40" y="274" text-anchor="end">2k</text><text x="40" y="354" text-anchor="end">0</text>
          <polyline class="l" stroke="#2f6fde" points="70,150 165,140 260,128 355,136 450,118 545,110 640,104 735,112 830,96 925,90 1020,84 1115,78"/>
          <polyline class="l" stroke="#e0812f" points="70,230 165,214 260,236 355,206 450,222 545,196 640,212 735,186 830,204 925,190 1020,176 1115,184"/>
          <polyline class="l" stroke="#2a9d7c" points="70,290 165,286 260,280 355,284 450,276 545,270 640,274 735,266 830,262 925,268 1020,258 1115,254"/>
          <text x="70" y="374" text-anchor="middle">Jul 7</text><text x="260" y="374" text-anchor="middle">Jul 21</text><text x="450" y="374" text-anchor="middle">Aug 4</text><text x="640" y="374" text-anchor="middle">Aug 18</text><text x="830" y="374" text-anchor="middle">Sep 1</text><text x="1020" y="374" text-anchor="middle">Sep 15</text>
        </svg>
      </div>
    </div>
  </body>
</html>
