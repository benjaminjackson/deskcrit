<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Accessibility fixture: chart without text 5</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion chart-without-text. A school district's results page with a
 * grouped bar chart that compares this year with last year in five subjects.
 * The defect switch hides the legend, the subject names, and the value axis
 * numbers, so the two colors and the bar groups carry no words. The section
 * heading stays on both sides. No text changes.
 */
body { background: #ffffff; }
.band { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 110px; border-bottom: 4px solid #6a1b9a; }
.band b { font-size: 20px; }
.band span { font-size: 15px; color: #3d444d; display: flex; gap: 26px; }
.main { padding: 32px 110px 0; }
h1 { font-size: 30px; margin-bottom: 8px; }
.lead { font-size: 17px; color: #3d444d; margin-bottom: 22px; width: 820px; line-height: 1.55; }
h2 { font-size: 19px; margin-bottom: 6px; }
.legend { display: flex; gap: 24px; font-size: 14px; color: #3d444d; margin-bottom: 4px; }
.legend i { display: inline-block; width: 14px; height: 14px; margin-right: 7px; vertical-align: -2px; }
svg text { font-family: var(--font-sans); font-size: 13px; fill: #3d444d; }
[data-defect="on"] .legend, [data-defect="on"] svg text { display: none; }
    </style>
  </head>
  <body>
    <div class="band"><b>Redfield School District</b><span><span>Schools</span><span>Families</span><span>Results</span><span>News</span></span></div>
    <div class="main">
      <h1>Spring assessment results</h1>
      <div class="lead">Share of grade 8 students who met the standard in each subject, compared with the year before. Results for each school are on its own page.</div>
      <h2>Students meeting the standard</h2>
      <div class="legend"><span><i style="background:#6a1b9a"></i>2025</span><span><i style="background:#c9a7e0"></i>2024</span></div>
      <svg width="1060" height="420" viewBox="0 0 1060 420">
        <line x1="60" y1="20" x2="1050" y2="20" stroke="#eceef1"/><line x1="60" y1="110" x2="1050" y2="110" stroke="#eceef1"/><line x1="60" y1="200" x2="1050" y2="200" stroke="#eceef1"/><line x1="60" y1="290" x2="1050" y2="290" stroke="#eceef1"/><line x1="60" y1="380" x2="1050" y2="380" stroke="#8c959f"/>
        <text x="50" y="24" text-anchor="end">80%</text><text x="50" y="114" text-anchor="end">60%</text><text x="50" y="204" text-anchor="end">40%</text><text x="50" y="294" text-anchor="end">20%</text><text x="50" y="384" text-anchor="end">0%</text>
        <rect x="110" y="88" width="70" height="292" fill="#6a1b9a"/><rect x="184" y="115" width="70" height="265" fill="#c9a7e0"/>
        <rect x="306" y="142" width="70" height="238" fill="#6a1b9a"/><rect x="380" y="133" width="70" height="247" fill="#c9a7e0"/>
        <rect x="502" y="70" width="70" height="310" fill="#6a1b9a"/><rect x="576" y="97" width="70" height="283" fill="#c9a7e0"/>
        <rect x="698" y="169" width="70" height="211" fill="#6a1b9a"/><rect x="772" y="187" width="70" height="193" fill="#c9a7e0"/>
        <rect x="894" y="106" width="70" height="274" fill="#6a1b9a"/><rect x="968" y="124" width="70" height="256" fill="#c9a7e0"/>
        <text x="182" y="402" text-anchor="middle">Reading</text><text x="378" y="402" text-anchor="middle">Math</text><text x="574" y="402" text-anchor="middle">Writing</text><text x="770" y="402" text-anchor="middle">Science</text><text x="966" y="402" text-anchor="middle">History</text>
      </svg>
    </div>
  </body>
</html>
