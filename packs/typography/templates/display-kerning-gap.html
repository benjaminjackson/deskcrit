<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Typography fixture: display kerning gap</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="display-kerning-gap.css">
  </head>
  <body>
    <main class="poster">
      <p class="label">Saturday market</p>
      <h1><span class="gap">W</span>arm <span class="gap">Y</span>east <span class="gap">T</span>arts</h1>
      <p class="note">Baked at dawn on Harbour Street and sold until the last tray is empty.</p>
    </main>
  </body>
</html>
