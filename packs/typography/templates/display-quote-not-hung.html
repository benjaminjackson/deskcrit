<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Typography fixture: display quote not hung</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="display-quote-not-hung.css">
  </head>
  <body>
    <main class="opener">
      <p class="kicker">Harbour Notes, issue 14</p>
      <blockquote class="pull">“The harbour is quietest just before the first ferry leaves, and that is when the gulls get bold.”</blockquote>
      <p class="byline">Mara Ellison, ferry master at Pike Landing</p>
      <p class="note">The dawn crossing departs at 5:40 and carries bicycles, bread deliveries, and a few early walkers.</p>
    </main>
  </body>
