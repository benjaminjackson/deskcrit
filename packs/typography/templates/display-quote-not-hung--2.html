<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Typography fixture: display quote not hung 2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="display-quote-not-hung--2.css">
  </head>
  <body>
    <main class="poster">
      <p class="label">Library late night</p>
      <blockquote class="pull">“A good book keeps the lamp on long after closing time.”</blockquote>
      <p class="note">Doors open at 7 pm on the second Friday of each month. Hot cocoa is served in the reading room.</p>
    </main>
  </body>
</html>
