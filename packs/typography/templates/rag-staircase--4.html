<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Typography fixture: rag staircase, variant 4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="rag-staircase--4.css">
  </head>
  <body>
    <main class="volunteers">
      <h1>Pond day</h1>
      <p>
        <span class="l">Every spring the volunteers meet at the pond</span>
        <span class="l">to clear the reeds,</span>
        <span class="l">mend the fence,</span>
        <span class="l">and fill the feeders.</span>
        <span class="l">Children bring nets and jars</span>
        <span class="l">to look for newts, and by noon</span>
        <span class="l">the whole group is sitting on the bank with sandwiches</span>
        <span class="l">and hot soup from the flask that someone brought.</span>
      </p>
    </main>
  </body>
