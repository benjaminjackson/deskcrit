<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Typography fixture: stacked emphasis 4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="stacked-emphasis--4.css">
  </head>
  <body>
    <main class="help">
      <h1>Before you set out</h1>
      <p>Wear <span class="x1">sturdy boots</span> and carry <span class="x2">at least two litres of water</span>. The path is <span class="x3">steep and loose</span> near the top.</p>
      <p>Turn back if you see <span class="x4">cloud on the summit</span>, and tell someone at the hostel <span class="x5">when you expect to return</span>.</p>
    </main>
  </body>
