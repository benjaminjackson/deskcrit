<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Typography fixture: rag staircase, variant 3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="rag-staircase--3.css">
  </head>
  <body>
    <main class="notice">
      <h1>Notice to readers</h1>
      <p>
        <span class="l">The library will close early on Friday</span>
        <span class="l">for the shelves.</span>
        <span class="l">Returns can be made at the front door</span>
        <span class="l">until noon.</span>
        <span class="l">Reading groups will meet in the garden room</span>
        <span class="l">as usual.</span>
        <span class="l">Anyone who needs a quiet table should</span>
        <span class="l">ask at the desk.</span>
      </p>
    </main>
  </body>
