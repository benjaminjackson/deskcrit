<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Typography fixture: rag staircase, variant 1</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="rag-staircase.css">
  </head>
  <body>
    <main class="page">
      <h1>River ferry</h1>
      <p>
        <span class="l">The ferry leaves the north landing every morning,</span>
        <span class="l">crosses the river in about twelve minutes,</span>
        <span class="l">ties up at the market quay beside</span>
        <span class="l">the old harbour wall, and waits</span>
        <span class="l">while the passengers step off</span>
        <span class="l">and the next ones come on</span>
        <span class="l">board. By ten the boat</span>
        <span class="l">is back and the</span>
        <span class="l">crew has tea.</span>
      </p>
    </main>
  </body>
</html>
