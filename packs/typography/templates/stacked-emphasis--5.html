<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Typography fixture: stacked emphasis 5</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="stacked-emphasis--5.css">
  </head>
  <body>
    <main class="mail">
      <p class="from">The Bakery Bulletin</p>
      <h1>This week at the oven</h1>
      <p>Our <i class="y1">rye loaf</i> is back, baked with seeds from the farm up the road. The <i class="y2">cinnamon buns</i> are ready by eight, and the <i class="y3">sourdough</i> follows at nine.</p>
      <p>Orders for the weekend <i class="y4">close on Thursday</i>. Pick-ups are at the side door, and every bag is <i class="y5">warm from the oven</i>.</p>
    </main>
  </body>
