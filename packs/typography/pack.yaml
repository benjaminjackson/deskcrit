  # GUIDELINES.md: Even word spacing in justified text
  - id: justified-word-gaps
    title: "Justified lines have holes between words"
    source: "Bringhurst, The Elements of Typographic Style, sections 2.1.3 and 2.1.10 \"Don't stretch the space until it is broken\"; Hochuli, Detail in Typography, chapter \"The line\", on the space between words."
    question:
      type: noul
      instructions: "In the image at screenshot: In justified text, do some lines have gaps between words that are much wider than the gaps in the lines around them? Judge only what is visible."
      criteria:
        "true": "In justified text, some lines have gaps between words that are much wider than in the lines around them."
        "false": "The gaps between words are even from line to line, or the text is not justified."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Keep word spaces even: justify only where the measure is wide enough and hyphenation is on, and set the text ragged right otherwise (Bringhurst, The Elements of Typographic Style, 2.1.3 and 2.1.10; Hochuli, Detail in Typography, \"The line\"). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
