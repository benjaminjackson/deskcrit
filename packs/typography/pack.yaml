  # GUIDELINES.md: Ligatures
  - id: display-ligature-missing
    title: "In a large headline, the f strikes the dot of the following i"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), section 3.3.1, p. 50; Butterick, Practical Typography, \"Ligatures\"."
    question:
      type: noul
      instructions: "In the image at screenshot: In a large headline, where a letter f is followed by a letter i, do the two letters merge at the top, so that the curved top of the f and the dot of the i run together into one dark blob with no gap between them? Judge only what is visible."
      criteria:
        "true": "In a large headline, the curved top of an f and the dot of the following i run together into one dark blob with no gap between them."
        "false": "In every large headline, the top of each f and the dot of a following i are separate with a gap between them, or they are joined in one designed fi letter with no separate dot, or no headline has an f followed by an i."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Turn on the face's fi ligature in large headlines wherever the f overlaps a following i, so the two letters join cleanly (Bringhurst, The Elements of Typographic Style, 3.3.1, p. 50; Butterick, Practical Typography, \"Ligatures\"). [draft until Benjamin Jackson approves (G-4)]"
