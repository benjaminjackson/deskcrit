  # GUIDELINES.md: Rag quality in ragged-right text
  - id: rag-staircase
    title: "The ragged right edge forms a staircase or a wedge"
    source: "Bringhurst, The Elements of Typographic Style, section 2.1.3 \"Set ragged if ragged setting suits the text and the page\"; Hochuli, Detail in Typography, chapters \"The line\" and \"Linespacing, the column\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Does the ragged right edge of a paragraph form a staircase or a wedge, with lines getting steadily shorter or longer, or alternating long and short? Judge only what is visible."
      criteria:
        "true": "The ragged right edge of a paragraph forms a staircase or a wedge, or alternates long and short lines."
        "false": "The ragged right edge of every paragraph is gently and irregularly uneven."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Rebreak the lines so the right edge is gently uneven, with no staircase, wedge, or regular long-short pattern (Bringhurst, The Elements of Typographic Style, 2.1.3; Hochuli, Detail in Typography, \"The line\"). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
