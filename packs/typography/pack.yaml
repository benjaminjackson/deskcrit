  # GUIDELINES.md: Display type is spaced tighter than text
  - id: display-type-loose
    title: "A display heading has visible gaps between its letters or words"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), section 2.1.1, p. 26; Hochuli, Detail in Typography (Hyphen Press, 2008), p. 34."
    question:
      type: noul
      instructions: "In the image at screenshot: Does a heading set at display size, several times larger than the body text, have gaps between its letters or words that are wide enough to see as gaps? Judge only what is visible."
      criteria:
        "true": "A display-size heading has gaps between its letters or words that are wide enough to see as gaps."
        "false": "Every display-size heading has letters and words that sit close together, with no visible gaps."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Tighten the letter and word spacing of large headings below that of text, because large type looks looser than it is (Lupton, Thinking with Type, p. 80; Bringhurst, The Elements of Typographic Style, 2.1.1, p. 26; Hochuli, Detail in Typography, p. 34). [draft until Benjamin Jackson approves (G-4)]"
