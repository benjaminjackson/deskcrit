  # GUIDELINES.md: Lines of text align across columns
  - id: baselines-misaligned
    title: "Lines in side-by-side columns sit at different heights"
    source: "Müller-Brockmann, Grid Systems in Graphic Design (1981), section \"Construction of the grid\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Look across the gap between two columns of text that sit side by side. Is a line of text in one column level with the blank space between two lines in the other column, so that the lines of the two columns do not form straight rows across the gap? Judge only what is visible."
      criteria:
        "true": "Across the gap between two side-by-side text columns, a line in one column is level with the blank space between two lines in the other column, so the lines do not form straight rows."
        "false": "Each line in one column is level with a line in the column beside it, so the lines form straight rows across the gap, or the page has no side-by-side text columns."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Put neighbouring columns on one shared set of baselines, so their lines sit at the same heights (Müller-Brockmann, Grid Systems in Graphic Design, \"Construction of the grid\"). [draft until Benjamin Jackson approves (G-4)]"
