        - fixtures/headings-differ-only-in-size--2.negative.png
        - fixtures/headings-differ-only-in-size--3.negative.png
        - fixtures/headings-differ-only-in-size--4.negative.png
        - fixtures/headings-differ-only-in-size--5.negative.png

  # GUIDELINES.md: Sizes come from a scale
  - id: near-identical-sizes
    title: "Two text sizes on the page are almost the same"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), section 3.1.1 \"Don't compose without a scale\", p. 45."
    question:
      type: noul
      instructions: "In the image at screenshot: Are there two blocks of ordinary paragraph text, in the same typeface and weight and with no heading role, where the letters of one block are a little larger than the letters of the other, so that the two blocks do not match when seen side by side or one after the other? Judge only what is visible."
      criteria:
        "true": "Two blocks of ordinary paragraph text in the same typeface and weight have letters of slightly different sizes, so the two blocks do not match."
        "false": "All ordinary paragraph text on the page has letters of one size, and any other text size is plainly a heading, a caption, or a label."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Take text sizes from a small, deliberate scale, and merge sizes that are almost the same into one step of it (Bringhurst, The Elements of Typographic Style, 3.1.1, p. 45). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/near-identical-sizes.positive.png
        - fixtures/near-identical-sizes--2.positive.png
        - fixtures/near-identical-sizes--3.positive.png
        - fixtures/near-identical-sizes--4.positive.png
        - fixtures/near-identical-sizes--5.positive.png
      negative:
        - fixtures/near-identical-sizes.negative.png
        - fixtures/near-identical-sizes--2.negative.png
        - fixtures/near-identical-sizes--3.negative.png
        - fixtures/near-identical-sizes--4.negative.png
        - fixtures/near-identical-sizes--5.negative.png

  # GUIDELINES.md: One change at a time for emphasis
  - id: stacked-emphasis
    title: "A phrase is emphasized in several ways at once"
    source: "Lupton, Thinking with Type (1st ed. 2004), p. 94."
    question:
      type: noul
      instructions: "In the image at screenshot: Inside a paragraph, is there a word or phrase that is both bold and underlined, both bold and italic, both italic and underlined, or bold or underlined and also in a different colour from the text around it? Judge only what is visible."
      criteria:
        "true": "Inside a paragraph, a word or phrase combines two or more of bold, italic, underline, and a different colour."
        "false": "Every word or phrase that stands out inside a paragraph uses only one of bold, italic, underline, or colour, or no word stands out."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Emphasize with one change only: italic, or bold, or small capitals, and remove the others (Lupton, Thinking with Type, p. 94; Hochuli, Detail in Typography, p. 44). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/stacked-emphasis.positive.png
        - fixtures/stacked-emphasis--2.positive.png
        - fixtures/stacked-emphasis--3.positive.png
        - fixtures/stacked-emphasis--4.positive.png
        - fixtures/stacked-emphasis--5.positive.png
      negative:
