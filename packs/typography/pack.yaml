        - fixtures/heading-lines-loose--2.positive.png
        - fixtures/heading-lines-loose--3.positive.png
        - fixtures/heading-lines-loose--4.positive.png
        - fixtures/heading-lines-loose--5.positive.png
      negative:
        - fixtures/heading-lines-loose.negative.png
        - fixtures/heading-lines-loose--2.negative.png
        - fixtures/heading-lines-loose--3.negative.png
        - fixtures/heading-lines-loose--4.negative.png
        - fixtures/heading-lines-loose--5.negative.png

  # GUIDELINES.md: Typefaces in concord or in clear contrast, never in conflict
  - id: too-many-typefaces
    title: "The page mixes three or more unrelated typefaces"
    source: "Dair, Design with Type (1967), chapter 7 \"Relationships\" and chapter 8 \"Relationships of concord and contrast\"; Lupton, Thinking with Type, \"Letter\" chapter, \"Mixing typefaces\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Does the page use three or more typefaces of clearly different styles, such as a script, a serif, and a sans serif? Judge only what is visible."
      criteria:
        "true": "The page uses three or more typefaces of clearly different styles."
        "false": "The page uses one typeface family, or two that clearly belong together."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Keep to one family varied a little (concord) or to two faces that are plainly different (contrast), and drop the rest (Dair, Design with Type, chapters 7 and 8; Lupton, Thinking with Type, \"Mixing typefaces\"). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/too-many-typefaces.positive.png
        - fixtures/too-many-typefaces--2.positive.png
        - fixtures/too-many-typefaces--3.positive.png
        - fixtures/too-many-typefaces--4.positive.png
        - fixtures/too-many-typefaces--5.positive.png
      negative:
        - fixtures/too-many-typefaces.negative.png
        - fixtures/too-many-typefaces--2.negative.png
        - fixtures/too-many-typefaces--3.negative.png
        - fixtures/too-many-typefaces--4.negative.png
        - fixtures/too-many-typefaces--5.negative.png

  # GUIDELINES.md: Weak contrast is worse than none
  - id: heading-indistinct
    title: "A heading or label looks the same as the text around it"
    source: "Dair, Design with Type, chapter 8 \"Relationships of concord and contrast\" and chapters 8a to 8g, one for each kind of contrast. Dair's point that a contrast must be obvious is confirmed in his booklet A Typographic Quest No. 5: Typographic Contrast (Westvaco, 1967), through John D. Berry's account of it. Arnheim, Art and Visual Perception (1954, rev. 1974), chapter I \"Balance\", makes the same point about perception: small differences leave the eye unsure whether two things are equal or unequal."
    link: https://creativepro.com/dot-font-seven-principles-of-typographic-contrast/
    question:
      type: noul
      instructions: "In the image at screenshot: Is there a heading or label that looks the same as the text around it, so that it cannot be picked out as a heading? Judge only what is visible."
      criteria:
        "true": "A heading or label looks the same as the text around it and cannot be picked out as a heading."
        "false": "Every heading and label stands out plainly from the text around it."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Make each heading differ from its text in a way that is obvious at a glance, in size, weight, structure, form, or colour, not by one step (Dair, Design with Type, chapters 8 and 8a to 8g). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/heading-indistinct.positive.png
        - fixtures/heading-indistinct--2.positive.png
        - fixtures/heading-indistinct--3.positive.png
        - fixtures/heading-indistinct--4.positive.png
        - fixtures/heading-indistinct--5.positive.png
      negative:
        - fixtures/heading-indistinct.negative.png
        - fixtures/heading-indistinct--2.negative.png
        - fixtures/heading-indistinct--3.negative.png
        - fixtures/heading-indistinct--4.negative.png
        - fixtures/heading-indistinct--5.negative.png

  # GUIDELINES.md: Contrast from more than size
  - id: headings-differ-only-in-size
    title: "Headings differ from the body text only in size"
    source: "Dair, Design with Type, chapters 8a to 8g and chapter 9 \"Multiplying the contrasts\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Are the headings set in the same weight, style, and colour as the body text, so that they differ from it only in size? Judge only what is visible."
      criteria:
        "true": "The headings have the same weight, style, and colour as the body text and differ from it only in size."
        "false": "The headings differ from the body text in weight, style, typeface, or colour as well as in size."
    warn_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Pair a smaller step in heading size with a change of weight, of form such as capitals or italic, of structure such as serif against sans serif, or of colour (Dair, Design with Type, chapters 8a to 8g and 9). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/headings-differ-only-in-size.positive.png
        - fixtures/headings-differ-only-in-size--2.positive.png
        - fixtures/headings-differ-only-in-size--3.positive.png
        - fixtures/headings-differ-only-in-size--4.positive.png
        - fixtures/headings-differ-only-in-size--5.positive.png
      negative:
        - fixtures/headings-differ-only-in-size.negative.png
        - fixtures/headings-differ-only-in-size--2.negative.png
        - fixtures/headings-differ-only-in-size--3.negative.png
        - fixtures/headings-differ-only-in-size--4.negative.png
        - fixtures/headings-differ-only-in-size--5.negative.png

  # GUIDELINES.md: Sizes come from a scale
  - id: near-identical-sizes
    title: "Two text sizes on the page are almost the same"
    source: "Bringhurst, The Elements of Typographic Style, section 3.1.1 \"Don't compose without a scale\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Are there two or more text sizes on the page that are almost the same, such as two body sizes side by side? Judge only what is visible."
      criteria:
        "true": "The page has two or more text sizes that are almost the same."
        "false": "Every text size on the page is either the same as another or clearly different from it."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Take text sizes from a small, deliberate scale, and merge sizes that are almost the same into one step of it (Bringhurst, The Elements of Typographic Style, 3.1.1). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
