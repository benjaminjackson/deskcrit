# The typography pack (crit-cy8.17). It encodes entries from the Typography
# section of GUIDELINES.md (FR-55). Each source is a short citation of the
# part of the Source line of the entry named in the comment above the
# criterion that states the rule. The quotations and the notes on what was
# checked stay in GUIDELINES.md. A criterion is in the pack only if its rule
# was found in the source it cites (FR-45). On 2026-10-24 Benjamin Jackson
# removed eight criteria because no checked source states their rule:
# heading-lines-loose, heading-at-column-foot, paragraph-indent-and-space,
# heading-floats, list-wrap-under-bullet, display-quote-not-hung,
# thin-small-text, and display-straight-quotes. Add one back when someone
# finds a source that states its rule.
# Every question is a noul in the defect form: true means the defect is
# there (JC-5). Each question names a feature that can be seen, not a degree,
# and none asks Jev to count, measure, or name a colour (NFR-9, JC-2).
# Every fix hint is a draft until Benjamin Jackson approves it (G-4). Each
# hint carries the marker "draft until Benjamin Jackson approves (G-4)".
# Each criterion lists five positive and five negative fixtures (FR-54).
name: typography
version: 0.1.0
title: Typography, legibility, and readability
license: MIT
criteria:
  # GUIDELINES.md: Line length (measure)
  - id: measure-too-long
    title: "Lines of paragraph text run nearly the full page width"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), section 2.1.2 \"Choose a comfortable measure\", p. 26."
    question:
      type: noul
      instructions: "In the image at screenshot: Does a paragraph of body text stretch in one column from the left margin of the page to the right margin, with no sidebar, image, or second column beside it, so that its lines are as wide as the page's content area? Judge only what is visible."
      criteria:
        "true": "A paragraph of body text stretches in one column from the left margin to the right margin, with nothing beside it, and its lines are as wide as the content area."
        "false": "Every paragraph of body text is set in a column narrower than the content area, with empty space, an image, or another column beside it."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Narrow the text column so that a line holds about 45 to 75 characters, 66 at best, and 40 to 50 when the text is set in several columns (Bringhurst, The Elements of Typographic Style, 2.1.2, p. 26). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/measure-too-long.positive.png
        - fixtures/measure-too-long--2.positive.png
        - fixtures/measure-too-long--3.positive.png
        - fixtures/measure-too-long--4.positive.png
        - fixtures/measure-too-long--5.positive.png
      negative:
        - fixtures/measure-too-long.negative.png
        - fixtures/measure-too-long--2.negative.png
        - fixtures/measure-too-long--3.negative.png
        - fixtures/measure-too-long--4.negative.png
        - fixtures/measure-too-long--5.negative.png

  # GUIDELINES.md: Leading suits the measure
  - id: body-leading-too-tight
    title: "Lines of a paragraph touch or overlap"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), section 2.2.1 \"Choose a basic leading that suits the typeface, text and measure\", p. 37; Hochuli, Detail in Typography (Hyphen Press, 2008), chapter \"Linespacing, the column\", p. 47."
    question:
      type: noul
      instructions: "In the image at screenshot: In a paragraph, do the tails of letters such as g, p, and y in one line touch the tall letters such as h, l, and d in the line below, so that the lines run together into one dark mass? Judge only what is visible."
      criteria:
        "true": "In a paragraph, the tails of letters such as g, p, and y touch the tall letters of the line below, and the lines run together into one dark mass."
        "false": "In every paragraph, a thin strip of blank space separates each line from the next."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Open the line spacing of the paragraph text so the lines stand clear of each other, and give a longer line more space between lines (Bringhurst, The Elements of Typographic Style, 2.2.1, p. 37; Hochuli, Detail in Typography, \"Linespacing, the column\", p. 47). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/body-leading-too-tight.positive.png
        - fixtures/body-leading-too-tight--2.positive.png
        - fixtures/body-leading-too-tight--3.positive.png
        - fixtures/body-leading-too-tight--4.positive.png
        - fixtures/body-leading-too-tight--5.positive.png
      negative:
        - fixtures/body-leading-too-tight.negative.png
        - fixtures/body-leading-too-tight--2.negative.png
        - fixtures/body-leading-too-tight--3.negative.png
        - fixtures/body-leading-too-tight--4.negative.png
        - fixtures/body-leading-too-tight--5.negative.png

  # GUIDELINES.md: Leading suits the measure
  - id: body-leading-too-loose
    title: "Lines of a paragraph sit so far apart they read as separate lines"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), section 2.2.1 \"Choose a basic leading that suits the typeface, text and measure\", p. 37; Hochuli, Detail in Typography (Hyphen Press, 2008), chapter \"Linespacing, the column\", p. 47."
    question:
      type: noul
      instructions: "In the image at screenshot: Do the lines of a paragraph read as separate stripes of text with an empty band under each one, so the paragraph does not hold together as one even grey block? Judge only what is visible."
      criteria:
        "true": "The lines of a paragraph read as separate stripes with an empty band under each one, and the paragraph does not hold together as one block."
        "false": "Every paragraph holds together as one even grey block, with its lines close enough that no empty band shows between them."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Close up the line spacing of the paragraph text so the lines read as one block, chosen for the typeface, the text, and the measure together (Bringhurst, The Elements of Typographic Style, 2.2.1, p. 37; Hochuli, Detail in Typography, \"Linespacing, the column\", p. 47). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/body-leading-too-loose.positive.png
        - fixtures/body-leading-too-loose--2.positive.png
        - fixtures/body-leading-too-loose--3.positive.png
        - fixtures/body-leading-too-loose--4.positive.png
        - fixtures/body-leading-too-loose--5.positive.png
      negative:
        - fixtures/body-leading-too-loose.negative.png
        - fixtures/body-leading-too-loose--2.negative.png
        - fixtures/body-leading-too-loose--3.negative.png
        - fixtures/body-leading-too-loose--4.negative.png
        - fixtures/body-leading-too-loose--5.negative.png

  # GUIDELINES.md: Heading lines hold together
  - id: heading-lines-collide
    title: "Lines of a multi-line heading touch or overlap"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), p. 37; Hochuli, Detail in Typography (Hyphen Press, 2008), p. 28."
    question:
      type: noul
      instructions: "In the image at screenshot: Do the lines of a multi-line heading touch or overlap each other? Judge only what is visible."
      criteria:
        "true": "The lines of a multi-line heading touch or overlap each other."
        "false": "No heading has lines that touch or overlap each other."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Open the heading's line spacing until no letter of one line touches a letter of the next. A heading may be set tighter than the text, but only while its ascenders and descenders stay clear of each other (Bringhurst, The Elements of Typographic Style, p. 37; Hochuli, Detail in Typography, p. 28). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/heading-lines-collide.positive.png
        - fixtures/heading-lines-collide--2.positive.png
        - fixtures/heading-lines-collide--3.positive.png
        - fixtures/heading-lines-collide--4.positive.png
        - fixtures/heading-lines-collide--5.positive.png
      negative:
        - fixtures/heading-lines-collide.negative.png
        - fixtures/heading-lines-collide--2.negative.png
        - fixtures/heading-lines-collide--3.negative.png
        - fixtures/heading-lines-collide--4.negative.png
        - fixtures/heading-lines-collide--5.negative.png

  # GUIDELINES.md: Typefaces in concord or in clear contrast, never in conflict
  - id: too-many-typefaces
    title: "The page mixes three or more unrelated typefaces"
    source: "Dair, Design with Type (1967), chapter 7 \"Relationships\" and chapter 8 \"Relationships of concord and contrast\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Do different blocks of text on the page each have letter shapes from a different kind of typeface, so that one block is in a serif, another in a sans serif, and another in a third kind such as a script, a slab serif, or a decorative face? Judge only what is visible."
      criteria:
        "true": "Blocks of text on the page use letter shapes from at least three different kinds of typeface, such as a serif, a sans serif, and a script or slab serif."
        "false": "All the text on the page uses one typeface, or one serif and one sans serif."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Keep to one family varied a little (concord) or to two faces that are plainly different (contrast), and drop the rest (Dair, Design with Type, chapters 7 and 8). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/too-many-typefaces.positive.png
        - fixtures/too-many-typefaces--2.positive.png
        - fixtures/too-many-typefaces--3.positive.png
        - fixtures/too-many-typefaces--4.positive.png
        - fixtures/too-many-typefaces--5.positive.png
      negative:
        - fixtures/too-many-typefaces.negative.png
        - fixtures/too-many-typefaces--2.negative.png
        - fixtures/too-many-typefaces--3.negative.png
        - fixtures/too-many-typefaces--4.negative.png
        - fixtures/too-many-typefaces--5.negative.png

  # GUIDELINES.md: Weak contrast is worse than none
  - id: heading-indistinct
    title: "A heading or label looks the same as the text around it"
    source: "Dair, Design with Type (1967), chapter 8 \"Relationships of concord and contrast\"; Arnheim, Art and Visual Perception (rev. 1974), chapter I \"Balance\"."
    link: https://creativepro.com/dot-font-seven-principles-of-typographic-contrast/
    question:
      type: noul
      instructions: "In the image at screenshot: Is there a short line standing on its own above a paragraph, where a heading would go, that is set in the same size, weight, and colour as the paragraph text under it? Judge only what is visible."
      criteria:
        "true": "A short line stands on its own above a paragraph, where a heading would go, in the same size, weight, and colour as the paragraph text."
        "false": "Every short line that stands on its own above a paragraph is larger, bolder, or a different colour from the paragraph text."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Make each heading differ from its text in a way that is obvious at a glance, in size, weight, structure, form, or colour, not by one step (Dair, Design with Type, chapters 8 and 8a to 8g). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/heading-indistinct.positive.png
        - fixtures/heading-indistinct--2.positive.png
        - fixtures/heading-indistinct--3.positive.png
        - fixtures/heading-indistinct--4.positive.png
        - fixtures/heading-indistinct--5.positive.png
      negative:
        - fixtures/heading-indistinct.negative.png
        - fixtures/heading-indistinct--2.negative.png
        - fixtures/heading-indistinct--3.negative.png
        - fixtures/heading-indistinct--4.negative.png
        - fixtures/heading-indistinct--5.negative.png

  # GUIDELINES.md: Contrast from more than size
  - id: headings-differ-only-in-size
    title: "Headings differ from the body text only in size"
    source: "Dair, Design with Type (1967), chapters 8a to 8g and chapter 9 \"Multiplying the contrasts\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Are the headings set in the same weight, style, and colour as the body text, so that they differ from it only in size? Judge only what is visible."
      criteria:
        "true": "The headings have the same weight, style, and colour as the body text and differ from it only in size."
        "false": "The headings differ from the body text in weight, style, typeface, or colour as well as in size."
    warn_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Pair a smaller step in heading size with a change of weight, of form such as capitals or italic, of structure such as serif against sans serif, or of colour (Dair, Design with Type, chapters 8a to 8g and 9). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
