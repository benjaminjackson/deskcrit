  # GUIDELINES.md: Rivers of white space
  - id: rivers-of-white
    title: "Channels of white run down through a text block"
    source: "Hochuli, Detail in Typography (Hyphen Press, 2008), chapter \"Linespacing, the column\", p. 47."
    question:
      type: noul
      instructions: "In the image at screenshot: In a block of text, do the spaces between words in several lines in a row fall under one another, so that they join into a crooked white streak running down through the grey of the text? Judge only what is visible."
      criteria:
        "true": "In a block of text, the spaces between words in several lines in a row fall under one another and join into a crooked white streak running down through the text."
        "false": "The spaces between words fall in different places from line to line, and no white streak runs down through any block of text."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Even out the word spacing so no channel of white runs through the block: set it ragged right, widen the measure, or turn on hyphenation (Hochuli, Detail in Typography, \"Linespacing, the column\", p. 47; Bringhurst, The Elements of Typographic Style, 2.1.1 and 2.1.2, pp. 26-27). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
