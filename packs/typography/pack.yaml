        - fixtures/stacked-emphasis--2.negative.png
        - fixtures/stacked-emphasis--3.negative.png
        - fixtures/stacked-emphasis--4.negative.png
        - fixtures/stacked-emphasis--5.negative.png

  # GUIDELINES.md: Even word spacing in justified text
  - id: justified-word-gaps
    title: "Justified lines have holes between words"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), sections 2.1.1 and 2.1.2, pp. 26-27; Hochuli, Detail in Typography (Hyphen Press, 2008), chapter \"The line\", p. 34."
    question:
      type: noul
      instructions: "In the image at screenshot: In justified text, do some lines have gaps between words that are much wider than the gaps in the lines around them? Judge only what is visible."
      criteria:
        "true": "In justified text, some lines have gaps between words that are much wider than in the lines around them."
        "false": "The gaps between words are even from line to line, or the text is not justified."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Keep word spaces even: justify only where the measure is wide enough and hyphenation is on, and set the text ragged right otherwise (Bringhurst, The Elements of Typographic Style, 2.1.1 and 2.1.2, pp. 26-27; Hochuli, Detail in Typography, \"The line\", p. 34). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
