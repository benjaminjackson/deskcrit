# The typography pack (crit-cy8.17). It encodes entries from the Typography
# section of GUIDELINES.md (FR-55). Each source is the Source line of the
# entry named in the comment above the criterion, with the Markdown emphasis
# marks removed (FR-45).
# Every question is a noul in the defect form: true means the defect is
# there (JC-5). Each question names a feature that can be seen, not a degree,
# and none asks Jev to count, measure, or name a colour (NFR-9, JC-2).
# Every fix hint is a draft until Benjamin Jackson approves it (G-4). Each
# hint carries the marker "draft until Benjamin Jackson approves (G-4)".
# Each criterion lists five positive and five negative fixtures (FR-54).
name: typography
version: 0.1.0
title: Typography, legibility, and readability
license: MIT
criteria:
  # GUIDELINES.md: Line length (measure)
  - id: measure-too-long
    title: "Lines of paragraph text run nearly the full page width"
    source: "Bringhurst, The Elements of Typographic Style (1992), section 2.1.2 \"Choose a comfortable measure\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Do the lines of paragraph text run across nearly the full width of the page? Judge only what is visible."
      criteria:
        "true": "The lines of paragraph text run across nearly the full width of the page."
        "false": "The lines of paragraph text stop well short of the full width of the page."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Narrow the text column so that a line holds about 45 to 75 characters, 66 at best, and 40 to 50 when the text is set in several columns (Bringhurst, The Elements of Typographic Style, 2.1.2). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/measure-too-long.positive.png
        - fixtures/measure-too-long--2.positive.png
        - fixtures/measure-too-long--3.positive.png
        - fixtures/measure-too-long--4.positive.png
        - fixtures/measure-too-long--5.positive.png
      negative:
        - fixtures/measure-too-long.negative.png
        - fixtures/measure-too-long--2.negative.png
        - fixtures/measure-too-long--3.negative.png
        - fixtures/measure-too-long--4.negative.png
        - fixtures/measure-too-long--5.negative.png

  # GUIDELINES.md: Leading suits the measure
  - id: body-leading-too-tight
    title: "Lines of a paragraph touch or overlap"
    source: "Bringhurst, The Elements of Typographic Style, section 2.2.1 \"Choose a basic leading that suits the typeface, text and measure\"; Hochuli, Detail in Typography (2008), chapter \"Linespacing, the column\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Do the lines of a paragraph touch or overlap, so that the descenders of one line run into the next line? Judge only what is visible."
      criteria:
        "true": "The lines of a paragraph touch or overlap, and the descenders of one line run into the next line."
        "false": "Every line of every paragraph stands clear of the lines above and below it."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Open the line spacing of the paragraph text so the lines stand clear of each other, and give a longer line more space between lines (Bringhurst, The Elements of Typographic Style, 2.2.1; Hochuli, Detail in Typography, \"Linespacing, the column\"). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/body-leading-too-tight.positive.png
        - fixtures/body-leading-too-tight--2.positive.png
        - fixtures/body-leading-too-tight--3.positive.png
        - fixtures/body-leading-too-tight--4.positive.png
        - fixtures/body-leading-too-tight--5.positive.png
      negative:
        - fixtures/body-leading-too-tight.negative.png
        - fixtures/body-leading-too-tight--2.negative.png
        - fixtures/body-leading-too-tight--3.negative.png
        - fixtures/body-leading-too-tight--4.negative.png
        - fixtures/body-leading-too-tight--5.negative.png

  # GUIDELINES.md: Leading suits the measure
  - id: body-leading-too-loose
    title: "Lines of a paragraph sit so far apart they read as separate lines"
    source: "Bringhurst, The Elements of Typographic Style, section 2.2.1 \"Choose a basic leading that suits the typeface, text and measure\"; Hochuli, Detail in Typography (2008), chapter \"Linespacing, the column\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Is the blank space between the lines of a paragraph as tall as the letters themselves or taller, so that each line looks like a separate line and not part of one block? Judge only what is visible."
      criteria:
        "true": "The blank space between the lines of a paragraph is as tall as the letters or taller, and each line looks like a separate line."
        "false": "The lines of every paragraph sit close enough to read as one block."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Close up the line spacing of the paragraph text so the lines read as one block, chosen for the typeface, the text, and the measure together (Bringhurst, The Elements of Typographic Style, 2.2.1; Hochuli, Detail in Typography, \"Linespacing, the column\"). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/body-leading-too-loose.positive.png
        - fixtures/body-leading-too-loose--2.positive.png
        - fixtures/body-leading-too-loose--3.positive.png
        - fixtures/body-leading-too-loose--4.positive.png
        - fixtures/body-leading-too-loose--5.positive.png
      negative:
