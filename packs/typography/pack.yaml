  # GUIDELINES.md: Widows, orphans, and runts
  - id: paragraph-runt
    title: "A paragraph ends with one short word alone on its last line"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), section 2.4.2."
    question:
      type: noul
      instructions: "In the image at screenshot: Look at the last line of each paragraph. Is there a last line that holds only one short word, with the rest of that line left empty? Judge only what is visible."
      criteria:
        "true": "The last line of a paragraph holds only one short word, and the rest of that line is empty."
        "false": "The last line of every paragraph holds several words."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Rebreak the paragraph, or adjust its wording or measure, so its last line carries more than one short word (Bringhurst, The Elements of Typographic Style, 2.4.2). [draft until Benjamin Jackson approves (G-4)]"
