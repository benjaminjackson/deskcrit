        - fixtures/rivers-of-white--5.negative.png

  # GUIDELINES.md: Rag quality in ragged-right text
  - id: rag-staircase
    title: "The ragged right edge forms a staircase or a wedge"
    source: "Hochuli, Detail in Typography (Hyphen Press, 2008), chapter \"The line\", p. 35."
    question:
      type: noul
      instructions: "In the image at screenshot: Trace the right ends of the lines of a left-aligned paragraph. Do they form a regular shape, either a straight diagonal slope where each line is shorter or longer than the one above, or a regular zigzag of long, short, long, short? Judge only what is visible."
      criteria:
        "true": "The right ends of the lines of a paragraph form a straight diagonal slope or a regular long-short zigzag."
        "false": "The right ends of the lines of every paragraph form an irregular edge with no slope and no repeating pattern."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Rebreak the lines so the right edge is gently uneven, with no staircase, wedge, or regular long-short pattern (Bringhurst, The Elements of Typographic Style, 2.1.3, p. 28; Hochuli, Detail in Typography, \"The line\", p. 35). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
