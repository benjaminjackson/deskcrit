        - fixtures/body-leading-too-loose--2.negative.png
        - fixtures/body-leading-too-loose--3.negative.png
        - fixtures/body-leading-too-loose--4.negative.png
        - fixtures/body-leading-too-loose--5.negative.png

  # GUIDELINES.md: Heading lines hold together
  - id: heading-lines-collide
    title: "Lines of a multi-line heading touch or overlap"
    source: "Lupton, Thinking with Type (2nd ed. 2010), \"Text\" chapter, \"Line spacing\"; Hochuli, Detail in Typography, chapter \"Linespacing, the column\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Do the lines of a multi-line heading touch or overlap each other? Judge only what is visible."
      criteria:
        "true": "The lines of a multi-line heading touch or overlap each other."
        "false": "No heading has lines that touch or overlap each other."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Set the heading's line spacing tighter than the text's but open enough that its lines do not touch, so the heading reads as one unit (Lupton, Thinking with Type, \"Line spacing\"; Hochuli, Detail in Typography, \"Linespacing, the column\"). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
        - fixtures/heading-lines-collide.positive.png
        - fixtures/heading-lines-collide--2.positive.png
        - fixtures/heading-lines-collide--3.positive.png
        - fixtures/heading-lines-collide--4.positive.png
        - fixtures/heading-lines-collide--5.positive.png
      negative:
        - fixtures/heading-lines-collide.negative.png
        - fixtures/heading-lines-collide--2.negative.png
        - fixtures/heading-lines-collide--3.negative.png
        - fixtures/heading-lines-collide--4.negative.png
        - fixtures/heading-lines-collide--5.negative.png

  # GUIDELINES.md: Heading lines hold together
  - id: heading-lines-loose
    title: "A heading's lines are as far apart as the heading is from its text"
    source: "Lupton, Thinking with Type (2nd ed. 2010), \"Text\" chapter, \"Line spacing\"; Hochuli, Detail in Typography, chapter \"Linespacing, the column\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Is the gap between the lines of a heading as large as the gap between the heading and the text below it? Judge only what is visible."
      criteria:
        "true": "The gap between the lines of a heading is as large as, or larger than, the gap between the heading and the text below it."
        "false": "The lines of every heading sit closer together than the heading sits to the text below it."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Tighten the line spacing of a multi-line heading below that of the text, so its lines hold together as one unit and the space below it is clearly larger (Lupton, Thinking with Type, \"Line spacing\"; Hochuli, Detail in Typography, \"Linespacing, the column\"). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
      positive:
