  # GUIDELINES.md: Rivers of white space
  - id: rivers-of-white
    title: "Channels of white run down through a text block"
    source: "Bringhurst, The Elements of Typographic Style, sections 2.1.3 and 2.1.10 (uneven word spacing in justified text; the book does not use the word \"rivers\" as a rule); Hochuli, Detail in Typography, chapter \"The line\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Do channels of white space run down through several lines of a text block? Judge only what is visible."
      criteria:
        "true": "Channels of white space run down through several lines of a text block."
        "false": "No channel of white space runs down through the lines of any text block."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Even out the word spacing so no channel of white runs through the block: set it ragged right, widen the measure, or turn on hyphenation (Bringhurst, The Elements of Typographic Style, 2.1.3 and 2.1.10; Hochuli, Detail in Typography, \"The line\"). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
