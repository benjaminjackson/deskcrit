  # GUIDELINES.md: Kerning
  - id: display-kerning-gap
    title: "A letter pair in a large headline has a visible gap"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), section 2.1.8, pp. 32-33."
    question:
      type: noul
      instructions: "In the image at screenshot: In a large headline, is there a pair of letters, such as AV, To, or Wa, with a gap between them that is visibly wider than the gaps between the other letters? Judge only what is visible."
      criteria:
        "true": "In a large headline, a pair of letters has a gap that is visibly wider than the gaps between the other letters."
        "false": "In every large headline, the spaces between letters look even."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Kern the letter pairs of large headlines, such as AV, To, and Wa, so the space between every pair looks even, with no gaps and no collisions (Bringhurst, The Elements of Typographic Style, 2.1.8, p. 32; Hochuli, Detail in Typography, p. 30). [draft until Benjamin Jackson approves (G-4)]"
