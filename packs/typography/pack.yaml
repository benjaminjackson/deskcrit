  # GUIDELINES.md: Paragraph marks: indent or space, not both
  - id: first-paragraph-indented
    title: "The first paragraph after a heading is indented"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), section 2.3.1 \"Set opening paragraphs flush left\", p. 39."
    question:
      type: noul
      instructions: "In the image at screenshot: Directly under a heading, does the first line of the paragraph start to the right of the heading's left edge and of the left edge of that paragraph's other lines? Judge only what is visible."
      criteria:
        "true": "Directly under a heading, the first line of the paragraph starts to the right of the heading's left edge and of the paragraph's other lines."
        "false": "Directly under every heading, the first line of the paragraph starts on the same left edge as the heading and the paragraph's other lines."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Set the first paragraph after each heading flush left, and indent only the paragraphs that follow it (Bringhurst, The Elements of Typographic Style, 2.3.1, p. 39). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
