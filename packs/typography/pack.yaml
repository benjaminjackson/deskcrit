  # GUIDELINES.md: One change at a time for emphasis
  - id: stacked-emphasis
    title: "A phrase is emphasized in several ways at once"
    source: "Bringhurst, The Elements of Typographic Style, section 3.5.1 \"Change one parameter at a time\"; Hochuli, Detail in Typography, chapter \"Emphasis\"."
    question:
      type: noul
      instructions: "In the image at screenshot: Is a word or phrase emphasized in several ways at once, for example bold and italic and underlined, or bold capitals in a colour? Judge only what is visible."
      criteria:
        "true": "A word or phrase is emphasized in several ways at once."
        "false": "Every emphasized word or phrase changes in one way only, such as italic alone or bold alone."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Emphasize with one change only: italic, or bold, or small capitals, and remove the others (Bringhurst, The Elements of Typographic Style, 3.5.1; Hochuli, Detail in Typography, \"Emphasis\"). [draft until Benjamin Jackson approves (G-4)]"
    fixtures:
