  # GUIDELINES.md: Real italics, bold, and small caps (no faux styles)
  - id: faux-italic-display
    title: "A large italic heading is a slanted roman"
    source: "Bringhurst, The Elements of Typographic Style (Version 3.0, 2004), section 3.4.3, p. 56."
    question:
      type: noul
      instructions: "In the image at screenshot: In a large slanted heading, do the letters look like ordinary upright letters tipped to the right, for example a two-storey a with a hook over its bowl and round letters that look stretched on a slant, and not the flowing, pen-like shapes of a true italic? Judge only what is visible."
      criteria:
        "true": "A large slanted heading uses upright letter shapes tipped to the right, such as a two-storey a, and not true italic shapes."
        "false": "Every large slanted heading uses flowing true italic shapes, such as a one-storey a, or the page has no large slanted heading."
    fail_when:
      probability_at_least: 0.7
    pass_when:
      probability_at_most: 0.3
    fix: "Set italic headings in the family's true italic cut, not in a slanted roman (Bringhurst, The Elements of Typographic Style, 3.4.3, p. 56). [draft until Benjamin Jackson approves (G-4)]"
