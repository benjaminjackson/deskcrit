<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tallyrow: billing settings</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="too-many-type-sizes-and-weights-on-one-screen.css">
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">Tallyrow</div>
      <nav class="top-nav">
        <a href="#">Orders</a>
        <a href="#">Menu</a>
        <a href="#">Stops</a>
        <a href="#" aria-current="page">Settings</a>
      </nav>
    </header>

    <div class="layout">
      <nav class="settings-nav" aria-label="Settings">
        <a href="#">Truck profile</a>
        <a href="#">Staff</a>
        <a href="#" aria-current="page">Plan and billing</a>
        <a href="#">Order alerts</a>
        <a href="#">Card reader</a>
      </nav>

      <main class="settings">
        <h1>Plan and billing</h1>

        <section class="block">
          <h2>Plan</h2>
          <div class="plans" role="radiogroup">
            <label class="plan">
              <input type="radio" name="plan">
              <span class="plan-name">One truck</span>
              <span class="plan-detail">One menu, 300 orders a day</span>
              <span class="plan-price">$24.00 a month</span>
            </label>
            <label class="plan plan-current">
              <input type="radio" name="plan" checked>
              <span class="plan-name">Small fleet</span>
              <span class="plan-detail">Up to 5 trucks, shared menu</span>
              <span class="plan-price">$59.00 a month</span>
            </label>
            <label class="plan">
              <input type="radio" name="plan">
              <span class="plan-name">Commissary</span>
              <span class="plan-detail">Up to 20 trucks and one kitchen</span>
              <span class="plan-price">$129.00 a month</span>
            </label>
          </div>
        </section>

        <section class="block form-block">
          <h2>Billing details</h2>
          <div class="fields">
            <label class="field">
              <span class="field-label">Billing email</span>
              <input type="text" value="accounts@tallyrow.example">
            </label>
            <label class="field">
              <span class="field-label">Currency</span>
              <select><option>US dollar (USD)</option></select>
            </label>
            <label class="field field-wide">
              <span class="field-label">Invoice address</span>
              <input type="text" value="220 Dock Road, Austin, TX 78702">
            </label>
          </div>
          <label class="check">
            <input type="checkbox" checked>
            <span>Send a receipt to the billing email after each payment</span>
          </label>
          <div class="form-actions">
            <button class="button button-primary" type="button">Save changes</button>
            <button class="button button-secondary" type="button">Cancel</button>
          </div>
        </section>

        <section class="block">
          <h2>Invoices</h2>
          <table>
            <thead>
              <tr><th>Date</th><th>Invoice</th><th>Plan</th><th class="num">Amount</th><th>Status</th></tr>
            </thead>
            <tbody>
              <tr><td>1 Nov 2026</td><td>TR-4471</td><td>Small fleet</td><td class="num">$59.00</td><td>Paid</td></tr>
              <tr><td>1 Oct 2026</td><td>TR-4318</td><td>Small fleet</td><td class="num">$59.00</td><td>Paid</td></tr>
              <tr><td>1 Sep 2026</td><td>TR-4166</td><td>One truck</td><td class="num">$24.00</td><td>Paid</td></tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
  </body>
</html>
