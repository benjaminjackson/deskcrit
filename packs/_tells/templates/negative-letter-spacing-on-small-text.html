<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Pollenbox: billing settings</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="negative-letter-spacing-on-small-text.css">
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">Pollenbox</div>
      <nav class="top-nav">
        <a href="#">Harvests</a>
        <a href="#">Stock</a>
        <a href="#">Members</a>
        <a href="#" aria-current="page">Settings</a>
      </nav>
    </header>

    <div class="layout">
      <nav class="settings-nav" aria-label="Settings">
        <a href="#">Co-op details</a>
        <a href="#">Apiaries</a>
        <a href="#" aria-current="page">Plan and billing</a>
        <a href="#">Label printing</a>
        <a href="#">Shop connection</a>
      </nav>

      <main class="settings">
        <h1>Plan and billing</h1>

        <section class="block">
          <h2>Plan</h2>
          <div class="plans" role="radiogroup">
            <label class="plan">
              <input type="radio" name="plan">
              <span class="plan-name">Backyard</span>
              <span class="plan-detail">Up to 10 hives, one seller</span>
              <span class="plan-price">$9.00 a month</span>
            </label>
            <label class="plan plan-current">
              <input type="radio" name="plan" checked>
              <span class="plan-name">Co-op</span>
              <span class="plan-detail">Up to 25 members, shared stock</span>
              <span class="plan-price">$36.00 a month</span>
            </label>
            <label class="plan">
              <input type="radio" name="plan">
              <span class="plan-name">Packer</span>
              <span class="plan-detail">Unlimited members and batch labels</span>
              <span class="plan-price">$84.00 a month</span>
            </label>
          </div>
        </section>

        <section class="block form-block">
          <h2>Billing details</h2>
          <div class="fields">
            <label class="field">
              <span class="field-label">Billing email</span>
              <input type="text" value="treasurer@pollenbox.example">
            </label>
            <label class="field">
              <span class="field-label">Currency</span>
              <select><option>US dollar (USD)</option></select>
            </label>
            <label class="field field-wide">
              <span class="field-label">Invoice address</span>
              <input type="text" value="9 Orchard Lane, Hood River, OR 97031">
            </label>
          </div>
          <label class="check">
            <input type="checkbox" checked>
            <span>Add the co-op tax number to every invoice</span>
          </label>
          <div class="form-actions">
            <button class="button button-primary" type="button">Save changes</button>
            <button class="button button-secondary" type="button">Cancel</button>
          </div>
        </section>

        <section class="block">
          <h2>Invoices</h2>
          <table>
            <thead>
              <tr><th>Date</th><th>Invoice</th><th>Plan</th><th class="num">Amount</th><th>Status</th></tr>
            </thead>
            <tbody>
              <tr><td>3 Nov 2026</td><td>PB-0912</td><td>Co-op</td><td class="num">$36.00</td><td>Paid</td></tr>
              <tr><td>3 Oct 2026</td><td>PB-0874</td><td>Co-op</td><td class="num">$36.00</td><td>Paid</td></tr>
              <tr><td>3 Sep 2026</td><td>PB-0831</td><td>Backyard</td><td class="num">$9.00</td><td>Paid</td></tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
  </body>
</html>
