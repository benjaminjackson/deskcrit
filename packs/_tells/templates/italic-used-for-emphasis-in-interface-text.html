<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Harborlist: billing settings</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="italic-used-for-emphasis-in-interface-text.css">
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">Harborlist</div>
      <nav class="top-nav">
        <a href="#">Slips</a>
        <a href="#">Boaters</a>
        <a href="#">Fuel dock</a>
        <a href="#" aria-current="page">Settings</a>
      </nav>
    </header>

    <div class="layout">
      <nav class="settings-nav" aria-label="Settings">
        <a href="#">Marina profile</a>
        <a href="#">Dock staff</a>
        <a href="#" aria-current="page">Plan and billing</a>
        <a href="#">Tide alerts</a>
        <a href="#">Payment terminal</a>
      </nav>

      <main class="settings">
        <h1>Plan and billing</h1>

        <section class="block">
          <h2>Plan</h2>
          <div class="plans" role="radiogroup">
            <label class="plan">
              <input type="radio" name="plan">
              <span class="plan-name">Harbor</span>
              <span class="plan-detail">Up to 30 slips, <span class="stress">one</span> dock</span>
              <span class="plan-price">$29.00 a month</span>
            </label>
            <label class="plan plan-current">
              <input type="radio" name="plan" checked>
              <span class="plan-name">Marina</span>
              <span class="plan-detail">Up to 150 slips, <span class="stress">no</span> booking fees</span>
              <span class="plan-price">$69.00 a month</span>
            </label>
            <label class="plan">
              <input type="radio" name="plan">
              <span class="plan-name">Harbor group</span>
              <span class="plan-detail">Up to 5 marinas, one boater list</span>
              <span class="plan-price">$149.00 a month</span>
            </label>
          </div>
        </section>

        <section class="block form-block">
          <h2>Billing details</h2>
          <div class="fields">
            <label class="field">
              <span class="field-label">Billing email</span>
              <input type="text" value="office@harborlist.example">
            </label>
            <label class="field">
              <span class="field-label">Currency</span>
              <select><option>US dollar (USD)</option></select>
            </label>
            <label class="field field-wide">
              <span class="field-label">Invoice address, as shown on <span class="stress">every</span> invoice</span>
              <input type="text" value="1 Wharf Street, Camden, ME 04843">
            </label>
          </div>
          <label class="check">
            <input type="checkbox" checked>
            <span>Charge the card on file <span class="stress">before</span> the first of each month</span>
          </label>
          <div class="form-actions">
            <button class="button button-primary" type="button">Save changes</button>
            <button class="button button-secondary" type="button">Cancel</button>
          </div>
        </section>

        <section class="block">
          <h2>Invoices</h2>
          <table>
            <thead>
              <tr><th>Date</th><th>Invoice</th><th>Plan</th><th class="num">Amount</th><th>Status</th></tr>
            </thead>
            <tbody>
              <tr><td>1 Nov 2026</td><td>HL-1185</td><td>Marina</td><td class="num">$69.00</td><td>Paid</td></tr>
              <tr><td>1 Oct 2026</td><td>HL-1142</td><td>Marina</td><td class="num">$69.00</td><td>Paid</td></tr>
              <tr><td>1 Sep 2026</td><td>HL-1097</td><td>Harbor</td><td class="num">$29.00</td><td>Paid</td></tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
  </body>
</html>
