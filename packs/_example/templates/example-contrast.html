<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Example: body text contrast</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <link rel="stylesheet" href="example-contrast.css">
  </head>
  <body>
    <main class="card">
      <h1>Quarterly route summary</h1>
      <p class="body-text">
        The northern depot handled most deliveries this quarter. The chart
        below counts parcels by depot. Figures are invented sample data for a
        fixture image.
      </p>
      <!-- An inline SVG chart. The defect rule in example-contrast.css changes
           only the label fill under [data-defect="on"] (OQ-17). -->
      <svg class="chart" width="560" height="240" viewBox="0 0 560 240" role="img" aria-label="Parcels by depot">
        <line class="chart-axis" x1="40" y1="200" x2="540" y2="200" />
        <rect class="chart-bar" x="70" y="60" width="90" height="140" />
        <rect class="chart-bar" x="230" y="110" width="90" height="90" />
        <rect class="chart-bar" x="390" y="150" width="90" height="50" />
        <text class="chart-label" x="115" y="225" text-anchor="middle">North</text>
        <text class="chart-label" x="275" y="225" text-anchor="middle">Central</text>
        <text class="chart-label" x="435" y="225" text-anchor="middle">South</text>
      </svg>
    </main>
  </body>
</html>
