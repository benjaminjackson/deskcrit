<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Color fixture: competing saturated hues, energy dashboard</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion competing-saturated-hues. A home energy account page on a light gray page. Three elements with
 * three jobs: a solar illustration block, the "Switch to the green plan" button, and a tariff-change alert
 * panel. The clean side makes the green button the lead; the illustration is a pale yellow tint with dark amber
 * lines and the alert is a white panel with dark text. The defect switch changes the background-color of the
 * illustration to vivid amber (with dark lines) and of the alert to vivid blue (with white text). The button
 * stays green. Nothing else changes.
 */
body { background-color: #f4f5f7; }
header { height: 60px; background-color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; border-bottom: 1px solid #dfe3e8; }
.brand { font-weight: 700; font-size: 19px; }
nav { display: flex; gap: 24px; font-size: 15px; color: var(--color-muted); }
nav .on { color: var(--color-text); font-weight: 700; }
main { padding: 32px 48px 0; }
h1 { font-size: 30px; font-weight: 700; }
.sub { font-size: 16px; color: #4a535c; margin-top: 4px; }
.grid { display: flex; gap: 36px; margin-top: 26px; align-items: flex-start; }
.sun { width: 420px; height: 280px; flex: none; border-radius: 14px; background-color: #fdf3c8; color: #8a5a00; display: flex; align-items: center; justify-content: center; }
.sun svg { fill: none; stroke: currentColor; stroke-width: 3; }
.col { width: 640px; }
.usage { background-color: #fff; border: 1px solid #dfe3e8; border-radius: 12px; padding: 18px 22px; display: flex; justify-content: space-between; }
.usage div { font-size: 14px; color: var(--color-muted); }
.usage b { display: block; font-size: 26px; color: #1f2328; margin-top: 2px; }
.btn { display: inline-block; margin-top: 22px; background-color: #167a43; color: #fff; font-weight: 700; font-size: 18px; padding: 15px 34px; border-radius: 10px; }
.alert { margin-top: 22px; width: 460px; padding: 16px 22px; border-radius: 12px; background-color: #fff; color: #1f2328; border: 1px solid #dfe3e8; }
.alert b { display: block; font-size: 16px; }
.alert span { display: block; font-size: 15px; line-height: 1.45; margin-top: 3px; }

[data-defect="on"] .sun { background-color: #f2b705; color: #3d2a00; }
[data-defect="on"] .alert { background-color: #1d4fd8; color: #ffffff; }
    </style>
  </head>
  <body>
<header><span class="brand">Hearthgrid</span><nav><span class="on">Account</span><span>Usage</span><span>Plans</span><span>Support</span></nav></header>
<main>
  <h1>Your electricity plan</h1><p class="sub">Standard plan, billed monthly</p>
  <div class="grid">
    <div class="sun"><svg width="220" height="170" viewBox="0 0 220 170"><circle cx="110" cy="50" r="22"/><path d="M110 8v8M110 84v8M68 50h8M144 50h8M80 20l6 6M134 74l6 6M140 20l-6 6M86 74l-6 6"/><path d="M30 160l24-52h112l24 52zM42 134h136M82 108l-10 52M110 108v52M138 108l10 52"/></svg></div>
    <div class="col"><div class="usage"><div>This month<b>412 kWh</b></div><div>Last month<b>468 kWh</b></div><div>Estimated bill<b>$86.40</b></div></div>
    <span class="btn">Switch to the green plan</span>
    <div class="alert"><b>Rates change on March 1</b><span>Peak hours move to 4 to 9 p.m. on weekdays.</span></div></div>
  </div>
</main>
  </body>
</html>
