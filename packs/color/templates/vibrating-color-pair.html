<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Color fixture: vibrating color pair (sale banner)</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion vibrating-color-pair. A home goods store with a full-width sale banner. The banner text is large display type on a blue bar.
 * The defect switch only sets the banner text color to a vivid red, about the same lightness as the blue bar. The clean side sets it to white. Nothing else changes (OQ-17).
 */
header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; border-bottom: 1px solid var(--color-border); }
.brand { font-weight: 700; font-size: 20px; }
nav { display: flex; gap: 26px; font-size: 15px; color: var(--color-muted); }
.banner { background-color: #2b5cff; height: 150px; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; }
.banner h1 { font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: 1px; color: #ffffff; }
.banner p { font-size: 20px; font-weight: 700; color: #ffffff; max-width: 260px; text-align: right; }
.grid { display: flex; gap: 24px; padding: 32px 48px; }
.card { flex: 1; border: 1px solid var(--color-border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.card svg { width: 100%; height: 150px; }
.card b { font-size: 16px; } .card span { font-size: 15px; color: #2b3138; }
h2.t { padding: 28px 48px 0; font-size: 22px; }

[data-defect="on"] .banner h1 { color: #ff2d2d; }
    </style>
  </head>
  <body>
<header><span class="brand">Marlowe &amp; Finch</span><nav><span>Kitchen</span><span>Bedroom</span><span>Garden</span><span>Sale</span></nav></header>
<section class="banner"><h1>WEEKEND SALE</h1><p>Up to 40% off linens and cookware</p></section>
<h2 class="t">Popular this week</h2>
<section class="grid"><div class="card"><svg width="120" height="90" viewBox="0 0 120 90"><rect width="120" height="90" fill="#d7d0c3"/><rect x="30" y="20" width="60" height="50" rx="6" fill="#ffffff" opacity=".7"/></svg><b>Stoneware bowl set</b><span>$34</span></div><div class="card"><svg width="120" height="90" viewBox="0 0 120 90"><rect width="120" height="90" fill="#c9d3d9"/><rect x="30" y="20" width="60" height="50" rx="6" fill="#ffffff" opacity=".7"/></svg><b>Linen duvet cover</b><span>$89</span></div><div class="card"><svg width="120" height="90" viewBox="0 0 120 90"><rect width="120" height="90" fill="#cfcbd6"/><rect x="30" y="20" width="60" height="50" rx="6" fill="#ffffff" opacity=".7"/></svg><b>Cast iron pan</b><span>$52</span></div><div class="card"><svg width="120" height="90" viewBox="0 0 120 90"><rect width="120" height="90" fill="#d9cdc1"/><rect x="30" y="20" width="60" height="50" rx="6" fill="#ffffff" opacity=".7"/></svg><b>Wool throw</b><span>$68</span></div></section>
  </body>
</html>
