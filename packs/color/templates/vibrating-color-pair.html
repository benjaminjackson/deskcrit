<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Color fixture: vibrating color pair (home goods store)</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion vibrating-color-pair. A home goods store. A neutral hero holds a headline and a small blue price flag with the word SALE.
 * The defect switch only sets the flag text color to a vivid red, about the same lightness as the blue flag. The clean side sets it to white. Nothing else changes (OQ-17).
 */
header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; border-bottom: 1px solid var(--color-border); }
.brand { font-weight: 700; font-size: 20px; }
nav { display: flex; gap: 26px; font-size: 15px; color: var(--color-muted); }
.hero { background: #efece6; height: 190px; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; }
.hero h1 { font-size: 40px; line-height: 1.15; font-weight: 700; max-width: 520px; }
.hero p { font-size: 18px; margin-top: 10px; color: #2b3138; }
.flag { background-color: #2b5cff; width: 210px; height: 74px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; letter-spacing: 2px; color: #ffffff; transform: rotate(-4deg); }
.grid { display: flex; gap: 24px; padding: 32px 48px; }
.card { flex: 1; border: 1px solid var(--color-border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.card svg { width: 100%; height: 150px; }
.card b { font-size: 16px; } .card span { font-size: 15px; color: #2b3138; }
h2.t { padding: 28px 48px 0; font-size: 22px; }

[data-defect="on"] .flag { color: #ff2d2d; }
    </style>
  </head>
  <body>
<header><span class="brand">Marlowe &amp; Finch</span><nav><span>Kitchen</span><span>Bedroom</span><span>Garden</span><span>Sale</span></nav></header>
<section class="hero"><div><h1>Linens and cookware for the weekend</h1><p>Up to 40% off through Sunday.</p></div><div class="flag">SALE</div></section>
<h2 class="t">Popular this week</h2>
<section class="grid"><div class="card"><svg viewBox="0 0 120 90" preserveAspectRatio="none"><rect width="120" height="90" fill="#d7d0c3"/><rect x="30" y="20" width="60" height="50" rx="6" fill="#ffffff" opacity=".7"/></svg><b>Stoneware bowl set</b><span>$34</span></div><div class="card"><svg viewBox="0 0 120 90" preserveAspectRatio="none"><rect width="120" height="90" fill="#c9d3d9"/><rect x="30" y="20" width="60" height="50" rx="6" fill="#ffffff" opacity=".7"/></svg><b>Linen duvet cover</b><span>$89</span></div><div class="card"><svg viewBox="0 0 120 90" preserveAspectRatio="none"><rect width="120" height="90" fill="#cfcbd6"/><rect x="30" y="20" width="60" height="50" rx="6" fill="#ffffff" opacity=".7"/></svg><b>Cast iron pan</b><span>$52</span></div><div class="card"><svg viewBox="0 0 120 90" preserveAspectRatio="none"><rect width="120" height="90" fill="#d9cdc1"/><rect x="30" y="20" width="60" height="50" rx="6" fill="#ffffff" opacity=".7"/></svg><b>Wool throw</b><span>$68</span></div></section>
  </body>
</html>
