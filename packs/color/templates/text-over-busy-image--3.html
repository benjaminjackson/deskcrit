    <meta charset="utf-8">
    <title>Color fixture: text over busy image (grocery)</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion text-over-busy-image. A grocery delivery page. A rounded banner shows a drawn market stall crowded with fruit and crates; a near-black heading sits on it and the lead paragraph sits on the plain page below.
 * The light panel element sits behind the text on both sides. The defect switch only sets its background-color to transparent; the clean side is a near-opaque white panel. Nothing else changes (OQ-17).
 */
header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; border-bottom: 1px solid var(--color-border); }
.brand { font-weight: 700; font-size: 21px; color: #b3321f; }
nav { display: flex; gap: 26px; font-size: 15px; color: var(--color-muted); }
.wrap { padding: 24px 48px 0; }
.hero { position: relative; height: 352px; overflow: hidden; }
.hero svg { position: absolute; inset: 0; display: block; }
.scrim { position: absolute; }
.hero .copy { position: absolute; }
.hero { border-radius: 14px; }
.scrim { left: 40px; bottom: 36px; width: 560px; height: 112px; border-radius: 8px; background-color: rgba(255, 255, 255, 0.92); }
.hero .copy { left: 64px; bottom: 56px; width: 520px; color: #14181c; }
.copy h1 { font-size: 36px; line-height: 1.15; font-weight: 700; margin-bottom: 10px; }
.lead { margin-top: 16px; font-size: 18px; line-height: 1.45; color: #2b3138; }
.row { display: flex; gap: 20px; margin-top: 22px; }
.row div { flex: 1; border: 1px solid var(--color-border); border-radius: 8px; padding: 14px 18px; font-size: 15px; color: #2b3138; }
.row b { display: block; font-size: 16px; color: var(--color-text); margin-bottom: 2px; }

[data-defect="on"] .scrim { background-color: transparent; }
    </style>
