<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Color fixture: vibrating color pair (conference)</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion vibrating-color-pair. A conference landing page. A large orange block on the left holds the event name in violet display type; the agenda and sign-up sit on white on the right.
 * The defect switch only sets the event name color to a vivid violet, about the same lightness as the orange block. The clean side sets it to a deep indigo. Nothing else changes (OQ-17).
 */
header { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; border-bottom: 1px solid var(--color-border); }
.brand { font-weight: 700; font-size: 19px; }
nav { display: flex; gap: 24px; font-size: 14px; color: var(--color-muted); }
main { display: flex; gap: 40px; padding: 36px 48px; }
.logo { width: 500px; height: 400px; background-color: #f0701e; padding: 36px; display: flex; flex-direction: column; justify-content: center; }
.logo h1 { font-family: var(--font-serif); font-size: 68px; line-height: 1.02; font-weight: 700; color: #1a0f5c; }
.logo p { margin-top: 16px; font-size: 18px; font-weight: 700; color: #1f2328; }
.agenda { flex: 1; padding-top: 6px; }
.agenda h2 { font-size: 22px; margin-bottom: 12px; }
.agenda li { list-style: none; display: flex; gap: 18px; font-size: 17px; padding: 12px 0; border-bottom: 1px solid var(--color-border); color: #2b3138; }
.agenda li b { width: 90px; color: var(--color-text); }
.join { margin-top: 24px; display: inline-block; background: #1f2328; color: #ffffff; font-weight: 700; font-size: 16px; padding: 12px 28px; border-radius: 6px; }

[data-defect="on"] .logo h1 { color: #8a7bff; }
    </style>
  </head>
  <body>
<header><span class="brand">Tidewater Summit</span><nav><span>Agenda</span><span>Speakers</span><span>Venue</span><span>Register</span></nav></header>
<main><section class="logo"><h1>Tidewater Summit</h1><p>Two days on coastal planning, 9 and 10 October, Harbor Hall</p></section>
<section class="agenda"><h2>Day one</h2><ul><li><b>9:00</b>Opening session</li><li><b>10:15</b>Flood maps and local budgets</li><li><b>12:00</b>Lunch on the terrace</li><li><b>13:30</b>Working groups</li><li><b>16:00</b>Closing talk</li></ul><span class="join">Register now</span></section></main>
  </body>
</html>
