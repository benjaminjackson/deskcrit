<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Color fixture: same role, different colors, class booking app</title>
    <meta name="crit-viewport" content="390x844">
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion same-role-different-colors. A phone screen of a studio booking app on a white page. Four class cards
 * are stacked, each with the same "Reserve" button. The clean side draws every button in one indigo. The defect
 * switch changes the background-color of the four buttons to indigo, green, orange and pink. Nothing else
 * changes.
 */
html, body { width: 390px; height: 844px; }
.top { padding: 22px 20px 6px; }
.top .date { font-size: 14px; color: var(--color-muted); }
.top h1 { font-size: 26px; font-weight: 700; margin-top: 4px; }
.days { display: flex; gap: 8px; padding: 12px 20px 14px; font-size: 13px; }
.days span { flex: 1; text-align: center; padding: 8px 0; border-radius: 8px; background: #eef0f3; color: #3a424a; }
.days .on { background: #1f2328; color: #fff; font-weight: 700; }
.list { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
.cls { display: flex; align-items: center; border: 1px solid #e0e4e8; border-radius: 12px; padding: 14px 14px 14px 16px; height: 100px; }
.cls .t { width: 62px; font-size: 15px; font-weight: 700; }
.cls .d { flex: 1; }
.cls h2 { font-size: 17px; font-weight: 700; }
.cls .m { font-size: 13px; color: var(--color-muted); margin-top: 3px; }
.res { font-size: 14px; font-weight: 700; color: #fff; padding: 10px 14px; border-radius: 8px; background-color: #4a47b8; }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; border-top: 1px solid #e0e4e8; display: flex; justify-content: space-around; align-items: center; font-size: 12px; color: var(--color-muted); background: #fff; }
.tabs .on { color: #1f2328; font-weight: 700; }

[data-defect="on"] .s1 { background-color: #4a47b8; }
[data-defect="on"] .s2 { background-color: #2a7d4a; }
[data-defect="on"] .s3 { background-color: #c0630f; }
[data-defect="on"] .s4 { background-color: #b83d7a; }
    </style>
  </head>
  <body>
<div class="top"><div class="date">Fireside Yoga Studio</div><h1>Classes this week</h1></div>
<div class="days"><span>Mon</span><span>Tue</span><span class="on">Wed</span><span>Thu</span><span>Fri</span></div>
<div class="list">
  <div class="cls"><span class="t">7:00</span><div class="d"><h2>Morning flow</h2><div class="m">60 min, 4 spots left</div></div><span class="res s1">Reserve</span></div>
  <div class="cls"><span class="t">9:30</span><div class="d"><h2>Gentle stretch</h2><div class="m">45 min, 9 spots left</div></div><span class="res s2">Reserve</span></div>
  <div class="cls"><span class="t">12:15</span><div class="d"><h2>Lunch strength</h2><div class="m">30 min, 6 spots left</div></div><span class="res s3">Reserve</span></div>
  <div class="cls"><span class="t">6:00</span><div class="d"><h2>Evening unwind</h2><div class="m">60 min, 11 spots left</div></div><span class="res s4">Reserve</span></div>
</div>
<div class="tabs"><span>Home</span><span class="on">Classes</span><span>Bookings</span><span>Account</span></div>
  </body>
</html>
