    <script src="../../_renderer/base.js"></script>

    <style>
html, body { width: 390px; height: 844px; }
body { background: #f4f6f9; position: relative; overflow: hidden; }
.status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 14px; font-weight: 700; background: #0b3b6f; color: #fff; }
.top { background: #0b3b6f; color: #fff; padding: 6px 24px 28px; }
.top .small { font-size: 14px; color: #bcd0e8; }
.top .bal { font-size: 36px; font-weight: 700; margin: 4px 0 2px; }
.top .acct { font-size: 14px; color: #bcd0e8; }
.actions { display: flex; justify-content: space-between; padding: 22px 24px 8px; }
.act { width: 74px; text-align: center; font-size: 13px; color: #1f2937; }
.tile { width: 56px; height: 56px; border-radius: 16px; background: #fff; border: 1px solid #e1e6ee; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; }
.tile svg { width: 28px; height: 28px; }
.icon, .icon-plain { color: #0b3b6f; stroke-width: 1.75px; }
.icon *, .icon-plain * { vector-effect: non-scaling-stroke; }
h2 { font-size: 16px; padding: 18px 24px 8px; }
.row { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 13px 24px; border-bottom: 1px solid #edf0f4; }
.row .n { font-size: 15px; font-weight: 700; }
.row .d { font-size: 13px; color: #6b7686; }
.row .a { font-size: 15px; font-weight: 700; }
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #fff; border-top: 1px solid #e1e6ee; display: flex; justify-content: space-around; padding: 10px 6px 0; }
.tab { width: 66px; text-align: center; font-size: 11px; color: #536173; }
.tab svg { width: 26px; height: 26px; margin-bottom: 3px; }
.tab.on { color: #0b3b6f; font-weight: 700; }
.icon-detailed { display: none; }
[data-defect="on"] .icon-plain { display: none; }
[data-defect="on"] .icon-detailed { display: inline-block; }
    </style>
  </head>
