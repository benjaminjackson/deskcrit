<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Art-direction fixture: mixed rendering styles (trail cards)</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
Criterion mixed-rendering-styles. A hiking app page listing four trails. On the clean side every card shows a photograph. The defect swaps the third card's photograph for a flat vector landscape at the same size and crop. Only display changes (OQ-17).
 */
body { background: #f1f3ee; }
header { height: 64px; display:flex; align-items:center; justify-content:space-between; padding:0 48px; background:#20372c; color:#fff; }
.brand { font-family: var(--font-serif); font-size: 22px; font-weight: 700; }
nav { display:flex; gap:28px; font-size:15px; color:#cfe0d6; } nav .on { color:#fff; font-weight:700; }
main { padding: 36px 48px 0; }
.eyebrow { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:#5a6b61; }
h1 { font-size: 34px; margin: 4px 0 18px; color:#1c2b23; }
.filters { display:flex; gap:10px; margin-bottom:26px; }
.chip { border:1px solid #c5cfc8; border-radius:999px; padding:7px 16px; font-size:14px; background:#fff; color:#3b4a41; }
.chip.on { background:#20372c; color:#fff; border-color:#20372c; }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }
.card { background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.12); padding-bottom:18px; }
.art { width:100%; height:230px; overflow:hidden; }
.art > div, .art svg, .art img { display:block; width:100%; height:100%; }
.art img { object-fit:cover; }
.meta { display:flex; justify-content:space-between; margin:14px 16px 4px; font-size:13px; color:#5a6b61; }
.lvl { font-weight:700; color:#2f6b45; }
.card h3 { font-size:18px; margin:0 16px; color:#1c2b23; }
.art-alt { display: none; }
[data-defect="on"] .art-base { display: none; }
[data-defect="on"] .art-alt { display: block; }
    </style>
  </head>
  <body>
<header><div class="brand">Switchback</div><nav><span class="on">Trails</span><span>Maps</span><span>Saved</span><span>Events</span></nav></header>
<main><p class="eyebrow">Within 25 miles</p><h1>Trails near you</h1><div class="filters"><span class="chip on">All trails</span><span class="chip">Easy</span><span class="chip">Moderate</span><span class="chip">Hard</span><span class="chip">Dog friendly</span></div><div class="grid"><article class="card"><div class="art"><img src="../photos/trail-bierstadt-lake.jpg" alt="Trail to a mountain lake"></div><div class="meta"><span class="lvl">Moderate</span><span>4.7 mi loop</span></div><h3>Bierstadt Lake Loop</h3></article><article class="card"><div class="art"><img src="../photos/trail-forest-oberlibbach.jpg" alt="Forest path"></div><div class="meta"><span class="lvl">Easy</span><span>2.9 mi out and back</span></div><h3>Oberlibbach Forest Walk</h3></article><article class="card"><div class="art"><div class="art-base"><img src="../photos/canyon-desert-view.jpg" alt="Canyon view"></div><div class="art-alt"><svg class="" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="320" height="200" fill="#d9ecf2"/><circle cx="246" cy="52" r="22" fill="#e9c46a"/>
<polygon points="20,150 110,50 200,150" fill="#264653"/><polygon points="130,150 220,70 310,150" fill="#2a9d8f"/>
<polygon points="110,50 128,72 110,66 92,76" fill="#ffffff"/>
<rect y="140" width="320" height="60" fill="#8fc9a4"/><path d="M150 200 q-40 -26 10 -60" fill="none" stroke="#f4a261" stroke-width="14" stroke-linecap="round"/>
<circle cx="70" cy="168" r="12" fill="#2a9d8f"/><circle cx="250" cy="170" r="10" fill="#2a9d8f"/></svg></div></div><div class="meta"><span class="lvl">Hard</span><span>6.2 mi out and back</span></div><h3>Canyon Rim Overlook</h3></article><article class="card"><div class="art"><img src="../photos/valley-belle-fourche.jpg" alt="River valley"></div><div class="meta"><span class="lvl">Easy</span><span>3.8 mi point to point</span></div><h3>Belle Fourche Valley</h3></article></div></main>
  </body>
</html>
