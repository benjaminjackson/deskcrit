  - id: all-caps-long-text
    title: 'Long text is set in all capitals'
    source: 'Butterick, Practical Typography, "All caps" ("Caps are suitable for headings shorter than one line"; "Don''t capitalize whole paragraphs").'
    link: https://practicaltypography.com/all-caps.html
    question:
      type: noul
      instructions: 'In the image at screenshot: Is a sentence or paragraph that runs to more than one line set entirely in capital letters?'
      criteria:
        "true": 'A sentence or paragraph that runs to more than one line is set entirely in capital letters.'
        "false": 'No sentence or paragraph that runs to more than one line is set entirely in capital letters.'
    fail_when: { probability_at_least: 0.7 }
    pass_when: { probability_at_most: 0.3 }
    fix: 'Set sentences and paragraphs in upper and lower case, and keep capitals for headings shorter than one line, labels, and captions (Butterick, Practical Typography, "All caps").'
