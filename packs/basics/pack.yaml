  - id: text-reads-faint
    title: 'Text reads as faint'
    source: 'W3C, WCAG 2.2, SC 1.4.3 Contrast (Minimum).'
    link: https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
    question:
      type: noul
      instructions: 'In the image at screenshot: Is there text that is pale against its background, such as light grey text on white?'
      criteria:
        "true": 'Some text is pale against its background, such as light grey text on white.'
        "false": 'All text stands out clearly from its background.'
    fail_when: { probability_at_least: 0.7 }
    pass_when: { probability_at_most: 0.3 }
    fix: 'Darken the text or change its background until the text has a contrast ratio of at least 4.5:1, or 3:1 for large text (WCAG 2.2, SC 1.4.3 Contrast (Minimum)).'
    fixtures:
      positive:
