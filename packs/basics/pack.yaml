        - fixtures/decorative-face-for-paragraphs--6.positive.png
        - fixtures/decorative-face-for-paragraphs--7.positive.png
        - fixtures/decorative-face-for-paragraphs--8.positive.png
        - fixtures/decorative-face-for-paragraphs--9.positive.png
        - fixtures/decorative-face-for-paragraphs--10.positive.png
      negative:
