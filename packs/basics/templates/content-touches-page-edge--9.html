<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basics fixture: content-touches-page-edge (9)</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A callback request form in a bordered card. The card sits inside 120 px margins on the off side. The defect stretches
         the card to the full width of the page, squares its corners, and cuts its side padding to 6 px, so the labels and
         fields start 6 px from the left edge (OQ-17). */
      .page { margin: 56px 120px 0; }
      .page h1 { font-size: 32px; margin-bottom: 10px; }
      .page .lede { font-size: 17px; color: #424a53; margin-bottom: 28px; }
      .card { padding: 32px; border: 1px solid var(--color-border); border-radius: 10px; background-color: #fbfcfd; }
      .row { display: flex; gap: 20px; margin-bottom: 20px; }
      .field { flex: 1; }
      .field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
      .field div { padding: 10px 12px; font-size: 16px; color: var(--color-muted); border: 1px solid var(--color-border); border-radius: 6px; background-color: #fff; }
      .send { display: inline-block; padding: 11px 24px; border-radius: 6px; background-color: #0b5cad; color: #fff; font-weight: 700; }
      [data-defect="on"] .page { margin: 56px 0 0; }
      [data-defect="on"] .page h1, [data-defect="on"] .page .lede { margin-left: 120px; }
      [data-defect="on"] .card { padding: 32px 6px; border-radius: 0; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Ask us to call you back</h1>
      <div class="lede">Leave your number and a good time to call, and someone from the energy advice team will ring you within two working days.</div>
      <div class="card">
        <div class="row">
          <div class="field"><label>Your name</label><div>First and last name</div></div>
          <div class="field"><label>Phone number</label><div>A number we can call</div></div>
        </div>
        <div class="row">
          <div class="field"><label>Best time to call</label><div>Weekday mornings</div></div>
          <div class="field"><label>What is it about?</label><div>Insulating my loft</div></div>
        </div>
        <span class="send">Request a call</span>
      </div>
    </div>
  </body>
</html>
