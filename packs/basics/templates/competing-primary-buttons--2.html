<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basics fixture: competing-primary-buttons--2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A plan card with three stacked full-width actions. The off side has one filled primary action
         and two quieter ones (an outline and a text link). The defect fills all three the same (OQ-17). */
      .card { margin: 96px auto 0; width: 520px; border: 2px solid var(--color-border); border-radius: 14px; padding: 40px; }
      h1 { font-size: 28px; margin-bottom: 8px; }
      p { color: var(--color-muted); font-size: 17px; margin-bottom: 32px; }
      .button { display: block; text-align: center; font-size: 17px; padding: 14px 20px; border-radius: 8px; margin-bottom: 14px; border: 2px solid transparent; color: var(--color-accent); }
      .button.primary { background: var(--color-accent); color: #fff; font-weight: 700; }
      .button.outline { border-color: #8c959f; color: #424a53; }
      [data-defect="on"] .button { background: var(--color-accent); color: #fff; font-weight: 700; border-color: transparent; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Your trial ends in two days</h1>
      <p>Keep the editor, the shared folders, and the export tools by choosing a plan.</p>
      <span class="button primary">Upgrade to Pro</span>
      <span class="button outline">Compare plans</span>
      <span class="button">Talk to the team</span>
    </div>
  </body>
</html>
