<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basics fixture: competing-primary-buttons--6</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A shopping basket with a summary panel. The off side has Checkout filled dark green, and Apply and Continue
         shopping as outlined buttons. The defect fills all three in the same green with white bold text (OQ-17). */
      .page { margin: 56px 120px 0; }
      .page h1 { font-size: 32px; margin-bottom: 28px; }
      .layout { display: flex; gap: 48px; }
      .items { flex: 1; }
      .item { display: flex; gap: 20px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--color-border); }
      .item .thumb { width: 88px; height: 88px; border-radius: 6px; background: #ece6dc; }
      .item .name { flex: 1; font-size: 17px; }
      .item .name div { font-size: 14px; color: var(--color-muted); }
      .item .cost { font-size: 17px; font-weight: 700; }
      .summary { width: 360px; padding: 28px; border: 1px solid var(--color-border); border-radius: 8px; }
      .row { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 12px; }
      .row.total { font-size: 19px; font-weight: 700; margin: 18px 0 22px; }
      .coupon { display: flex; gap: 8px; margin-bottom: 8px; }
      .coupon .field { flex: 1; padding: 10px 12px; font-size: 15px; color: var(--color-muted); border: 1px solid var(--color-border); border-radius: 6px; }
      .button { display: block; text-align: center; font-size: 16px; padding: 11px 20px; border-radius: 6px; border: 2px solid #1f6f4a; color: #1f6f4a; background-color: transparent; }
      .coupon .button { display: inline-block; }
      .button.primary { background-color: #1f6f4a; color: #fff; font-weight: 700; margin-bottom: 12px; }
      [data-defect="on"] .button { background-color: #1f6f4a; color: #fff; font-weight: 700; border-color: #1f6f4a; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Your basket</h1>
      <div class="layout">
        <div class="items">
          <div class="item"><div class="thumb"></div><div class="name">Stoneware pour-over set<div>Oat glaze · Quantity 1</div></div><div class="cost">£48.00</div></div>
          <div class="item"><div class="thumb"></div><div class="name">Unbleached paper filters<div>Size 2, pack of 100 · Quantity 2</div></div><div class="cost">£9.00</div></div>
          <div class="item"><div class="thumb"></div><div class="name">Linen tea towel<div>Sage · Quantity 1</div></div><div class="cost">£14.00</div></div>
        </div>
        <div class="summary">
          <div class="row"><span>Subtotal</span><span>£71.00</span></div>
          <div class="row"><span>Delivery</span><span>£4.50</span></div>
          <div class="coupon"><span class="field">Discount code</span><span class="button">Apply</span></div>
          <div class="row total"><span>Total</span><span>£75.50</span></div>
          <span class="button primary">Checkout</span>
          <span class="button">Continue shopping</span>
        </div>
      </div>
    </div>
  </body>
</html>
