<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basics fixture: competing-primary-buttons</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A dialog with one filled primary button and three quiet secondary buttons. The defect gives
         every button the same filled accent style as the primary one (OQ-17). */
      .dialog { margin: 120px auto 0; width: 820px; border: 2px solid var(--color-border); border-radius: 12px; padding: 48px; box-shadow: 0 8px 24px rgba(31, 35, 40, 0.12); }
      h1 { font-size: 30px; font-weight: 700; margin-bottom: 16px; }
      p { font-size: 18px; margin-bottom: 40px; }
      .actions { display: flex; gap: 16px; justify-content: flex-end; }
      .button { white-space: nowrap; padding: 14px 24px; border-radius: 8px; font-size: 17px; font-weight: 400; color: var(--color-accent); border: 2px solid transparent; }
      .button.outline { border-color: #8c959f; color: #424a53; }
      .button.primary { background: var(--color-accent); color: #fff; font-weight: 700; }
      [data-defect="on"] .button { background: var(--color-accent); color: #fff; font-weight: 700; border-color: transparent; }
    </style>
  </head>
  <body>
    <div class="dialog">
      <h1>Save changes to the shared calendar?</h1>
      <p>The new choir rehearsal times will be shown to everyone who follows this calendar.</p>
      <div class="actions">
        <span class="button">Export as file</span>
        <span class="button">Discard changes</span>
        <span class="button outline">Keep editing</span>
        <span class="button primary">Save changes</span>
      </div>
    </div>
  </body>
</html>
