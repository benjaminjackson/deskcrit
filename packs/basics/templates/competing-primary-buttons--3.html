<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basics fixture: competing-primary-buttons--3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* An editor toolbar with a Publish action and three others. The off side has Publish filled green
         and the others as quiet grey text buttons. The defect fills all four in the same strong green (OQ-17). */
      .bar { display: flex; align-items: center; gap: 12px; height: 80px; padding: 0 48px; border-bottom: 2px solid var(--color-border); }
      .bar .title { font-size: 20px; font-weight: 700; margin-right: auto; }
      .button { font-size: 16px; padding: 10px 20px; border-radius: 6px; color: #424a53; border: 2px solid transparent; }
      .button.primary { background: #15803d; color: #fff; font-weight: 700; }
      .doc { margin: 56px auto 0; width: 720px; }
      .doc h1 { font-family: var(--font-serif); font-size: 40px; margin-bottom: 16px; }
      .doc p { font-family: var(--font-serif); font-size: 19px; color: var(--color-muted); margin-bottom: 16px; }
      [data-defect="on"] .button { background: #15803d; color: #fff; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="title">Untitled draft</span>
      <span class="button">Save draft</span>
      <span class="button">Preview</span>
      <span class="button">Share link</span>
      <span class="button primary">Publish</span>
    </div>
    <div class="doc">
      <h1>Notes from the river survey</h1>
      <p>We counted eleven species of water bird between the weir and the old mill, and three nests under the footbridge.</p>
      <p>The survey will be repeated each season, and volunteers are welcome to join the Sunday walks.</p>
    </div>
  </body>
</html>
