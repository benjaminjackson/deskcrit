<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basics fixture: competing-primary-buttons--5</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A hero banner with a main call and a second call. The off side has "Join now" filled orange and
         "See how it works" as a plain text link. The defect gives both the same large filled orange
         button (OQ-17). */
      body { background: #1b2a41; color: #fff; }
      main { margin: 160px 120px 0; width: 760px; }
      .eyebrow { color: #f2c27a; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
      h1 { font-family: var(--font-serif); font-size: 60px; line-height: 1.08; margin-bottom: 20px; }
      p { font-size: 20px; color: #d3dbe8; margin-bottom: 40px; }
      .actions { display: flex; gap: 20px; align-items: center; }
      .button { font-size: 19px; padding: 16px 32px; border-radius: 8px; border: 2px solid transparent; color: #f2c27a; text-decoration: underline; }
      .button.primary { background: #e8590c; color: #fff; font-weight: 700; text-decoration: none; }
      [data-defect="on"] .button { background: #e8590c; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Neighbourhood tool library</div>
      <h1>Borrow the drill, skip the shelf space</h1>
      <p>Over four hundred tools to lend, from ladders to tile cutters, for a small yearly fee.</p>
      <div class="actions">
        <span class="button primary">Join now</span>
        <span class="button">See how it works</span>
      </div>
    </main>
  </body>
</html>
