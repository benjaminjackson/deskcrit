<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basics fixture: competing-primary-buttons--8</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Step two of a sign-up form. The off side has Continue filled blue, Back outlined, and Skip for now as an underlined
         text link. The defect fills all three in the same blue with white bold text and no underline (OQ-17). */
      .wrap { margin: 72px auto 0; width: 560px; }
      .steps { font-size: 14px; color: var(--color-muted); margin-bottom: 12px; }
      .wrap h1 { font-size: 30px; line-height: 1.25; margin-bottom: 10px; }
      .wrap .lede { font-size: 17px; color: #424a53; margin-bottom: 28px; }
      .option { display: flex; gap: 14px; align-items: center; padding: 16px 18px; margin-bottom: 12px; border: 1px solid var(--color-border); border-radius: 8px; font-size: 17px; }
      .option .box { width: 20px; height: 20px; border: 2px solid #8c959f; border-radius: 4px; }
      .option.on .box { background-color: #1d4ed8; border-color: #1d4ed8; }
      .actions { display: flex; align-items: center; gap: 12px; margin-top: 28px; }
      .button { font-size: 16px; padding: 10px 22px; border-radius: 6px; border: 2px solid #1d4ed8; color: #1d4ed8; background-color: transparent; }
      .button.link { border-color: transparent; text-decoration: underline; margin-left: auto; }
      .button.primary { background-color: #1d4ed8; color: #fff; font-weight: 700; }
      [data-defect="on"] .button { background-color: #1d4ed8; color: #fff; font-weight: 700; border-color: #1d4ed8; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="steps">Step 2 of 3</div>
      <h1>What would you like to hear about?</h1>
      <div class="lede">Choose the topics for your weekly email. You can change them later.</div>
      <div class="option on"><span class="box"></span>Events in the town centre</div>
      <div class="option"><span class="box"></span>Road works and bus changes</div>
      <div class="option on"><span class="box"></span>Library and museum news</div>
      <div class="option"><span class="box"></span>Council meetings</div>
      <div class="actions"><span class="button">Back</span><span class="button primary">Continue</span><span class="button link">Skip for now</span></div>
    </div>
  </body>
</html>
