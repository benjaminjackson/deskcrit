<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basics fixture: competing-primary-buttons--10</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* The hero of a product landing page. The off side has Start free trial filled purple, Book a demo outlined, and See
         pricing as a text button. The defect fills all three in the same purple with white bold text (OQ-17). */
      .bar { display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 96px; border-bottom: 1px solid var(--color-border); }
      .bar .name { font-size: 20px; font-weight: 700; }
      .bar nav span { margin-left: 28px; font-size: 15px; }
      .hero { margin: 96px auto 0; width: 820px; text-align: center; }
      .hero h1 { font-size: 52px; line-height: 1.15; margin-bottom: 20px; }
      .hero p { font-size: 20px; line-height: 1.5; color: #424a53; margin: 0 auto 36px; width: 640px; }
      .actions { display: flex; justify-content: center; gap: 14px; }
      .button { font-size: 17px; padding: 12px 24px; border-radius: 8px; border: 2px solid #5b3cc4; color: #5b3cc4; background-color: transparent; }
      .button.quiet { border-color: transparent; }
      .button.primary { background-color: #5b3cc4; color: #fff; font-weight: 700; }
      [data-defect="on"] .button { background-color: #5b3cc4; color: #fff; font-weight: 700; border-color: #5b3cc4; }
    </style>
  </head>
  <body>
    <div class="bar"><span class="name">Rotaplan</span><nav><span>Features</span><span>Pricing</span><span>Help</span><span>Sign in</span></nav></div>
    <div class="hero">
      <h1>Staff rotas that sort themselves out</h1>
      <p>Rotaplan builds next week's shifts from your team's hours and holidays, and sends each person their times by text.</p>
      <div class="actions"><span class="button primary">Start free trial</span><span class="button">Book a demo</span><span class="button quiet">See pricing</span></div>
    </div>
  </body>
</html>
