<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basics fixture: competing-primary-buttons--4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A survey step footer with four actions in a row. The off side has Next filled navy, with Back as an
         outline and Skip and Save and exit as quiet text. The defect fills all four in the same navy,
         at the same size and weight (OQ-17). */
      .step { margin: 88px 160px 0; }
      .progress { height: 8px; width: 960px; background: #e6eaef; border-radius: 4px; margin-bottom: 40px; }
      .progress div { width: 480px; height: 8px; background: #14213d; border-radius: 4px; }
      h1 { font-family: var(--font-serif); font-size: 38px; margin-bottom: 20px; }
      .options { margin-bottom: 56px; }
      .option { border: 2px solid var(--color-border); border-radius: 8px; padding: 14px 20px; width: 560px; margin-bottom: 12px; font-size: 18px; }
      .actions { display: flex; gap: 16px; }
      .button { font-size: 18px; padding: 14px 28px; border-radius: 8px; border: 2px solid transparent; color: var(--color-muted); }
      .button.outline { border-color: #8c959f; color: #1f2328; }
      .button.primary { background: #14213d; color: #fff; font-weight: 700; margin-left: auto; }
      [data-defect="on"] .button { background: #14213d; color: #fff; font-weight: 700; border-color: transparent; }
    </style>
  </head>
  <body>
    <div class="step">
      <div class="progress"><div></div></div>
      <h1>How do you usually get to the library?</h1>
      <div class="options">
        <div class="option">On foot</div>
        <div class="option">By bicycle</div>
        <div class="option">By bus</div>
        <div class="option">By car</div>
      </div>
      <div class="actions">
        <span class="button outline">Back</span>
        <span class="button">Skip</span>
        <span class="button">Save and exit</span>
        <span class="button primary">Next</span>
      </div>
    </div>
  </body>
</html>
