<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basics fixture: content-touches-page-edge (4)</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A schedule table inside 96 px margins. The defect stretches the table to the full width of the page and drops the cell padding, so its
         text starts at the left edge and its last column touches the right edge (OQ-17). */
      main { margin: 56px 96px 0; }
      h1 { font-size: 30px; margin-bottom: 24px; }
      table { width: 100%; border-collapse: collapse; background: #f4f7fb; }
      th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--color-border); font-size: 18px; }
      th { color: var(--color-muted); font-weight: 400; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
      td:last-child, th:last-child { text-align: right; }
      [data-defect="on"] main { margin: 56px 0 0; }
      [data-defect="on"] th, [data-defect="on"] td { padding-left: 0; padding-right: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bus route 14 departures</h1>
      <table>
        <tr><th>Stop</th><th>Weekday</th><th>Saturday</th><th>Platform</th></tr>
        <tr><td>Mill Road</td><td>06:10</td><td>07:00</td><td>A</td></tr>
        <tr><td>Library square</td><td>06:25</td><td>07:15</td><td>C</td></tr>
        <tr><td>Hospital gate</td><td>06:40</td><td>07:30</td><td>B</td></tr>
        <tr><td>Canal bridge</td><td>06:55</td><td>07:45</td><td>A</td></tr>
        <tr><td>Rook Hill</td><td>07:10</td><td>08:00</td><td>D</td></tr>
        <tr><td>Harbour terminal</td><td>07:25</td><td>08:15</td><td>C</td></tr>
      </table>
    </main>
  </body>
</html>
