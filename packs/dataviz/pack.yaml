# The first-party dataviz pack (crit-q25.9, FR-55). It encodes eight askable entries in the "Data
# visualization" section of GUIDELINES.md. Every question is noul, and true is the defect (JC-5). Each
# question is the pre-screen wording in spike/prescreen/dataviz/questions.json, unchanged.
# Two pre-screened criteria are not encoded: series-split-only-by-red-green and tangled-overlaid-lines.
# GUIDELINES.md records why. After the EV-5 run (crit-q25.14, crit-q25.28), the seven criteria at or
# above the agreement floor have pass_when and fail_when. heavy-gridlines-and-frames is below the floor,
# so it has warn_when only and warn is its most severe verdict (EV-5).
# Sources: FR-45 lets this pack cite the standard references of its field, among them Wilke and Few
# (changed 2026-10-25, crit-q25.25). Each source names that reference and, where one exists, the Tufte
# page, and every Tufte page is marked "page unchecked".
# Benjamin Jackson approved the eight fix hints on 2026-10-25 (G-4).
name: dataviz
version: 0.1.0
title: Data visualization
license: MIT
criteria:
  - id: heavy-gridlines-and-frames
    title: 'A chart has dark gridlines or a frame as strong as its data'
    source: 'Claus O. Wilke, *Fundamentals of Data Visualization* (O''Reilly, 1st ed. 2019), chapter 23.2 "Background grids"; Edward Tufte, *The Visual Display of Quantitative Information* (Graphics Press, 2nd ed. 2001), chapter 5, section "The Grid", about p. 112, page unchecked.'
    link: https://clauswilke.com/dataviz/
    question:
      type: noul
      instructions: 'In the image at screenshot, do the lines that only hold a chart together, such as its gridlines, axis lines, borders, or a box around the plot, look as bold and prominent as the bars, lines, or points that show the data?'
      criteria:
        "true": 'In a chart, the gridlines, axis lines, borders, or box around the plot are drawn so boldly that they compete for the eye with the bars, lines, or points that show the data.'
        "false": 'In every chart, the gridlines, axis lines, borders, and box around the plot are absent or faint and recede behind the data, so the bars, lines, or points are what the eye sees first, or the image shows no chart.'
    warn_when: { probability_at_least: 0.7 }
    fix: 'Make the gridlines and axis lines thin and pale gray, or remove them, and remove the frame around the plot, so that the data marks are the darkest lines in the chart (Wilke, *Fundamentals of Data Visualization*).'
    fixtures:
      positive:
        - fixtures/heavy-gridlines-and-frames.positive.png
        - fixtures/heavy-gridlines-and-frames--2.positive.png
        - fixtures/heavy-gridlines-and-frames--3.positive.png
        - fixtures/heavy-gridlines-and-frames--4.positive.png
        - fixtures/heavy-gridlines-and-frames--5.positive.png
      negative:
        - fixtures/heavy-gridlines-and-frames.negative.png
        - fixtures/heavy-gridlines-and-frames--2.negative.png
        - fixtures/heavy-gridlines-and-frames--3.negative.png
        - fixtures/heavy-gridlines-and-frames--4.negative.png
        - fixtures/heavy-gridlines-and-frames--5.negative.png

  - id: chartjunk-decoration
    title: 'A chart carries decoration that shows no data'
    source: 'Stephen Few, "Common Pitfalls in Dashboard Design" (Perceptual Edge, 2006), pitfall 11; Edward Tufte, *The Visual Display of Quantitative Information* (Graphics Press, 2nd ed. 2001), chapter 5, about pp. 107-121, page unchecked.'
    link: https://www.perceptualedge.com/articles/Whitepapers/Common_Pitfalls.pdf
    question:
      type: noul
      instructions: 'In the image at screenshot, does a chart carry decoration that shows no data, such as pictures, icons, patterned or textured fills, or ornamental backgrounds behind or inside the marks?'
      criteria:
        "true": 'A chart carries decoration that shows no data, such as pictures, icons, patterned or textured fills, or ornamental backgrounds behind or inside the marks.'
        "false": 'Every chart is drawn with plain marks, axes, and labels and carries no decoration that shows no data, or the image shows no chart.'
    pass_when: { probability_at_most: 0.3 }
    fail_when: { probability_at_least: 0.7 }
    fix: 'Remove the pictures, icons, patterns, and ornamental backgrounds, and draw the marks in plain flat color on a plain background (Few, "Common Pitfalls in Dashboard Design").'
    fixtures:
      positive:
        - fixtures/chartjunk-decoration.positive.png
        - fixtures/chartjunk-decoration--2.positive.png
        - fixtures/chartjunk-decoration--3.positive.png
        - fixtures/chartjunk-decoration--4.positive.png
        - fixtures/chartjunk-decoration--5.positive.png
      negative:
        - fixtures/chartjunk-decoration.negative.png
        - fixtures/chartjunk-decoration--2.negative.png
        - fixtures/chartjunk-decoration--3.negative.png
        - fixtures/chartjunk-decoration--4.negative.png
        - fixtures/chartjunk-decoration--5.negative.png

  - id: three-d-chart
    title: 'A chart is drawn in 3D'
    source: 'Claus O. Wilke, *Fundamentals of Data Visualization* (O''Reilly, 1st ed. 2019), chapter 26.1 "Avoid gratuitous 3D"; Stephen Few, "Common Pitfalls in Dashboard Design" (Perceptual Edge, 2006), pitfall 7; Edward Tufte, *The Visual Display of Quantitative Information* (Graphics Press, 2nd ed. 2001), chapter 2, about p. 71, page unchecked.'
    link: https://clauswilke.com/dataviz/
    question:
      type: noul
      instructions: 'In the image at screenshot, is a chart drawn with a three-dimensional effect, such as bars or pie slices with depth, sides, or a tilted perspective, when the data has no third dimension?'
      criteria:
        "true": 'A chart is drawn with a three-dimensional effect, such as bars or slices with depth, visible sides, or a tilted perspective.'
        "false": 'Every chart is drawn flat, with no depth, visible sides, or tilted perspective, or the image shows no chart.'
    pass_when: { probability_at_most: 0.3 }
    fail_when: { probability_at_least: 0.7 }
    fix: 'Draw the chart flat, with no depth, sides, or tilt, so that each value is read from one length or one angle (Wilke, *Fundamentals of Data Visualization*).'
    fixtures:
      positive:
        - fixtures/three-d-chart.positive.png
        - fixtures/three-d-chart--2.positive.png
        - fixtures/three-d-chart--3.positive.png
        - fixtures/three-d-chart--4.positive.png
        - fixtures/three-d-chart--5.positive.png
      negative:
        - fixtures/three-d-chart.negative.png
        - fixtures/three-d-chart--2.negative.png
        - fixtures/three-d-chart--3.negative.png
        - fixtures/three-d-chart--4.negative.png
        - fixtures/three-d-chart--5.negative.png

  - id: pie-too-many-slices
    title: 'A pie or donut has too many slices'
    source: 'Stephen Few, "Common Pitfalls in Dashboard Design" (Perceptual Edge, 2006), pitfall 5; Claus O. Wilke, *Fundamentals of Data Visualization* (O''Reilly, 1st ed. 2019), chapter 10.1; Edward Tufte, *The Visual Display of Quantitative Information* (Graphics Press, 2nd ed. 2001), about p. 178, page unchecked, in part.'
    link: https://www.perceptualedge.com/articles/Whitepapers/Common_Pitfalls.pdf
    question:
      type: noul
      instructions: 'In the image at screenshot, does a pie or donut chart have so many slices that the slices are hard to tell apart and compare?'
      criteria:
        "true": 'A pie or donut chart has so many slices that several are thin slivers and the slices are hard to tell apart and compare.'
        "false": 'Every pie or donut chart has few enough slices that each is easy to tell apart and compare, or the image shows no pie or donut chart.'
    pass_when: { probability_at_most: 0.3 }
    fail_when: { probability_at_least: 0.7 }
    fix: 'Keep the four or five largest slices and group the small ones into one Other slice, or show the shares as a sorted bar chart (Few, "Common Pitfalls in Dashboard Design").'
    fixtures:
      positive:
        - fixtures/pie-too-many-slices.positive.png
        - fixtures/pie-too-many-slices--2.positive.png
        - fixtures/pie-too-many-slices--3.positive.png
        - fixtures/pie-too-many-slices--4.positive.png
        - fixtures/pie-too-many-slices--5.positive.png
      negative:
        - fixtures/pie-too-many-slices.negative.png
        - fixtures/pie-too-many-slices--2.negative.png
        - fixtures/pie-too-many-slices--3.negative.png
        - fixtures/pie-too-many-slices--4.negative.png
        - fixtures/pie-too-many-slices--5.negative.png

  - id: rainbow-for-ordered-values
    title: 'Ordered values are shown with rainbow colors'
    source: 'Claus O. Wilke, *Fundamentals of Data Visualization* (O''Reilly, 1st ed. 2019), chapters 19.2 and 4.2; David Borland and Russell M. Taylor II, "Rainbow Color Map (Still) Considered Harmful", *IEEE Computer Graphics and Applications* 27(2), 2007; Edward Tufte, *The Visual Display of Quantitative Information* (Graphics Press, 2nd ed. 2001), about p. 154, page unchecked, in part.'
    link: https://clauswilke.com/dataviz/
    question:
      type: noul
      instructions: 'In the image at screenshot, does a chart or map show values that run from low to high with a rainbow of unrelated hues, such as red, yellow, green, and blue, instead of one color that grows lighter or darker?'
      criteria:
        "true": 'A chart or map shows values that run from low to high with a rainbow of unrelated hues, so the colors do not read as an order from low to high.'
        "false": 'Values that run from low to high are shown with one color, or two, that grow lighter or darker in order, or the image shows no such chart or map.'
    pass_when: { probability_at_most: 0.3 }
    fail_when: { probability_at_least: 0.7 }
    fix: 'Show values that run from low to high with one hue that goes from light to dark, so that the order of the colors follows the order of the values (Wilke, *Fundamentals of Data Visualization*).'
    fixtures:
      positive:
        - fixtures/rainbow-for-ordered-values.positive.png
        - fixtures/rainbow-for-ordered-values--2.positive.png
        - fixtures/rainbow-for-ordered-values--3.positive.png
        - fixtures/rainbow-for-ordered-values--4.positive.png
        - fixtures/rainbow-for-ordered-values--5.positive.png
      negative:
        - fixtures/rainbow-for-ordered-values.negative.png
        - fixtures/rainbow-for-ordered-values--2.negative.png
        - fixtures/rainbow-for-ordered-values--3.negative.png
        - fixtures/rainbow-for-ordered-values--4.negative.png
        - fixtures/rainbow-for-ordered-values--5.negative.png

  - id: color-without-meaning
    title: 'One series is drawn in many colors that encode nothing'
    source: 'Stephen Few, "Common Pitfalls in Dashboard Design" (Perceptual Edge, 2006), pitfall 12; Claus O. Wilke, *Fundamentals of Data Visualization* (O''Reilly, 1st ed. 2019), chapter 19.1.'
    link: https://www.perceptualedge.com/articles/Whitepapers/Common_Pitfalls.pdf
    question:
      type: noul
      instructions: 'In the image at screenshot, are the bars or marks of a single series drawn in many different colors that encode nothing, when one color would show the same data?'
      criteria:
        "true": 'The bars or marks of a single series are drawn in many different colors that encode nothing, and one color would show the same data.'
        "false": 'Each chart uses color only to tell apart series or categories that the legend or labels name, or draws a single series in one color, or the image shows no chart.'
    pass_when: { probability_at_most: 0.3 }
    fail_when: { probability_at_least: 0.7 }
    fix: 'Draw the bars or marks of one series in one color, and keep a second color for the one point that the reader must notice (Few, "Common Pitfalls in Dashboard Design").'
    fixtures:
      positive:
        - fixtures/color-without-meaning.positive.png
        - fixtures/color-without-meaning--2.positive.png
        - fixtures/color-without-meaning--3.positive.png
        - fixtures/color-without-meaning--4.positive.png
        - fixtures/color-without-meaning--5.positive.png
      negative:
        - fixtures/color-without-meaning.negative.png
        - fixtures/color-without-meaning--2.negative.png
        - fixtures/color-without-meaning--3.negative.png
        - fixtures/color-without-meaning--4.negative.png
        - fixtures/color-without-meaning--5.negative.png

  - id: bar-axis-not-at-zero
    title: 'A bar chart value axis starts above zero'
    source: 'Claus O. Wilke, *Fundamentals of Data Visualization* (O''Reilly, 1st ed. 2019), chapter 17.1 "The principle of proportional ink"; Stephen Few, "Common Pitfalls in Dashboard Design" (Perceptual Edge, 2006), pitfall 8; Edward Tufte, *The Visual Display of Quantitative Information* (Graphics Press, 2nd ed. 2001), chapter 2, the Lie Factor, about p. 57, page unchecked, in part.'
    link: https://clauswilke.com/dataviz/
    question:
      type: noul
      instructions: 'In the image at screenshot, does a bar chart''s value axis start above zero, so the bars are cut off at the bottom and the differences between them look larger than they are?'
      criteria:
        "true": 'A bar chart''s value axis starts above zero, so the bars are cut off and the differences between them look larger than they are.'
        "false": 'Every bar chart''s value axis starts at zero, so bar lengths are in proportion to the values, or the image shows no bar chart.'
    pass_when: { probability_at_most: 0.3 }
    fail_when: { probability_at_least: 0.7 }
    fix: 'Start the value axis of the bar chart at zero, so that the bar lengths keep the proportions of the values; to show small differences, use dots or a line on a scale that does not start at zero (Wilke, *Fundamentals of Data Visualization*).'
    fixtures:
      positive:
        - fixtures/bar-axis-not-at-zero.positive.png
        - fixtures/bar-axis-not-at-zero--2.positive.png
        - fixtures/bar-axis-not-at-zero--3.positive.png
        - fixtures/bar-axis-not-at-zero--4.positive.png
        - fixtures/bar-axis-not-at-zero--5.positive.png
      negative:
        - fixtures/bar-axis-not-at-zero.negative.png
        - fixtures/bar-axis-not-at-zero--2.negative.png
        - fixtures/bar-axis-not-at-zero--3.negative.png
        - fixtures/bar-axis-not-at-zero--4.negative.png
        - fixtures/bar-axis-not-at-zero--5.negative.png

  - id: bare-kpi-number
    title: 'A headline number has no unit, period, or comparison'
    source: 'Stephen Few, "Common Pitfalls in Dashboard Design" (Perceptual Edge, 2006), pitfall 2; Edward Tufte, *The Visual Display of Quantitative Information* (Graphics Press, 2nd ed. 2001), chapter 2, about p. 74, page unchecked.'
    link: https://www.perceptualedge.com/articles/Whitepapers/Common_Pitfalls.pdf
    question:
      type: noul
      instructions: 'In the image at screenshot, is a large headline number on a dashboard shown alone, with no unit, no time period, and no comparison such as a change, a target, or an earlier value?'
      criteria:
        "true": 'A large headline number is shown alone, with no unit, no time period, and no comparison such as a change, a target, or an earlier value, so a reader cannot tell whether it is good or bad.'
        "false": 'Every large headline number has a unit or label, a time period, and a comparison such as a change, a target, or an earlier value, or the image shows no headline number.'
    pass_when: { probability_at_most: 0.3 }
    fail_when: { probability_at_least: 0.7 }
    fix: 'Put the unit, the time period, and a comparison, such as the change from the last period or the target, next to each headline number (Few, "Common Pitfalls in Dashboard Design").'
    fixtures:
      positive:
        - fixtures/bare-kpi-number.positive.png
        - fixtures/bare-kpi-number--2.positive.png
        - fixtures/bare-kpi-number--3.positive.png
        - fixtures/bare-kpi-number--4.positive.png
        - fixtures/bare-kpi-number--5.positive.png
      negative:
        - fixtures/bare-kpi-number.negative.png
        - fixtures/bare-kpi-number--2.negative.png
        - fixtures/bare-kpi-number--3.negative.png
        - fixtures/bare-kpi-number--4.negative.png
        - fixtures/bare-kpi-number--5.negative.png
