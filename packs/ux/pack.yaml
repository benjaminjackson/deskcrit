# The first-party ux pack (crit-q25.8, FR-55). It encodes four askable entries in the "UX and
# interaction heuristics" section of GUIDELINES.md. Every question is noul, and true is the defect
# (JC-5). Each question is the pre-screen wording in spike/prescreen/ux/questions.json, unchanged
# except that "colour" is spelled "color".
# Benjamin Jackson kept four checks on 2026-10-25: actions-look-like-plain-text,
# no-current-location-shown, duplicate-adjacent-actions, and required-fields-unmarked. Rule: a UX
# check stays only if coding agents often make that mistake and a screenshot shows it. Three
# pre-screened checks are not encoded: dialog-without-exit, multi-column-form, and
# primary-action-out-of-thumb-reach. GUIDELINES.md records why.
# Sources (FR-45): a criterion cites a source only where its text was checked and states the rule.
# no-current-location-shown and required-fields-unmarked cite NN/g articles. The text of Krug's
# chapter 3 could not be opened, so actions-look-like-plain-text is Common sense, and no source
# states duplicate-adjacent-actions in full, so it is Common sense too. A Common sense criterion has
# a reason and warn_when only. The two cited criteria scored at or above the agreement floor in
# the EV-5 run (crit-q25.13), so they have pass_when and fail_when (EV-5, crit-q25.28).
# Benjamin Jackson approved the four fix hints and the two reason sentences on 2026-10-25 (G-4).
name: ux
version: 0.1.0
title: UX and interaction
license: MIT
criteria:
  - id: actions-look-like-plain-text
    title: 'The main action looks like plain text'
    source: 'Common sense'
    reason: 'A person clicks what looks clickable, so a main action drawn as plain words is easy to miss and leaves the person unsure how to go on.'
    question:
      type: noul
      instructions: 'In the image at screenshot, is the page''s main action, such as a submit, buy, or sign-up control, shown as plain text with no button shape, outline, fill, or link styling, so it looks like ordinary words and not like something to click?'
      criteria:
        "true": 'The main action is shown as plain text with no button shape, outline, fill, or link styling, so it looks like ordinary words and not like something to click.'
        "false": 'The main action looks like something to click, for example a filled or outlined button or a styled link.'
    warn_when: { probability_at_least: 0.7 }
    fix: 'Give the main action the shape of a button, with a fill or a border, or style it as a link with an underline, so that it looks like something to click.'
    fixtures:
      positive:
        - fixtures/actions-look-like-plain-text.positive.png
        - fixtures/actions-look-like-plain-text--2.positive.png
        - fixtures/actions-look-like-plain-text--3.positive.png
        - fixtures/actions-look-like-plain-text--4.positive.png
        - fixtures/actions-look-like-plain-text--5.positive.png
      negative:
        - fixtures/actions-look-like-plain-text.negative.png
        - fixtures/actions-look-like-plain-text--2.negative.png
        - fixtures/actions-look-like-plain-text--3.negative.png
        - fixtures/actions-look-like-plain-text--4.negative.png
        - fixtures/actions-look-like-plain-text--5.negative.png

  - id: no-current-location-shown
    title: 'The navigation menu does not mark the current page'
    source: 'Page Laubheimer, "Menu-Design Checklist: 17 UX Guidelines" (Nielsen Norman Group, 2024), guideline 5 "Indicate the User''s Current Location in the Menu".'
    link: https://www.nngroup.com/articles/menu-design/
    question:
      type: noul
      instructions: 'In the image at screenshot, does the site''s navigation menu look the same for every item, with nothing marking which item is the page the visitor is on now?'
      criteria:
        "true": 'The navigation menu shows every item in the same way, and nothing marks which item is the current page.'
        "false": 'One item in the navigation menu is marked as the current page, for example by a different color, weight, underline, or background, or the page has no navigation menu.'
    pass_when: { probability_at_most: 0.3 }
    fail_when: { probability_at_least: 0.7 }
    fix: 'Mark the current page in the navigation menu with one clear cue, such as a bolder weight, an underline, or a background, so that the person can see where they are (Laubheimer, "Menu-Design Checklist").'
    fixtures:
      positive:
        - fixtures/no-current-location-shown.positive.png
        - fixtures/no-current-location-shown--2.positive.png
        - fixtures/no-current-location-shown--3.positive.png
        - fixtures/no-current-location-shown--4.positive.png
        - fixtures/no-current-location-shown--5.positive.png
      negative:
        - fixtures/no-current-location-shown.negative.png
        - fixtures/no-current-location-shown--2.negative.png
        - fixtures/no-current-location-shown--3.negative.png
        - fixtures/no-current-location-shown--4.negative.png
        - fixtures/no-current-location-shown--5.negative.png

  - id: duplicate-adjacent-actions
    title: 'Two controls side by side do the same thing'
    source: 'Common sense'
    reason: 'Two controls side by side that do the same thing make the person stop to work out whether they differ, and leave them unsure which one to press.'
    question:
      type: noul
      instructions: 'In the image at screenshot, are there two buttons or links next to each other that do the same thing, with labels that mean the same action?'
      criteria:
        "true": 'Two buttons or links sit next to each other and do the same thing, with labels that mean the same action.'
        "false": 'Each button or link next to another one does a different thing, or no two buttons or links sit next to each other.'
    warn_when: { probability_at_least: 0.7 }
    fix: 'Keep one control for the action and remove its twin, or give the second control a different job, such as Cancel or See pricing.'
    fixtures:
      positive:
        - fixtures/duplicate-adjacent-actions.positive.png
        - fixtures/duplicate-adjacent-actions--2.positive.png
        - fixtures/duplicate-adjacent-actions--3.positive.png
        - fixtures/duplicate-adjacent-actions--4.positive.png
        - fixtures/duplicate-adjacent-actions--5.positive.png
      negative:
        - fixtures/duplicate-adjacent-actions.negative.png
        - fixtures/duplicate-adjacent-actions--2.negative.png
        - fixtures/duplicate-adjacent-actions--3.negative.png
        - fixtures/duplicate-adjacent-actions--4.negative.png
        - fixtures/duplicate-adjacent-actions--5.negative.png

  - id: required-fields-unmarked
    title: 'A form does not mark its required fields'
    source: 'Raluca Budiu, "Marking Required Fields in Forms" (Nielsen Norman Group, 2019).'
    link: https://www.nngroup.com/articles/required-fields/
    question:
      type: noul
      instructions: 'In the image at screenshot, does a form show its fields with no mark or word that tells which fields must be filled in and which are optional?'
      criteria:
        "true": 'The form shows its fields with no mark or word, such as an asterisk, the word required, or the word optional, that tells which fields must be filled in or which are optional.'
        "false": 'The form shows a mark or word, such as an asterisk, the word required, or the word optional, that tells which fields must be filled in or which are optional, or the page shows no form.'
    pass_when: { probability_at_most: 0.3 }
    fail_when: { probability_at_least: 0.7 }
    fix: 'Put an asterisk after the label of each required field and explain the asterisk once at the top of the form, or put the word optional after the label of each optional field (Budiu, "Marking Required Fields in Forms").'
    fixtures:
      positive:
        - fixtures/required-fields-unmarked.positive.png
        - fixtures/required-fields-unmarked--2.positive.png
        - fixtures/required-fields-unmarked--3.positive.png
        - fixtures/required-fields-unmarked--4.positive.png
        - fixtures/required-fields-unmarked--5.positive.png
      negative:
        - fixtures/required-fields-unmarked.negative.png
        - fixtures/required-fields-unmarked--2.negative.png
        - fixtures/required-fields-unmarked--3.negative.png
        - fixtures/required-fields-unmarked--4.negative.png
        - fixtures/required-fields-unmarked--5.negative.png
