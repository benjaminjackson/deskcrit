<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>UX fixture: shipping address step</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion required-fields-unmarked. The shipping address step of a
 * checkout for a fictional shop ("Tarn & Thistle"), white page with a gray
 * order summary column.
 * The defect switch only changes display: on hides every asterisk span and
 * the "* Required" legend, so nothing tells required from optional.
 */
body { background: #ffffff; color: #1d2a26; }
.top { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 64px; border-bottom: 1px solid #dde3e0; }
.brand { font-weight: 700; font-size: 19px; color: #1f5a46; }
.steps { font-size: 14px; color: #5b6b65; }
.steps b { color: #1d2a26; }
.layout { display: flex; }
.main { flex: 1; padding: 28px 64px 0; }
.summary { width: 380px; height: 740px; background: #f2f5f3; padding: 32px 36px; font-size: 15px; }
h1 { font-size: 24px; font-weight: 700; }
.legend { display: block; font-size: 13px; color: #4f5f59; margin-top: 8px; }
.field { margin-top: 14px; }
.row { display: flex; gap: 14px; }
.row .field { flex: 1; }
label { display: block; font-size: 14px; font-weight: 700; }
.star { color: #b3261e; margin-left: 2px; }
input { display: block; width: 100%; height: 42px; margin-top: 5px; padding: 0 12px; font-family: var(--font-sans); font-size: 15px; border: 1px solid #9fb0a8; border-radius: 6px; }
button { height: 46px; margin-top: 24px; padding: 0 32px; border: 0; border-radius: 6px; background: #1f5a46; color: #ffffff; font-family: var(--font-sans); font-size: 16px; font-weight: 700; }
.summary h2 { font-size: 17px; font-weight: 700; }
.line { display: flex; justify-content: space-between; margin-top: 16px; color: #36443f; }
.total { border-top: 1px solid #cdd6d2; padding-top: 14px; margin-top: 22px; font-weight: 700; }

[data-defect="on"] .star { display: none; }
[data-defect="on"] .legend { display: none; }
    </style>
  </head>
  <body>
    <header class="top"><span class="brand">Tarn &amp; Thistle</span><span class="steps">Cart &rsaquo; <b>Shipping</b> &rsaquo; Payment</span></header>
    <div class="layout">
      <div class="main">
        <h1>Shipping address</h1>
        <span class="legend">* Required</span>
        <div class="row">
          <div class="field"><label for="c1">First name<span class="star">*</span></label><input id="c1" type="text"></div>
          <div class="field"><label for="c2">Last name<span class="star">*</span></label><input id="c2" type="text"></div>
        </div>
        <div class="field"><label for="c3">Company</label><input id="c3" type="text"></div>
        <div class="field"><label for="c4">Street address<span class="star">*</span></label><input id="c4" type="text"></div>
        <div class="field"><label for="c5">Apartment, suite, etc.</label><input id="c5" type="text"></div>
        <div class="row">
          <div class="field"><label for="c6">City<span class="star">*</span></label><input id="c6" type="text"></div>
          <div class="field"><label for="c7">ZIP code<span class="star">*</span></label><input id="c7" type="text"></div>
        </div>
        <div class="field"><label for="c8">Phone for delivery updates</label><input id="c8" type="text"></div>
        <button type="button">Continue to payment</button>
      </div>
      <div class="summary">
        <h2>Order summary</h2>
        <div class="line"><span>Linen throw, moss</span><span>$64.00</span></div>
        <div class="line"><span>Stoneware mug, set of 2</span><span>$38.00</span></div>
        <div class="line total"><span>Subtotal</span><span>$102.00</span></div>
      </div>
    </div>
  </body>
</html>
