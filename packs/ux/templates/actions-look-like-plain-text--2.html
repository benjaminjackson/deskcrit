<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>UX fixture: product page</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion actions-look-like-plain-text. A product page for an invented lamp with a price, short description, and an Add to cart action.
 * The defect switch only changes the one main action's own look: on turns it into plain
 * body text (no fill, no border, no padding, no radius, no shadow, no underline, body color
 * and weight); off leaves an outlined dark button. Same element, text, and size on both sides.
 */
body { background: #faf6ef; color: #2b2622; font-family: "Source Serif 4"; }
.top { display: flex; justify-content: space-between; align-items: center; height: 72px; padding: 0 64px; border-bottom: 1px solid #e3d9c8; }
.brand { font-size: 24px; font-weight: 700; letter-spacing: 0.02em; }
nav { display: flex; gap: 30px; font-size: 16px; }
a { color: #8a3b12; text-decoration: underline; }
main { display: flex; gap: 72px; padding: 48px 64px 0; }
.art { width: 520px; height: 520px; background: #ecdfc8; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
.copy { flex: 1; }
h1 { font-size: 40px; font-weight: 700; line-height: 1.15; }
.price { font-size: 28px; margin-top: 12px; }
.desc { font-size: 18px; line-height: 1.6; margin-top: 20px; color: #4a423a; }
.facts { margin-top: 18px; font-size: 16px; color: #4a423a; line-height: 1.7; }
.act { margin-top: 32px; height: 52px; display: flex; align-items: center; }
.cart { font-family: "Source Serif 4"; font-size: 18px; line-height: 1.6; font-weight: 700; color: #2b2622; background-color: transparent; border: 2px solid #2b2622; border-radius: 0; padding: 10px 36px; cursor: pointer; }
footer { position: absolute; left: 64px; bottom: 28px; font-size: 14px; display: flex; gap: 24px; }
[data-defect="on"] .cart { border: 0; padding: 0; font-weight: 400; }
    </style>
  </head>
  <body>
    <header class="top"><span class="brand">Larkspur Lighting</span><nav><a href="#">Lamps</a><a href="#">Shades</a><a href="#">Bulbs</a><a href="#">Journal</a></nav></header>
    <main>
      <div class="art"><svg width="220" height="300" viewBox="0 0 220 300"><path d="M50 40 H170 L200 150 H20 Z" fill="#c9a979"/><rect x="104" y="150" width="12" height="110" fill="#6b5a45"/><ellipse cx="110" cy="272" rx="52" ry="12" fill="#6b5a45"/></svg></div>
      <section class="copy">
        <h1>Tallow table lamp</h1>
        <p class="price">$84.00</p>
        <p class="desc">A hand-turned ash base with a linen shade, made for reading chairs and bedside tables. Warm light, no glare.</p>
        <p class="facts">Height 16 in. Ships in three days. Bulb not included.</p>
        <div class="act"><button type="button" class="cart">Add to cart</button></div>
      </section>
    </main>
    <footer><a href="#">Shipping</a><a href="#">Returns</a><a href="#">Contact</a></footer>
  </body>
</html>
