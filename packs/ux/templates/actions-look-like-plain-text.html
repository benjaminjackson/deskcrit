<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>UX fixture: contact form</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion actions-look-like-plain-text. A contact page for an invented studio with a name, email, and message form and a Send message action.
 * The defect switch only changes the one main action's own look: on turns it into plain
 * body text (no fill, no border, no padding, no radius, no shadow, no underline, body color
 * and weight); off leaves a filled blue button. Same element, text, and size on both sides.
 */
body { background: #f4f6f8; color: #1f2328; }
.top { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 56px; background: #ffffff; border-bottom: 1px solid #dde2e7; }
.brand { font-weight: 700; font-size: 20px; }
nav { display: flex; gap: 28px; font-size: 15px; }
a { color: #0b5cad; text-decoration: underline; }
main { display: flex; gap: 72px; padding: 56px 56px 0; }
.info { width: 380px; }
h1 { font-size: 36px; font-weight: 700; line-height: 1.2; }
.info p { margin-top: 16px; color: #3d444c; }
form { flex: 1; max-width: 560px; background: #ffffff; border: 1px solid #dde2e7; border-radius: 10px; padding: 32px; }
label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.field { border: 1px solid #aeb6bf; border-radius: 6px; height: 44px; margin-bottom: 20px; background: #ffffff; }
.field.tall { height: 120px; }
.act { height: 48px; display: flex; align-items: center; }
.send { font-family: "Inter"; font-size: 16px; line-height: 1.5; font-weight: 700; color: #ffffff; background-color: #0b5cad; border: 1px solid #0b5cad; border-radius: 6px; padding: 10px 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); cursor: pointer; }
footer { position: absolute; left: 56px; bottom: 28px; font-size: 14px; color: #59636e; display: flex; gap: 24px; }
[data-defect="on"] .send { color: #1f2328; background-color: transparent; border: 0; border-radius: 0; padding: 0; box-shadow: none; font-weight: 400; }
    </style>
  </head>
  <body>
    <header class="top"><span class="brand">Fernwick Studio</span><nav><a href="#">Work</a><a href="#">Services</a><a href="#">About</a><a href="#">Contact</a></nav></header>
    <main>
      <section class="info"><h1>Tell us about your project</h1><p>We read every message and reply within two working days. Include a budget range and a rough timeline if you have them.</p></section>
      <form>
        <label>Your name</label><div class="field"></div>
        <label>Email address</label><div class="field"></div>
        <label>Message</label><div class="field tall"></div>
        <div class="act"><button type="button" class="send">Send message</button></div>
      </form>
    </main>
    <footer><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Careers</a></footer>
  </body>
</html>
