<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>UX fixture: checkout summary</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion actions-look-like-plain-text. A checkout summary for an invented grocery box with line items, totals, and a Place order action.
 * The defect switch only changes the one main action's own look: on turns it into plain
 * body text (no fill, no border, no padding, no radius, no shadow, no underline, body color
 * and weight); off leaves a filled green button. Same element, text, and size on both sides.
 */
body { background: #ffffff; color: #1c2a24; }
.top { display: flex; justify-content: space-between; align-items: center; height: 60px; padding: 0 80px; border-bottom: 1px solid #d5ded9; }
.brand { font-size: 19px; font-weight: 700; color: #1f6b4a; }
.secure { font-size: 14px; color: #4a5a52; }
main { width: 640px; margin: 36px auto 0; }
h1 { font-size: 30px; font-weight: 700; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 16px; }
td { padding: 12px 0; border-bottom: 1px solid #e3e9e6; }
td.n { text-align: right; }
tr.total td { font-weight: 700; font-size: 18px; border-bottom: 0; padding-top: 18px; }
.addr { margin-top: 18px; font-size: 15px; color: #3d4c44; line-height: 1.6; }
.act { margin-top: 24px; height: 52px; display: flex; align-items: center; justify-content: flex-end; }
.place { font-family: "Inter"; font-size: 17px; line-height: 1.5; font-weight: 700; color: #ffffff; background-color: #1f6b4a; border: 0; border-radius: 4px; padding: 12px 32px; cursor: pointer; }
a { color: #1f6b4a; text-decoration: underline; }
footer { position: absolute; left: 80px; bottom: 28px; font-size: 14px; display: flex; gap: 24px; }
[data-defect="on"] .place { color: #1c2a24; background-color: transparent; border-radius: 0; padding: 0; font-weight: 400; }
    </style>
  </head>
  <body>
    <header class="top"><span class="brand">Orchard Row Boxes</span><span class="secure">Checkout, step 3 of 3</span></header>
    <main>
      <h1>Review your order</h1>
      <table>
        <tr><td>Weekly vegetable box, medium</td><td class="n">$32.00</td></tr>
        <tr><td>Fruit add-on</td><td class="n">$9.50</td></tr>
        <tr><td>Delivery</td><td class="n">$4.00</td></tr>
        <tr class="total"><td>Total</td><td class="n">$45.50</td></tr>
      </table>
      <p class="addr">Delivery on Thursday between 8 and 12. Paying with the card ending in 4242. <a href="#">Edit details</a></p>
      <div class="act"><button type="button" class="place">Place order</button></div>
    </main>
    <footer><a href="#">Help</a><a href="#">Refunds</a><a href="#">Terms</a></footer>
  </body>
</html>
