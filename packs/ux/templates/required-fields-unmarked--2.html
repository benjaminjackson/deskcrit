<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>UX fixture: job application form</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion required-fields-unmarked. A job application form for a
 * fictional studio ("Harrowgate Press"), serif headings on a cream page,
 * two columns: role details on the left, the form on the right.
 * The defect switch only changes display: on hides every "(optional)" tag
 * span after the optional labels, so nothing tells optional from required.
 */
body { background: #f8f3e8; color: #2b2118; font-family: var(--font-sans); }
.wrap { display: flex; gap: 72px; padding: 56px 88px 0; }
aside { width: 340px; }
aside .kicker { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #8a5a2b; font-weight: 700; }
h1 { font-family: "Source Serif 4"; font-size: 38px; line-height: 1.15; font-weight: 700; margin-top: 10px; }
aside p { font-size: 16px; line-height: 1.55; margin-top: 16px; color: #4a3d30; }
form { flex: 1; }
.field { margin-bottom: 16px; }
label { display: block; font-size: 14px; font-weight: 700; }
.opt { font-weight: 400; color: #6b5a48; margin-left: 4px; }
input, textarea { display: block; width: 100%; margin-top: 5px; padding: 0 12px; font-family: var(--font-sans); font-size: 15px; border: 1px solid #b9a88f; border-radius: 3px; background: #fffdf8; }
input { height: 40px; }
textarea { height: 104px; padding-top: 10px; resize: none; }
.pair { display: flex; gap: 16px; }
.pair .field { flex: 1; }
button { height: 44px; padding: 0 28px; border: 0; border-radius: 3px; background: #8a3b12; color: #ffffff; font-family: var(--font-sans); font-size: 15px; font-weight: 700; }

[data-defect="on"] .opt { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <aside>
        <div class="kicker">Open role</div>
        <h1>Production Editor</h1>
        <p>Harrowgate Press is hiring an editor to guide books from manuscript to print. The role is based in our Dunmore office.</p>
      </aside>
      <form>
        <div class="pair">
          <div class="field"><label for="b1">First name</label><input id="b1" type="text"></div>
          <div class="field"><label for="b2">Last name</label><input id="b2" type="text"></div>
        </div>
        <div class="field"><label for="b3">Email address</label><input id="b3" type="text"></div>
        <div class="stack">
          <div class="field"><label for="b4">Phone<span class="opt">(optional)</span></label><input id="b4" type="text"></div>
          <div class="field"><label for="b5">Portfolio link<span class="opt">(optional)</span></label><input id="b5" type="text"></div>
        </div>
        <div class="field"><label for="b6">Current employer</label><input id="b6" type="text"></div>
        <div class="field"><label for="b7">Why this role?<span class="opt">(optional)</span></label><textarea id="b7"></textarea></div>
        <button type="button">Submit application</button>
      </form>
    </div>
  </body>
</html>
