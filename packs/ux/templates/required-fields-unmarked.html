<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>UX fixture: sign-up form</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion required-fields-unmarked. A sign-up form for a note-taking app
 * ("Quillnest"), centered card on a pale blue page, with required fields
 * and optional fields mixed.
 * The defect switch only changes display: on hides every asterisk span and
 * the "* Required field" legend, so nothing tells required from optional.
 */
body { background: #eef3fb; }
.top { height: 64px; display: flex; align-items: center; padding: 0 56px; font-weight: 700; font-size: 20px; color: #2a4b9b; }
main { display: flex; justify-content: center; padding-top: 14px; }
.card { width: 480px; background: #ffffff; border-radius: 12px; padding: 32px 36px 34px; box-shadow: 0 2px 10px rgba(30, 50, 100, 0.12); }
h1 { font-size: 26px; font-weight: 700; color: #16233f; }
.lead { font-size: 15px; color: #4a5670; margin-top: 6px; }
.legend { display: block; font-size: 13px; color: #4a5670; margin-top: 14px; }
.field { margin-top: 16px; }
.pair { display: flex; gap: 14px; }
.pair .field { flex: 1; }
label { display: block; font-size: 14px; font-weight: 700; color: #16233f; }
.star { color: #b3261e; margin-left: 2px; }
input, select { display: block; width: 100%; height: 42px; margin-top: 6px; padding: 0 12px; font-family: var(--font-sans); font-size: 15px; border: 1px solid #aab4c8; border-radius: 6px; background: #ffffff; }
button { display: block; width: 100%; height: 46px; margin-top: 26px; border: 0; border-radius: 6px; background: #2a4b9b; color: #ffffff; font-family: var(--font-sans); font-size: 16px; font-weight: 700; }
.fine { font-size: 13px; color: #5a6680; margin-top: 14px; text-align: center; }

[data-defect="on"] .star { display: none; }
[data-defect="on"] .legend { display: none; }
    </style>
  </head>
  <body>
    <header class="top">Quillnest</header>
    <main>
      <form class="card">
        <h1>Create your account</h1>
        <p class="lead">Start a free workspace for your notes.</p>
        <span class="legend">* Required field</span>
        <div class="pair">
          <div class="field"><label for="a1">First name<span class="star">*</span></label><input id="a1" type="text"></div>
          <div class="field"><label for="a2">Last name<span class="star">*</span></label><input id="a2" type="text"></div>
        </div>
        <div class="field"><label for="a3">Email address<span class="star">*</span></label><input id="a3" type="text"></div>
        <div class="field"><label for="a4">Password<span class="star">*</span></label><input id="a4" type="password"></div>
        <div class="field"><label for="a5">Workspace name</label><input id="a5" type="text"></div>
        <div class="field"><label for="a6">How did you hear about us?</label><select id="a6"><option></option><option>Search</option><option>A friend</option><option>Other</option></select></div>
        <button type="button">Create account</button>
        <p class="fine">Already have an account? Sign in</p>
      </form>
    </main>
  </body>
</html>
