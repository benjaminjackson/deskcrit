<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>UX fixture: club registration form</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion required-fields-unmarked. A registration form for a fictional
 * community running club ("Millrace Striders") fun run, green banner on
 * the left and a form on the right.
 * The defect switch only changes display: on hides every asterisk span and
 * the "* Required" legend, so nothing tells required from optional.
 */
body { background: #fbfaf4; color: #22301f; }
.layout { display: flex; height: 800px; }
.banner { width: 400px; background: #2f6b32; color: #f4f8ee; padding: 64px 44px; }
.banner .club { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #c8e3b4; }
.banner h1 { font-family: "Source Serif 4"; font-size: 40px; line-height: 1.12; font-weight: 700; margin-top: 14px; }
.banner p { font-size: 16px; line-height: 1.55; margin-top: 18px; color: #e4eed8; }
form { flex: 1; padding: 40px 72px 0 64px; }
h2 { font-size: 22px; font-weight: 700; }
.legend { display: block; font-size: 13px; color: #4b5c47; margin-top: 6px; }
.field { margin-top: 15px; }
.pair { display: flex; gap: 16px; }
.pair .field { flex: 1; }
label { display: block; font-size: 14px; font-weight: 700; }
.star { color: #a8340f; margin-left: 2px; }
input, select { display: block; width: 100%; height: 40px; margin-top: 5px; padding: 0 12px; font-family: var(--font-sans); font-size: 15px; border: 1px solid #98a893; border-radius: 4px; background: #ffffff; }
button { height: 44px; margin-top: 24px; padding: 0 30px; border: 0; border-radius: 22px; background: #2f6b32; color: #ffffff; font-family: var(--font-sans); font-size: 15px; font-weight: 700; }

[data-defect="on"] .star { display: none; }
[data-defect="on"] .legend { display: none; }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="banner">
        <div class="club">Millrace Striders</div>
        <h1>Riverside Fun Run</h1>
        <p>A relaxed 5 km loop along the canal on the first Saturday of May. All paces are welcome.</p>
      </div>
      <form>
        <h2>Register for the run</h2>
        <span class="legend">* Required field</span>
        <div class="pair">
          <div class="field"><label for="e1">First name<span class="star">*</span></label><input id="e1" type="text"></div>
          <div class="field"><label for="e2">Last name<span class="star">*</span></label><input id="e2" type="text"></div>
        </div>
        <div class="field"><label for="e3">Email address<span class="star">*</span></label><input id="e3" type="text"></div>
        <div class="pair">
          <div class="field"><label for="e4">Age group<span class="star">*</span></label><select id="e4"><option></option><option>Under 18</option><option>18 to 39</option><option>40 and over</option></select></div>
          <div class="field"><label for="e5">T-shirt size</label><select id="e5"><option></option><option>S</option><option>M</option><option>L</option></select></div>
        </div>
        <div class="field"><label for="e6">Running club or team</label><input id="e6" type="text"></div>
        <div class="field"><label for="e7">Emergency contact phone<span class="star">*</span></label><input id="e7" type="text"></div>
        <button type="button">Register</button>
      </form>
    </div>
  </body>
</html>
