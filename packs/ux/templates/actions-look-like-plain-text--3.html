<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>UX fixture: newsletter sign-up hero</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion actions-look-like-plain-text. A dark hero for an invented weekly newsletter with an email field and a Subscribe action.
 * The defect switch only changes the one main action's own look: on turns it into plain
 * body text (no fill, no border, no padding, no radius, no shadow, no underline, body color
 * and weight); off leaves a filled yellow button. Same element, text, and size on both sides.
 */
body { background: #14213d; color: #e8ecf4; }
.top { display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 64px; }
.brand { font-size: 20px; font-weight: 700; }
nav { display: flex; gap: 28px; font-size: 15px; }
a { color: #ffd166; text-decoration: underline; }
main { width: 760px; margin: 120px auto 0; text-align: center; }
h1 { font-size: 56px; font-weight: 700; line-height: 1.1; }
.lede { font-size: 20px; line-height: 1.5; margin-top: 20px; color: #c3cbdc; }
.row { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 40px; }
.email { width: 360px; height: 52px; background: #ffffff; border-radius: 8px; }
.act { height: 52px; display: flex; align-items: center; }
.sub { font-family: "Inter"; font-size: 18px; line-height: 1.5; font-weight: 700; color: #14213d; background-color: #ffd166; border: 0; border-radius: 8px; padding: 12px 28px; cursor: pointer; }
.note { font-size: 14px; margin-top: 16px; color: #9aa6bf; }
footer { position: absolute; left: 0; right: 0; bottom: 28px; font-size: 14px; display: flex; justify-content: center; gap: 24px; }
[data-defect="on"] .sub { color: #e8ecf4; background-color: transparent; border-radius: 0; padding: 0; font-weight: 400; }
    </style>
  </head>
  <body>
    <header class="top"><span class="brand">The Tidewatch</span><nav><a href="#">Archive</a><a href="#">About</a><a href="#">Sponsors</a></nav></header>
    <main>
      <h1>One good read on the sea, every Friday</h1>
      <p class="lede">Short field notes on tides, weather, and small boats, written by people who work on the water.</p>
      <div class="row"><div class="email"></div><div class="act"><button type="button" class="sub">Subscribe</button></div></div>
      <p class="note">Free. Unsubscribe at any time.</p>
    </main>
    <footer><a href="#">Privacy</a><a href="#">Contact</a><a href="#">RSS</a></footer>
  </body>
</html>
