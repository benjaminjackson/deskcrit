<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>UX fixture: support request form</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion required-fields-unmarked. A support request form for a fictional
 * hosting product ("Brightfold Cloud"), dark slate page with a single
 * wide form panel.
 * The defect switch only changes display: on hides every "(optional)" tag
 * span after the optional labels, so nothing tells optional from required.
 */
body { background: #14181f; color: #e6e9ef; }
.top { height: 60px; display: flex; align-items: center; gap: 36px; padding: 0 56px; border-bottom: 1px solid #28303c; font-size: 15px; color: #a3adbd; }
.brand { font-weight: 700; font-size: 18px; color: #7fd1c3; }
main { width: 720px; margin: 0 auto; padding-top: 24px; }
h1 { font-size: 28px; font-weight: 300; }
.lead { font-size: 15px; color: #a3adbd; margin-top: 6px; }
.field { margin-top: 12px; }
.pair { display: flex; gap: 16px; }
.pair .field { flex: 1; }
label { display: block; font-size: 14px; font-weight: 700; color: #e6e9ef; }
.opt { font-weight: 400; color: #a3adbd; margin-left: 6px; }
input, select, textarea { display: block; width: 100%; margin-top: 6px; padding: 0 12px; font-family: var(--font-sans); font-size: 15px; color: #e6e9ef; background: #1d232d; border: 1px solid #7a8697; border-radius: 4px; }
input, select { height: 42px; }
textarea { height: 96px; padding-top: 10px; resize: none; }
button { height: 44px; margin-top: 22px; padding: 0 30px; border: 0; border-radius: 4px; background: #7fd1c3; color: #0e1a18; font-family: var(--font-sans); font-size: 15px; font-weight: 700; }

[data-defect="on"] .opt { display: none; }
    </style>
  </head>
  <body>
    <header class="top"><span class="brand">Brightfold Cloud</span><span>Docs</span><span>Status</span><span>Support</span></header>
    <main>
      <form>
        <h1>Contact support</h1>
        <p class="lead">Tell us what is happening and we will reply by email.</p>
        <div class="stack">
          <div class="field"><label for="d1">Email address</label><input id="d1" type="text"></div>
          <div class="field"><label for="d2">Topic</label><select id="d2"><option>Billing</option><option>Deployments</option><option>Domains</option></select></div>
        </div>
        <div class="field"><label for="d4">What happened?</label><textarea id="d4"></textarea></div>
        <div class="stack">
          <div class="field"><label for="d5">Project ID<span class="opt">(optional)</span></label><input id="d5" type="text"></div>
          <div class="field"><label for="d6">Link to the failing page<span class="opt">(optional)</span></label><input id="d6" type="text"></div>
        </div>
        <button type="button">Send request</button>
      </form>
    </main>
  </body>
</html>
