<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>UX fixture: settings page tabs</title>
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion no-current-location-shown. A settings page for an invented
 * photo-printing service, with horizontal tabs and a Notifications tab.
 * The defect switch only changes the font weight of the current tab
 * (Notifications): on makes it regular weight like its siblings, so nothing
 * marks it. Off shows it in bold. Every tab has a fixed width, so no tab
 * moves.
 */
body { background: #eef1f4; color: #222a33; font-family: var(--font-sans); }
.wrap { width: 840px; margin: 48px auto 0; }
h1 { font-size: 30px; font-weight: 700; }
.tabs { display: flex; margin-top: 22px; border-bottom: 1px solid #cdd3da; }
.tabs a { width: 140px; padding: 12px 0; text-align: center; font-size: 15px; font-weight: 400; color: #46515e; text-decoration: none; }
.tabs a.current { font-weight: 700; }
[data-defect="on"] .tabs a.current { font-weight: 400; }
.panel { background: #ffffff; border: 1px solid #cdd3da; border-top: 0; padding: 28px 32px 32px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid #e6e9ed; }
.row:last-child { border-bottom: 0; }
.row b { display: block; font-size: 16px; font-weight: 400; }
.row small { display: block; margin-top: 4px; font-size: 13px; color: #5c6773; }
.switch { width: 40px; height: 22px; border-radius: 11px; background: #cdd3da; position: relative; }
.switch.is-on { background: #1f7a6d; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 8px; background: #ffffff; }
.switch.is-on::after { left: 21px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Notifications</h1>
      <div class="tabs">
        <a href="#">Profile</a>
        <a href="#">Security</a>
        <a class="current" href="#">Notifications</a>
        <a href="#">Billing</a>
        <a href="#">Team</a>
      </div>
      <div class="panel">
        <div class="row"><div><b>Order updates</b><small>Tell me when a print order ships</small></div><div class="switch is-on"></div></div>
        <div class="row"><div><b>Reminders</b><small>Remind me about unfinished albums</small></div><div class="switch is-on"></div></div>
        <div class="row"><div><b>Offers</b><small>Occasional discounts and new products</small></div><div class="switch"></div></div>
        <div class="row"><div><b>Product news</b><small>A short note when we add features</small></div><div class="switch"></div></div>
      </div>
    </div>
  </body>
</html>
