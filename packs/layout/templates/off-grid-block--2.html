<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: off-grid-block--2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A weekly planner: a full-width header bar (x=80 to 1200) over three columns of cards at x=80, 460 and 840 (360 px wide, 20 px apart). In the second row a double-width card spans columns 1 and 2 (x=80 to 820). The defect moves it to x=250 to 610, which no other block uses. (OQ-17) */
      body { background: #f3f5f8; }
      .head { position: absolute; left: 80px; top: 36px; width: 1120px; height: 64px; background: #dfe5ee; padding: 0 24px; display: flex; align-items: center; font-size: 28px; font-weight: 700; }
      .card { position: absolute; width: 360px; height: 150px; padding: 22px 26px; background: #fff; border: 2px solid #1f4e79; border-top-width: 10px; }
      .card h2 { font-size: 22px; margin-bottom: 6px; }
      .c1 { left: 80px; } .c2 { left: 460px; } .c3 { left: 840px; }
      .wide { left: 80px; width: 740px; }
      [data-defect="on"] .wide { left: 250px; width: 360px; }
    </style>
  </head>
  <body>
    <div class="head">Studio week</div>
    <div class="card c1" style="top:130px"><h2>Monday</h2><p>Brief and kickoff.</p></div>
    <div class="card c2" style="top:130px"><h2>Tuesday</h2><p>Sketches on paper.</p></div>
    <div class="card c3" style="top:130px"><h2>Wednesday</h2><p>Client call.</p></div>
    <div class="card wide" style="top:310px"><h2>Thursday</h2><p>Build the first screens.</p></div>
    <div class="card c3" style="top:310px"><h2>Friday</h2><p>Review and ship.</p></div>
    <div class="card c1" style="top:490px"><h2>Notes</h2><p>Open questions.</p></div>
    <div class="card c2" style="top:490px"><h2>Files</h2><p>Shared folder.</p></div>
    <div class="card c3" style="top:490px"><h2>People</h2><p>Who to ask.</p></div>
  </body>
</html>
