<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: crowded-unrelated-elements</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion crowded-unrelated-elements. A sparse page: a heading, a bordered picture or chart, and a block that belongs to another section.
 * Off: the block sits 64 px from the picture or chart. The defect leaves it 1 px from the edge, touching it, with the rest of the page left roomy. (OQ-17)
 */
body { background: #ffffff; color: #2b2118; }
h1 { font-size: 32px; line-height: 40px; font-weight: 700; margin: 52px 0 0 120px; }
.wrap { display: flex; flex-direction: row; align-items: stretch; margin: 44px 0 0 120px; width: fit-content; --gap: 64px; }
.box { display: block; flex: none; border: 3px solid #59636e; background: #f3ead7; }
.art svg { display: block; }
.next { width: 340px; flex: none; border: 3px solid #7a4e2d; background: #fffaf0; padding: 22px 24px; }
.next h2 { font-size: 22px; line-height: 28px; font-weight: 700; margin-bottom: 8px; }
.next p { font-size: 18px; line-height: 27px; }
.btn { display: inline-block; flex: none; background: #7a4e2d; color: #ffffff; font-size: 19px; font-weight: 700; padding: 14px 30px; border-radius: 6px; }
.next, .btn { margin: 0; }
.wrap { gap: var(--gap); }
[data-defect="on"] .wrap { --gap: 1px; }
    </style>
  </head>
  <body>
    <h1>Seed sales by month</h1>
    <main class="wrap">
      <svg class="box" width="520" height="360" viewBox="0 0 520 360" role="img" aria-label="Seed sales by month"><rect width="520" height="360" fill="#f3ead7"/><rect x="60" y="150" width="90" height="170" fill="#7a4e2d"/><rect x="190" y="70" width="90" height="250" fill="#7a4e2d"/><rect x="320" y="200" width="90" height="120" fill="#7a4e2d"/><line x1="30" y1="320" x2="490" y2="320" stroke="#59636e" stroke-width="2"/></svg>
      <div class="next"><h2>Returns and exchanges</h2><p>Unopened packets can be returned within thirty days with the receipt. Opened packets can be exchanged for another variety at the shop counter.</p></div>
    </main>
  </body>
</html>
