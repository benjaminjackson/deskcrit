<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: crowded-unrelated-elements--3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A sign-up form followed by small legal text. Off: the legal text has a clear gap below the
         button. On: the legal text is pressed right against the button's bottom edge. */
      main { width: 560px; margin: 56px 0 0 120px; }
      h1 { font-size: 34px; margin-bottom: 8px; }
      .lead { color: var(--color-muted); font-size: 18px; margin-bottom: 28px; }
      .field { margin-bottom: 16px; }
      .field label { display: block; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
      .field .box { height: 44px; border: 1px solid var(--color-border); border-radius: 6px; }
      .button { display: block; margin-top: 24px; background: #0b5cad; color: #fff; text-align: center; font-weight: 700; font-size: 18px; padding: 13px 0; border-radius: 6px; }
      .legal { font-size: 16px; color: var(--color-muted); margin-top: 48px; }
      [data-defect="on"] .legal { margin-top: -2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Create a rota account</h1>
      <p class="lead">Swap shifts with the other volunteers in two taps.</p>
      <div class="field"><label>Full name</label><div class="box"></div></div>
      <div class="field"><label>Email address</label><div class="box"></div></div>
      <div class="field"><label>Password</label><div class="box"></div></div>
      <span class="button">Create account</span>
      <p class="legal">The volunteer office is open Monday to Friday, nine to five.</p>
    </main>
  </body>
</html>
