<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: near-miss-alignment--2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A row of three equal bordered cards that share one top edge. On the off side the right card sits 100 px lower, a clear break. The defect makes that drop only 14 px, so the top edge almost lines up but misses. Nothing else changes (OQ-17). */
      body { background: #f5f2ff; }
      main { margin: 110px 0 0 100px; width: 1080px; }
      h1 { font-size: 36px; font-weight: 700; color: #3b2a7a; margin-bottom: 40px; }
      .row { display: flex; gap: 36px; align-items: flex-start; }
      .card { width: 336px; height: 280px; background: #fff; border: 3px solid #4a3b8c; border-radius: 0; padding: 28px; }
      .card h2 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
      .card p { font-size: 18px; color: var(--color-muted); }
      .right { margin-top: 100px; }
      [data-defect="on"] .right { margin-top: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Three ways to join the choir</h1>
      <div class="row">
        <div class="card"><h2>Weekly rehearsal</h2><p>Meet on Tuesday evenings and learn a new part each month.</p></div>
        <div class="card"><h2>Weekend course</h2><p>Spend two days on breathing, tuning, and sight reading.</p></div>
        <div class="card right"><h2>Open sing</h2><p>Drop in once a quarter and sing from sheets we hand out.</p></div>
      </div>
    </main>
  </body>
</html>
