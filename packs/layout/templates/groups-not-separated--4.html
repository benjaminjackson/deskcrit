<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: groups-not-separated--4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A dark schedule: three days of three outlined session cards. Off: cards 6 px apart, days 52 px apart.
         On: every gap is 12 px (OQ-17). */
      body { background: #111827; color: #f3f4f6; }
      main { margin: 28px 0 0 120px; width: 640px; }
      .s { height: 46px; line-height: 42px; border: 2px solid #6b7280; padding: 0 16px; margin-bottom: 6px; font-size: 17px; }
      .s.day { border-color: #fbbf24; color: #fbbf24; font-weight: 700; }
      .s.end { margin-bottom: 52px; }
      .s.last { margin-bottom: 0; }
      [data-defect="on"] .s, [data-defect="on"] .s.end { margin-bottom: 12px; }
      [data-defect="on"] .s.last { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="s day">Thursday</div><div class="s">09:00 Keynote</div><div class="s">10:30 Lightning talks</div><div class="s end">13:00 Workshops</div>
      <div class="s day">Friday</div><div class="s">09:00 Panel</div><div class="s">11:00 Demos</div><div class="s end">14:00 Roundtable</div>
      <div class="s day">Saturday</div><div class="s">10:00 Hack hour</div><div class="s">12:00 Lunch</div><div class="s last">15:00 Closing</div>
    </main>
  </body>
</html>
