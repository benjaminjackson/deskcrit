<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: groups-not-separated</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Three groups of three rows. Inside a group the rows are 6 px apart and the groups are 48 px
         apart. The defect sets every gap to exactly the same 18 px, so the groups run together (OQ-17). */
      main { margin: 56px 0 0 96px; width: 560px; }
      h1 { font-size: 28px; font-weight: 700; margin-bottom: 32px; }
      .group { margin-bottom: 48px; }
      .row { font-size: 18px; margin-bottom: 6px; }
      .row:last-child { margin-bottom: 0; }
      .lead { font-weight: 700; }
      [data-defect="on"] .group { margin-bottom: 18px; }
      [data-defect="on"] .row { margin-bottom: 18px; }
      [data-defect="on"] .row:last-child { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Library opening hours</h1>
      <div class="group"><div class="row lead">Main branch</div><div class="row">Monday to Friday, nine to eight</div><div class="row">Saturday, ten to four</div></div>
      <div class="group"><div class="row lead">Harbour branch</div><div class="row">Tuesday to Friday, ten to six</div><div class="row">Saturday, ten to two</div></div>
      <div class="group"><div class="row lead">Mobile library</div><div class="row">Wednesday at the market square</div><div class="row">Thursday at the school gates</div></div>
    </main>
  </body>
</html>
