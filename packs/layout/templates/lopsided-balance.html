<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: lopsided-balance</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A bookshop event page. The content sits in one column 600 px wide: a dark author photo, the event title, two lines of text, and a dark booking button. Without the defect the column is centred on the page (left 340 px). The defect pins the column to the left margin (left 48 px), as when a container loses its auto margins, so the dark photo and button sit on the left and the right half of the page is empty. (OQ-17) */
      header { position: absolute; left: 0; top: 0; width: 1280px; height: 60px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e4e0da; }
      header b { font-size: 19px; color: #26221e; }
      header span { font-size: 14px; color: var(--color-muted); margin-left: 26px; }
      .column { position: absolute; left: 340px; top: 92px; width: 600px; }
      .photo { height: 330px; border-radius: 6px; background: linear-gradient(160deg, #3b3530 0%, #1d1a17 55%, #120f0d 100%); position: relative; }
      .photo i { position: absolute; left: 230px; top: 70px; width: 140px; height: 140px; border-radius: 50%; background: #5b5048; }
      .photo u { position: absolute; left: 180px; top: 220px; width: 240px; height: 110px; border-radius: 120px 120px 0 0; background: #4a4039; }
      .date { font-size: 14px; font-weight: 700; color: #8a4b2a; margin: 22px 0 6px; }
      h1 { font-size: 34px; line-height: 1.15; color: #26221e; margin-bottom: 10px; }
      p { font-size: 16px; line-height: 1.5; color: #4a443e; margin-bottom: 18px; }
      .book { display: inline-block; background: #26221e; color: #fff; font-weight: 700; font-size: 15px; padding: 12px 22px; border-radius: 4px; }
      [data-defect="on"] .column { left: 48px; }
    </style>
  </head>
  <body>
    <header><b>Margin Books</b><nav><span>Events</span><span>New in</span><span>Gift cards</span><span>Find us</span></nav></header>
    <div class="column">
      <div class="photo"><i></i><u></u></div>
      <div class="date">Thursday 13 November, 7 pm</div>
      <h1>An evening with Ines Varga on her new novel, The Salt Year</h1>
      <p>A reading, a short talk about the island where the book is set, and questions from the floor. Wine and soft drinks from 6.30 pm.</p>
      <a class="book">Book a free seat</a>
    </div>
  </body>
</html>
