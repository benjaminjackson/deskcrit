<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: lopsided-balance</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A two-column page: a dark picture block on the left and a heading, text, and button on the
         right as a counterweight. The defect stacks the text under the dark block on the left half
         and leaves the right half empty (OQ-17). */
      main { display: flex; gap: 48px; margin: 40px 80px 0; }
      .art { width: 520px; height: 400px; border-radius: 12px; background: linear-gradient(160deg, #1f2328 0%, #3d4a5c 100%); flex-shrink: 0; }
      .text { width: 520px; padding-top: 100px; }
      h1 { font-size: 46px; font-weight: 700; line-height: 1.15; margin-bottom: 24px; }
      p { font-size: 20px; margin-bottom: 32px; }
      .button { display: inline-block; background: #1f2328; color: #fff; font-weight: 700; font-size: 18px; padding: 16px 32px; border-radius: 8px; }
      [data-defect="on"] main { flex-direction: column; }
      [data-defect="on"] .text { padding-top: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="art"></div>
      <div class="text">
        <h1>A quiet room for focused work</h1>
        <p>Book a desk by the hour in the old mill, with fast internet and tea on tap.</p>
        <span class="button">Book a desk</span>
      </div>
    </main>
  </body>
</html>
