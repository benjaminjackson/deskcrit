<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: figure-merges-with-ground--3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A festival poster over a full-page pattern of dense, high-contrast red and black diagonal stripes. Without the defect the title and the details sit on a calm cream panel in the middle of the stripes. The defect removes the panel, so the title and the details sit directly on the stripes (OQ-17). */
      body { background: repeating-linear-gradient(60deg, #c1121f 0 18px, #111 18px 36px, #f4d35e 36px 44px, #111 44px 62px); }
      .poster { position: absolute; left: 120px; top: 150px; width: 1040px; padding: 56px 64px; border-radius: 10px; background: #f7f1e1; }
      h1 { font-size: 88px; font-weight: 800; line-height: 1; margin-bottom: 20px; color: #1b1b1b; }
      p { font-size: 34px; font-weight: 700; color: #1b1b1b; }
      [data-defect="on"] .poster { background: none; }
      [data-defect="on"] h1 { color: #e9e2cf; }
      [data-defect="on"] p { color: #e9e2cf; }
    </style>
  </head>
  <body>
    <div class="poster">
      <h1>Harbour Lights Festival</h1>
      <p>Saturday 14 June, from six in the evening, on the old quay</p>
    </div>
  </body>
</html>
