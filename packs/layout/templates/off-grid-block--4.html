<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: off-grid-block--4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* An analytics dashboard: a row of three cards (x=80 to 440, 460 to 820, 840 to 1200) over a row with a wide chart card (x=80 to 820) and one narrow card (x=840 to 1200). The defect moves the narrow card 26 px right, so its edges match no other block (OQ-17). */
      body { background: #f1f3f6; }
      .top { height: 60px; background: #1b2a41; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 80px; }
      .top span { font-size: 14px; opacity: 0.8; }
      h1 { position: absolute; left: 80px; top: 80px; font-size: 26px; }
      .card { position: absolute; background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(27, 42, 65, 0.15); padding: 18px 22px; }
      .card h2 { font-size: 14px; font-weight: 400; color: var(--color-muted); margin-bottom: 6px; }
      .card .big { font-size: 34px; font-weight: 700; }
      .k1 { left: 80px; } .k2 { left: 460px; } .k3 { left: 840px; }
      .k { top: 130px; width: 360px; height: 110px; }
      .chart { left: 80px; top: 264px; width: 740px; height: 410px; }
      .side { left: 840px; top: 264px; width: 360px; height: 410px; }
      [data-defect="on"] .side { left: 866px; }
      svg { margin-top: 10px; }
      .row { display: flex; justify-content: space-between; font-size: 15px; padding: 12px 0; border-bottom: 1px solid #eceff3; }
      .row b { font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="top"><b>Beacon Analytics</b><span>Last 30 days</span></div>
    <h1>Site traffic</h1>
    <div class="card k k1"><h2>Visitors</h2><div class="big">48,210</div></div>
    <div class="card k k2"><h2>Sign-ups</h2><div class="big">1,306</div></div>
    <div class="card k k3"><h2>Conversion</h2><div class="big">2.7%</div></div>
    <div class="card chart"><h2>Visitors per day</h2>
      <svg width="696" height="330" viewBox="0 0 696 330"><g stroke="#e3e7ec"><line x1="0" y1="40" x2="696" y2="40"/><line x1="0" y1="120" x2="696" y2="120"/><line x1="0" y1="200" x2="696" y2="200"/><line x1="0" y1="280" x2="696" y2="280"/></g>
        <polyline fill="none" stroke="#2f6fd0" stroke-width="3" points="0,240 58,210 116,225 174,170 232,185 290,130 348,150 406,100 464,120 522,80 580,110 638,60 696,75"/></svg></div>
    <div class="card side"><h2>Top sources</h2><div class="row"><span>Search</span><b>21,400</b></div><div class="row"><span>Direct</span><b>12,050</b></div><div class="row"><span>Newsletter</span><b>7,310</b></div><div class="row"><span>Social</span><b>4,120</b></div><div class="row"><span>Other</span><b>3,330</b></div></div>
  </body>
</html>
