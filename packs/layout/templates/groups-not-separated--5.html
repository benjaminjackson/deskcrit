<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: groups-not-separated--5</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Three colour sets of three wide strips. Off: strips 5 px apart inside a set, sets 48 px apart.
         On: every gap is 10 px, so the sets run together (OQ-17). */
      main { margin: 36px 0 0 100px; width: 960px; }
      .st { height: 44px; margin-bottom: 5px; color: #fff; font-size: 17px; line-height: 44px; padding: 0 16px; }
      .st.end { margin-bottom: 48px; }
      .st.last { margin-bottom: 0; }
      .o { background: #c2410c; } .t { background: #0f766e; } .v { background: #6d28d9; }
      [data-defect="on"] .st, [data-defect="on"] .st.end { margin-bottom: 10px; }
      [data-defect="on"] .st.last { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="st o">Rent</div><div class="st o">Power</div><div class="st o end">Water</div>
      <div class="st t">Bread</div><div class="st t">Milk</div><div class="st t end">Fruit</div>
      <div class="st v">Bus</div><div class="st v">Train</div><div class="st v last">Bike repair</div>
    </main>
  </body>
</html>
