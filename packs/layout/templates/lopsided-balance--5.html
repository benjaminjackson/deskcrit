<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: lopsided-balance--5</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A poster-like event page. A huge dark block with the title fills the lower left. Off: a
         saturated gold block with the date sits at the upper right as a counterweight. On: no
         counterweight, only light small text at the upper right. */
      .block { position: absolute; left: 0; bottom: 0; width: 760px; height: 560px; background: #111827; color: #fff; padding: 56px 64px; }
      .block h1 { font-family: var(--font-serif); font-size: 72px; line-height: 1.05; margin-bottom: 20px; }
      .block p { font-size: 22px; color: #c9d1e0; }
      .date { position: absolute; right: 0; top: 0; width: 440px; height: 380px; background: #f2b705; color: #1f2328; padding: 64px 56px; font-weight: 700; font-size: 44px; line-height: 1.2; }
      [data-defect="on"] .date { background: transparent; right: 80px; top: 72px; width: 240px; height: auto; padding: 0; font-size: 15px; font-weight: 400; color: var(--color-muted); }
    </style>
  </head>
  <body>
    <div class="date">Saturday<br>14 March<br>7 pm</div>
    <div class="block">
      <h1>The Lamplighters Winter Concert</h1>
      <p>An evening of folk songs by the village choir, with mulled cider in the interval.</p>
    </div>
  </body>
</html>
