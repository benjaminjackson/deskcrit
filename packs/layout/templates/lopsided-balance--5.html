<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: lopsided-balance--5</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A magazine article page: a dark photo block 640 x 410 px and a 56 px bold three-line headline with a short standfirst, 460 px wide. Without the defect the photo is at the left and the headline column at the right. The defect puts the headline under the photo at the left edge, so the right 500 px is empty. (OQ-17) */
      header { position: absolute; left: 48px; top: 28px; font-family: var(--font-serif); font-size: 22px; font-weight: 700; }
      .photo { position: absolute; left: 48px; top: 90px; width: 640px; height: 410px; background: linear-gradient(160deg, #0f2a33 0%, #1d4a57 55%, #0a171c 100%); }
      .photo::after { content: ""; position: absolute; left: 90px; bottom: 0; width: 460px; height: 170px; background: #07171c; clip-path: polygon(0 100%, 22% 20%, 40% 62%, 62% 0, 100% 100%); }
      .text { position: absolute; left: 760px; top: 90px; width: 460px; }
      .text h1 { font-family: var(--font-serif); font-size: 56px; line-height: 1.06; font-weight: 700; margin-bottom: 18px; }
      .text p { font-size: 18px; color: var(--color-muted); }
      [data-defect="on"] .text { left: 48px; top: 524px; width: 640px; }
    </style>
  </head>
  <body>
    <header>The Fell Review</header>
    <div class="photo"></div>
    <div class="text"><h1>The last ferry across the estuary</h1><p>Forty years after the bridge opened, one boat still makes the crossing twice a day.</p></div>
  </body>
</html>
