<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: uneven-gutters--5</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Five tall panels in different saturated colours on a white page, 12 px apart. The defect makes the
         second gap 96 px wide (OQ-17). */
      main { margin: 48px 40px 0; }
      h1 { font-size: 30px; font-weight: 700; margin-bottom: 32px; }
      .row { display: flex; }
      .p { width: 220px; height: 560px; color: #fff; padding: 20px; margin-right: 12px; }
      .p:last-child { margin-right: 0; }
      .p h2 { font-size: 22px; margin-bottom: 8px; }
      .p p { font-size: 15px; }
      .a { background: #c2410c; } .b { background: #0f766e; } .c { background: #7e22ce; } .d { background: #be123c; } .e { background: #1d4ed8; }
      [data-defect="on"] .b { margin-right: 96px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Festival stages</h1>
      <div class="row">
        <div class="p a"><h2>Harbour</h2><p>Brass bands from noon.</p></div>
        <div class="p b"><h2>Meadow</h2><p>Folk and fiddles.</p></div>
        <div class="p c"><h2>Barn</h2><p>Late dance sets.</p></div>
        <div class="p d"><h2>Tent</h2><p>Spoken word.</p></div>
        <div class="p e"><h2>Pier</h2><p>Sunset acoustic.</p></div>
      </div>
    </main>
  </body>
</html>
