<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: white-space-scattered--5</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A budget map: four bands of coloured segments, 6 px apart. Off: the bands are a small block at the
         bottom left, with a large empty page above and to the right. On: the bands fill the page, so no open
         area is left (OQ-17). */
      .map { position: absolute; left: 48px; bottom: 48px; width: 440px; height: 280px; display: flex; flex-direction: column; gap: 6px; }
      .band { flex: 1; display: flex; gap: 6px; }
      .seg { color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; }
      .a { background: #b45309; } .b { background: #0f766e; } .c { background: #6d28d9; } .d { background: #be123c; } .e { background: #1d4ed8; }
      [data-defect="on"] .map { inset: 6px; width: auto; height: auto; }
      [data-defect="on"] .seg { font-size: 22px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="map">
      <div class="band"><div class="seg a" style="flex:5">Rent</div><div class="seg b" style="flex:2">Food</div><div class="seg c" style="flex:2">Bus</div><div class="seg d" style="flex:1">Gym</div></div>
      <div class="band"><div class="seg e" style="flex:3">Power</div><div class="seg a" style="flex:2">Water</div><div class="seg b" style="flex:4">Phone</div><div class="seg c" style="flex:1">Tax</div></div>
      <div class="band"><div class="seg d" style="flex:2">Books</div><div class="seg e" style="flex:2">Music</div><div class="seg a" style="flex:3">Games</div><div class="seg b" style="flex:2">Pets</div><div class="seg c" style="flex:1">Gifts</div></div>
      <div class="band"><div class="seg c" style="flex:4">Savings</div><div class="seg d" style="flex:3">Repairs</div><div class="seg e" style="flex:2">Travel</div><div class="seg a" style="flex:2">Fun</div></div>
    </div>
  </body>
</html>
