<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: picture off text lines, variant 4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion picture-off-text-lines. A loaf picture sits left of a recipe's ingredient list and method. The defect only moves the picture
 * with its position offset, so its top and bottom no longer sit on the first
 * and last lines of the text. Nothing else changes (OQ-17).
 */

body {
  font-family: var(--font-serif);
}

.card {
  display: flex;
  align-items: stretch;
  gap: 56px;
  margin: 150px 0 0 150px;
}

.pic {
  position: relative;
  width: 360px;
  flex: none;
}

.pic svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.text {
  width: 560px;
  font-size: 22px;
  line-height: 32px;
  text-box: trim-both cap alphabetic;
}

.text h1 {
  font-size: 46px;
  line-height: 54px;
  font-weight: 400;
  margin-bottom: 6px;
}

.meta {
  color: var(--color-muted);
  margin-bottom: 14px;
}

.text ul {
  list-style: none;
  margin-bottom: 14px;
}

[data-defect="on"] .pic {
  top: 85px;
}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="pic"><svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="300" fill="#e9d9b8"/><rect y="235" width="300" height="65" fill="#b98a55"/><ellipse cx="150" cy="185" rx="105" ry="62" fill="#c9893f"/><ellipse cx="150" cy="175" rx="105" ry="55" fill="#d9a05a"/><path d="M85 150 L110 190M130 140 L155 185M175 140 L200 185" stroke="#f3dcae" stroke-width="10" stroke-linecap="round"/></svg></div>
      <div class="text">
        <h1>Farmhouse oat loaf</h1>
        <p class="meta">Makes one loaf. Bake for forty minutes.</p>
        <ul>
          <li>500 g strong white flour</li>
          <li>100 g rolled oats</li>
          <li>10 g fine salt</li>
          <li>7 g dried yeast</li>
          <li>350 ml warm water</li>
          <li>1 tablespoon honey</li>
        </ul>
        <p>Mix everything into a soft dough, knead for ten minutes, and leave to rise until doubled.</p>
      </div>
    </main>
  </body>
</html>
