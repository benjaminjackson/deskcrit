<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: heavy rules and boxes</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion heavy-rules-and-boxes. A timetable of seven rows and four columns. The defect only draws a dark 3 px
 * border on every cell, card, or section, so the lines are as strong as the
 * text. Without it the same content is separated by space and a pale tone or
 * a pale hairline. Nothing else changes (OQ-17).
 */

main { margin: 56px 100px 0; }
h1 { font-size: 36px; font-weight: 700; margin-bottom: 4px; }
.sub { color: var(--color-muted); font-size: 18px; margin-bottom: 28px; }
table { width: 1080px; border-collapse: collapse; font-size: 20px; }
th, td { text-align: left; padding: 12px 18px; border: 3px solid transparent; }
th { font-weight: 700; border-bottom-color: #e3e7eb; }
td { border-bottom-color: #eef0f3; }

[data-defect="on"] th,
[data-defect="on"] td { border-color: #111; }
    </style>
  </head>
  <body>
    <main>
      <h1>River ferry timetable</h1>
      <p class="sub">North landing to market quay, spring season</p>
      <table>
        <thead><tr><th>Period</th><th>Leaves north</th><th>Arrives quay</th><th>Runs</th></tr></thead>
        <tbody>
          <tr><td>Morning</td><td>06:40</td><td>06:52</td><td>Daily</td></tr>
          <tr><td>Morning</td><td>07:20</td><td>07:32</td><td>Daily</td></tr>
          <tr><td>Midday</td><td>11:00</td><td>11:12</td><td>Daily</td></tr>
          <tr><td>Midday</td><td>12:40</td><td>12:52</td><td>Weekdays</td></tr>
          <tr><td>Afternoon</td><td>15:20</td><td>15:32</td><td>Daily</td></tr>
          <tr><td>Afternoon</td><td>17:10</td><td>17:22</td><td>Weekdays</td></tr>
          <tr><td>Evening</td><td>19:30</td><td>19:42</td><td>Weekends</td></tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
