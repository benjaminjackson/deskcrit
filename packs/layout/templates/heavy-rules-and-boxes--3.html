<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: heavy rules and boxes, variant 3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
/*
 * Criterion heavy-rules-and-boxes. A settings page has three sections of two rows each. The defect only draws a dark 3 px
 * border on every cell, card, or section, so the lines are as strong as the
 * text. Without it the same content is separated by space and a pale tone or
 * a pale hairline. Nothing else changes (OQ-17).
 */

main { width: 860px; margin: 44px 0 0 140px; }
h1 { font-size: 34px; font-weight: 700; margin-bottom: 26px; }
section { margin-bottom: 26px; padding: 4px 22px 4px; border: 3px solid transparent; }
section h2 { font-size: 20px; font-weight: 700; color: var(--color-muted); padding: 12px 0 6px; }
.row { display: flex; justify-content: space-between; font-size: 20px; padding: 14px 0; border-top: 3px solid transparent; }
section h2 + .row { border-top-color: #e6e9ed; }
.val { color: var(--color-muted); }

[data-defect="on"] section { border-color: #111; }
[data-defect="on"] .row { border-top-color: #111; }
    </style>
  </head>
  <body>
    <main>
      <h1>Group settings</h1>
      <section>
        <h2>Profile</h2>
        <div class="row"><span>Display name</span><span class="val">Harbour Reading Group</span></div>
        <div class="row"><span>Contact email</span><span class="val">hello@example.org</span></div>
      </section>
      <section>
        <h2>Notifications</h2>
        <div class="row"><span>Event reminders</span><span class="val">On</span></div>
        <div class="row"><span>Weekly digest</span><span class="val">Off</span></div>
      </section>
      <section>
        <h2>Privacy</h2>
        <div class="row"><span>Show member list</span><span class="val">Members only</span></div>
        <div class="row"><span>Search listing</span><span class="val">Hidden</span></div>
      </section>
    </main>
  </body>
</html>
