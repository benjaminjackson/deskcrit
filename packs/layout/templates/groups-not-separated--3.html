<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: groups-not-separated (3)</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A sidebar menu with three sections of links. Links are 4 px apart and sections are 40 px apart. The defect
         spaces every link and every section heading 14 px apart (OQ-17). */
      body { background: #1d2a3a; color: #dbe5f0; }
      nav { margin: 44px 0 0 80px; width: 360px; }
      h1 { font-size: 26px; font-weight: 300; margin-bottom: 28px; color: #fff; }
      .section { margin-bottom: 40px; }
      h2 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #7fa6d1; margin-bottom: 6px; }
      a { display: block; font-size: 19px; padding: 0; margin-bottom: 4px; color: #dbe5f0; }
      .section a:last-child { margin-bottom: 0; }
      [data-defect="on"] .section { margin-bottom: 14px; }
      [data-defect="on"] h2 { margin-bottom: 14px; }
      [data-defect="on"] a { margin-bottom: 14px; }
      [data-defect="on"] .section a:last-child { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <nav>
      <h1>Help centre</h1>
      <div class="section"><h2>Getting started</h2><a>Create a workspace</a><a>Invite your team</a><a>Import a spreadsheet</a></div>
      <div class="section"><h2>Billing</h2><a>Change your plan</a><a>Download an invoice</a><a>Update a card</a></div>
      <div class="section"><h2>Security</h2><a>Turn on two-step sign-in</a><a>Review active sessions</a><a>Export your data</a></div>
    </nav>
  </body>
</html>
