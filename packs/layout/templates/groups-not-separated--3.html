<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: groups-not-separated--3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Nine square tiles in a row, coloured in three sets of three. Off: tiles 8 px apart inside a set and
         64 px between sets. On: every gap is 16 px, so the sets run together (OQ-17). */
      main { margin: 150px 0 0 48px; }
      .row { display: flex; }
      .t { width: 110px; height: 110px; margin-right: 8px; color: #fff; font-size: 18px; font-weight: 700; padding: 12px; }
      .t.end { margin-right: 64px; }
      .t.last { margin-right: 0; }
      .r { background: #b91c1c; } .g { background: #15803d; } .b { background: #1d4ed8; }
      [data-defect="on"] .t, [data-defect="on"] .t.end { margin-right: 16px; }
      [data-defect="on"] .t.last { margin-right: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="row">
        <div class="t r">Mon</div><div class="t r">Tue</div><div class="t r end">Wed</div>
        <div class="t g">Thu</div><div class="t g">Fri</div><div class="t g end">Sat</div>
        <div class="t b">Sun</div><div class="t b">Hol</div><div class="t b last">Eve</div>
      </div>
    </main>
  </body>
</html>
