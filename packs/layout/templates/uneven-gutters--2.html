<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: uneven-gutters--2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Four solid blue cards on a white page, 24 px apart, so each gap is a white stripe. The defect makes the
         second gap 120 px wide (OQ-17). */
      main { margin: 64px 80px 0; }
      h1 { font-size: 30px; font-weight: 700; margin-bottom: 48px; }
      .row { display: flex; }
      .card { width: 240px; height: 440px; background: #1d4ed8; color: #fff; border-radius: 6px; padding: 24px; margin-right: 24px; }
      .card:last-child { margin-right: 0; }
      .card h2 { font-size: 22px; margin-bottom: 8px; }
      .card p { font-size: 16px; opacity: .85; }
      [data-defect="on"] .second { margin-right: 120px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Weekend workshops</h1>
      <div class="row">
        <div class="card"><h2>Bread</h2><p>Saturday morning, sourdough basics.</p></div>
        <div class="card second"><h2>Pasta</h2><p>Saturday afternoon, fresh egg dough.</p></div>
        <div class="card"><h2>Pickles</h2><p>Sunday morning, jars and brines.</p></div>
        <div class="card"><h2>Cheese</h2><p>Sunday afternoon, soft curds.</p></div>
      </div>
    </main>
  </body>
</html>
