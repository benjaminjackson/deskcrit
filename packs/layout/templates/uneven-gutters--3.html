<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: uneven-gutters (3)</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Four tiles with 20 px gaps. The defect makes the gaps 20, 70 and 6 px (OQ-17). */
      body { background: #101820; color: #e6edf3; }
      main { margin: 64px 60px 0; }
      h1 { font-size: 30px; font-weight: 300; margin-bottom: 32px; }
      .row { display: flex; }
      .tile { width: 270px; height: 300px; background: #1b2733; border-radius: 12px; padding: 28px; }
      .tile + .tile { margin-left: 20px; }
      .tile span { color: #93a4b5; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
      .tile strong { display: block; font-size: 54px; font-weight: 700; margin: 16px 0; color: #8fd0b0; }
      .tile p { color: #93a4b5; font-size: 15px; }
      [data-defect="on"] .t2 { margin-left: 70px; }
      [data-defect="on"] .t3 { margin-left: 6px; }
      [data-defect="on"] .t4 { margin-left: 20px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Greenhouse sensors</h1>
      <div class="row">
        <div class="tile"><span>Air</span><strong>21.4</strong><p>Degrees, steady over the last hour.</p></div>
        <div class="tile t2"><span>Soil</span><strong>63%</strong><p>Moisture in the third bed.</p></div>
        <div class="tile t3"><span>Light</span><strong>14k</strong><p>Lux at the roof glass.</p></div>
        <div class="tile t4"><span>Vent</span><strong>40%</strong><p>Open since noon.</p></div>
      </div>
    </main>
  </body>
</html>
