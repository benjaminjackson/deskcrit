<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: uneven-gutters--3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Five white cards on a dark navy page, 20 px apart, so each gap is a dark stripe. The defect makes the
         fourth gap 110 px wide (OQ-17). */
      body { background: #0b1b3a; color: #fff; }
      main { margin: 64px 56px 0; }
      h1 { font-size: 30px; font-weight: 700; margin-bottom: 48px; }
      .row { display: flex; }
      .card { width: 200px; height: 440px; background: #fff; color: #111; padding: 20px; margin-right: 20px; }
      .card:last-child { margin-right: 0; }
      .card h2 { font-size: 20px; margin-bottom: 8px; }
      .card p { font-size: 15px; color: #444; }
      [data-defect="on"] .fourth { margin-right: 110px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Evening sky guide</h1>
      <div class="row">
        <div class="card"><h2>Mercury</h2><p>Low in the west after sunset.</p></div>
        <div class="card"><h2>Venus</h2><p>Bright and steady above the horizon.</p></div>
        <div class="card"><h2>Mars</h2><p>Faint orange in the south.</p></div>
        <div class="card fourth"><h2>Jupiter</h2><p>Rises at dusk in the east.</p></div>
        <div class="card"><h2>Saturn</h2><p>Visible all night with rings in a scope.</p></div>
      </div>
    </main>
  </body>
</html>
