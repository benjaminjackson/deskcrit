<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: lopsided-balance--2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A coffee roaster landing page: a dark brown panel with the headline and a large photo block, each 600 x 330 px, under a light header. Without the defect the panel sits top left and the photo bottom right. The defect stacks both at the left edge and leaves the right half empty. (OQ-17) */
      header { position: absolute; left: 0; top: 0; width: 1280px; height: 64px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e6dfd8; }
      header b { font-size: 20px; color: #2a1d16; }
      header span { font-size: 14px; color: var(--color-muted); margin-left: 28px; }
      .panel { position: absolute; left: 48px; top: 96px; width: 600px; height: 330px; background: #2a1d16; color: #f5ebe0; padding: 40px; }
      .panel h1 { font-size: 44px; line-height: 1.1; margin-bottom: 14px; }
      .panel p { font-size: 16px; color: #d8c8b8; margin-bottom: 22px; }
      .panel a { display: inline-block; background: #e9b872; color: #2a1d16; font-weight: 700; padding: 10px 20px; font-size: 15px; }
      .photo { position: absolute; left: 632px; top: 440px; width: 600px; height: 330px; background: radial-gradient(circle at 62% 52%, #f3e3cf 0 16%, #8a5a3a 17% 40%, #4a2e1c 41% 100%); }
      [data-defect="on"] .photo { left: 48px; top: 440px; }
    </style>
  </head>
  <body>
    <header><b>Kiln &amp; Bean</b><nav><span>Shop</span><span>Subscriptions</span><span>Brewing guides</span><span>Visit</span></nav></header>
    <div class="panel"><h1>Roasted on Tuesday, at your door by Thursday</h1><p>Small lots from three farms, roasted in batches of twelve kilos.</p><a>Start a subscription</a></div>
    <div class="photo"></div>
  </body>
</html>
