<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: figure-merges-with-ground--5</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A hero banner for a seed shop: a headline and a round "Shop seeds" button over a full-width pattern of dense coloured checks and dots, like a busy photo. Without the defect the headline and button sit on a calm dark green panel over the pattern. The defect removes the panel, so the headline and the button sit directly on the pattern (OQ-17). */
      body { background:
        radial-gradient(circle at 12px 12px, #ff7f50 0 7px, transparent 8px) 0 0 / 34px 34px,
        repeating-conic-gradient(#1d3557 0 25%, #a8dadc 0 50%) 0 0 / 60px 60px; }
      .hero { position: absolute; left: 140px; top: 180px; width: 1000px; padding: 56px 64px; border-radius: 12px; background: #0f2a1d; }
      h1 { font-size: 76px; font-weight: 800; line-height: 1.05; color: #fff; margin-bottom: 32px; }
      .btn { display: inline-block; padding: 18px 44px; border-radius: 40px; background: #ffd166; color: #1b1b1b; font-size: 30px; font-weight: 800; }
      [data-defect="on"] .hero { background: none; }
      [data-defect="on"] .btn { background: #ff7f50; color: #1d3557; }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Sow now for a summer of tomatoes</h1>
      <span class="btn">Shop seeds</span>
    </div>
  </body>
</html>
