<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: figure-merges-with-ground--5</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A navy site header with a logo mark, a site name, and five navigation links. Without the defect the logo and links are white on the navy. The defect recolours the logo mark, the site name, and the links in blues close to the navy, so they nearly vanish into the bar, and puts a faint texture of stripes in the bar. */
      body { background: #f3f5f8; }
      header { margin: 56px 56px 0; height: 120px; border-radius: 12px; background: #1c2f52; display: flex; align-items: center; padding: 0 40px; gap: 44px; }
      .mark { width: 56px; height: 56px; border-radius: 14px; background: #ffffff; }
      .name { font-size: 30px; font-weight: 700; color: #fff; margin-right: auto; }
      nav a { font-size: 20px; font-weight: 700; color: #fff; margin-left: 36px; }
      [data-defect="on"] header { background: repeating-linear-gradient(135deg, #1c2f52 0 14px, #24396290 14px 28px); background-color: #1c2f52; }
      [data-defect="on"] .mark { background: #27406b; }
      [data-defect="on"] .name { color: #3a5688; }
      [data-defect="on"] nav a { color: #3a5688; }
      h2 { margin: 56px 56px 12px; font-size: 36px; }
      p { margin: 0 56px; font-size: 20px; width: 760px; color: var(--color-muted); }
    </style>
  </head>
  <body>
    <header>
      <div class="mark"></div>
      <div class="name">Northfield Rowing Club</div>
      <nav><a>Crews</a><a>Races</a><a>Boathouse</a><a>Juniors</a><a>Join</a></nav>
    </header>
    <h2>Spring regatta entries are open</h2>
    <p>Crews of every age can enter. Closing date for entries is the last Friday of March.</p>
  </body>
</html>
