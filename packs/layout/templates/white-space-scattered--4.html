<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: white-space-scattered-4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A ferry timetable. The off side gathers the timetable into one dense table at the lower left under
         a large title, with an open area on the right. The on side splits the title, the notes, and every
         timetable cell into boxes that fill the page, each 10px from the next (OQ-17). */
      .page { position: relative; }
      h1 { position: absolute; left: 80px; top: 60px; font-size: 60px; line-height: 1.05; width: 700px; }
      .notes { position: absolute; left: 880px; top: 70px; width: 300px; color: var(--color-muted); font-size: 18px; }
      .grid { position: absolute; left: 80px; top: 360px; width: 620px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
      .grid div { background: #e8eef6; padding: 8px 12px; font-size: 16px; }
      .grid .hd { font-weight: 700; background: #cfdcec; }
      [data-defect="on"] .page { padding: 28px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 130px repeat(5, 1fr); gap: 10px; height: 800px; }
      [data-defect="on"] h1, [data-defect="on"] .notes, [data-defect="on"] .grid { position: static; width: auto; }
      [data-defect="on"] h1 { grid-column: 1 / span 3; font-size: 40px; background: #dfe6ef; padding: 18px; }
      [data-defect="on"] .notes { background: #dfe6ef; padding: 18px; font-size: 16px; }
      [data-defect="on"] .grid { display: contents; }
      [data-defect="on"] .grid div { padding: 18px; font-size: 20px; }

    </style>
  </head>
  <body>
    <div class="page">
      <h1>Quayside ferry timetable</h1>
      <p class="notes">Crossings take twelve minutes. Cycles travel free.</p>
      <div class="grid">
        <div class="hd">Leaves north</div><div class="hd">Arrives quay</div><div class="hd">Leaves quay</div><div class="hd">Arrives north</div>
        <div>07:00</div><div>07:12</div><div>07:20</div><div>07:32</div>
        <div>07:40</div><div>07:52</div><div>08:00</div><div>08:12</div>
        <div>08:20</div><div>08:32</div><div>08:40</div><div>08:52</div>
        <div>09:00</div><div>09:12</div><div>09:20</div><div>09:32</div>
        <div>09:40</div><div>09:52</div><div>10:00</div><div>10:12</div>
      </div>
    </div>
  </body>
</html>
