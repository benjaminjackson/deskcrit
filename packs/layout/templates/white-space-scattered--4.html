<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: white-space-scattered--4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Five dark columns of boxes with short labels, 6 px apart. Off: the columns are narrow and short, at the
         bottom right, with a large empty page. On: the columns fill the page, so no open area is left (OQ-17). */
      body { background: #111827; }
      .cols { display: flex; gap: 6px; position: absolute; right: 48px; bottom: 48px; width: 400px; height: 260px; }
      .col { flex: 1; display: flex; flex-direction: column; gap: 6px; }
      .box { flex: 1; background: #374151; color: #e5e7eb; font-size: 11px; display: flex; align-items: center; justify-content: center; }
      .box.w2 { flex: 2; background: #4b5563; } .box.w3 { flex: 3; background: #1f2937; border: 1px solid #4b5563; }
      [data-defect="on"] .cols { inset: 6px; width: auto; height: auto; }
      [data-defect="on"] .box { font-size: 22px; }
    </style>
  </head>
  <body>
    <div class="cols">
      <div class="col"><div class="box">Ash</div><div class="box w2">Birch</div><div class="box">Cedar</div><div class="box w3">Elm</div></div>
      <div class="col"><div class="box w3">Fir</div><div class="box">Gum</div><div class="box w2">Holly</div><div class="box">Iroko</div></div>
      <div class="col"><div class="box w2">Juniper</div><div class="box">Karri</div><div class="box w3">Larch</div><div class="box">Maple</div></div>
      <div class="col"><div class="box">Nutmeg</div><div class="box w3">Oak</div><div class="box">Pine</div><div class="box w2">Quince</div></div>
      <div class="col"><div class="box w2">Rowan</div><div class="box">Spruce</div><div class="box w2">Teak</div><div class="box w2">Yew</div></div>
    </div>
  </body>
</html>
