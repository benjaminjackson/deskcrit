<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: figure-merges-with-ground--2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A race poster on a full page of gravel (about 2,500 grey and tan pebbles). A white headline, date and place sit in the middle of the pebbles. The defect removes the cream panel that sits between the pebbles and the text (OQ-17). */
      body { background: #8a8579; }
      svg { position: absolute; left: 0; top: 0; }
      .poster { position: absolute; left: 190px; top: 170px; width: 900px; padding: 56px 64px; text-align: center; color: #fff; background: #f4efe4; color: #2c2a25; }
      [data-defect="on"] .poster { background: transparent; color: #fff; }
      .kicker { font-size: 18px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 16px; }
      h1 { font-family: var(--font-serif); font-size: 84px; line-height: 1; font-weight: 700; margin-bottom: 24px; }
      .meta { font-size: 24px; margin-bottom: 8px; }
      .small { font-size: 18px; }
    </style>
  </head>
  <body>
    <svg id="tex" width="1280" height="800" viewBox="0 0 1280 800"></svg>
    <div class="poster"><div class="kicker">Sunday 14 June</div><h1>Shingle Bay 10K</h1><div class="meta">Start at the lifeboat house, 9:30 am</div><div class="small">Entries close on Friday. Route follows the coast path.</div></div>
    <script>
      var seed = 11;
      function random() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
      var markup = '';
      for (var index = 0; index < 2600; index++) {
        var x = random() * 1280, y = random() * 800, rx = 6 + random() * 12, ry = rx * (0.6 + random() * 0.3);
        var turn = random() * 180, hue = 28 + random() * 20, sat = 4 + random() * 14, light = 32 + random() * 36;
        markup += '<ellipse cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" rx="' + rx.toFixed(0) + '" ry="' + ry.toFixed(0) + '" transform="rotate(' + turn.toFixed(0) + ' ' + x.toFixed(0) + ' ' + y.toFixed(0) + ')" fill="hsl(' + hue.toFixed(0) + ',' + sat.toFixed(0) + '%,' + light.toFixed(0) + '%)" stroke="rgba(40,36,30,0.35)" stroke-width="1"/>';
      }
      document.getElementById('tex').innerHTML = markup;
    </script>
  </body>
</html>
