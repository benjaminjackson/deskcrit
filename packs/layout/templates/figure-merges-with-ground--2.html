<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: figure-merges-with-ground--2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A hero panel with a warm striped gradient that stands in for a busy photo, with a white headline and a pale button on top. Without the defect the text sits on a solid dark card laid over the gradient. The defect removes the card so the white text and button sit straight on the pale and orange bands. */
      body { background: #fff; }
      .hero { margin: 48px 80px; height: 704px; border-radius: 14px; position: relative; overflow: hidden;
        background: repeating-linear-gradient(100deg, #f6d9b0 0 40px, #f1b37a 40px 90px, #fbe8cf 90px 130px, #e9a06b 130px 190px); }
      .card { position: absolute; left: 72px; top: 200px; width: 680px; padding: 48px; background: #2a1d17; border-radius: 12px; }
      h1 { font-family: var(--font-serif); font-size: 52px; font-weight: 700; line-height: 1.15; color: #fff; margin-bottom: 18px; }
      p { font-size: 22px; color: #fff; margin-bottom: 30px; }
      .button { display: inline-block; background: #fbe8cf; color: #7a3b14; font-weight: 700; font-size: 20px; padding: 14px 30px; border-radius: 8px; }
      [data-defect="on"] .card { background: none; }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="card">
        <h1>Late summer market at the old quay</h1>
        <p>Fruit, bread, and honey from forty local stalls, every Saturday until October.</p>
        <span class="button">Plan your visit</span>
      </div>
    </div>
  </body>
</html>
