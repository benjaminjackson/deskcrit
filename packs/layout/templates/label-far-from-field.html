<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: label-far-from-field</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A form whose labels sit 6 px above their own field and 28 px below the field before. The
         defect swaps the gaps, so each label sits nearer the field above it (OQ-17). */
      main { margin: 56px 0 0 96px; width: 480px; }
      h1 { font-size: 28px; font-weight: 700; margin-bottom: 24px; }
      label { display: block; font-size: 16px; font-weight: 700; margin-top: 32px; margin-bottom: 6px; }
      label:first-of-type { margin-top: 0; }
      .field { height: 44px; border: 2px solid #8c959f; border-radius: 6px; }
      [data-defect="on"] label { margin-top: 3px; margin-bottom: 36px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Book a workshop seat</h1>
      <label>Workshop name</label><div class="field"></div>
      <label>Preferred date</label><div class="field"></div>
      <label>Number of seats</label><div class="field"></div>
      <label>Notes for the host</label><div class="field"></div>
    </main>
  </body>
</html>
