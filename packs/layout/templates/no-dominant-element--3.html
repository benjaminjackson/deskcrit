<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: no-dominant-element-3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A town festival poster board in a classic serif. The off side has one huge festival title and two
         small lines of detail. The on side sets three event titles at the same large size and weight in
         three equal columns (OQ-17). */
      body { font-family: var(--font-serif); }
      main { margin: 90px 0 0 90px; width: 1100px; display: flex; flex-wrap: wrap; column-gap: 60px; }
      .e1 { width: 1000px; }
      .e1 h2 { font-size: 150px; line-height: 0.95; font-weight: 700; margin-bottom: 28px; }
      .e1 p { font-size: 26px; font-style: italic; color: var(--color-muted); }
      .e2, .e3 { width: 400px; margin-top: 70px; }
      .e2 h2, .e3 h2 { font-size: 24px; font-weight: 400; margin-bottom: 6px; }
      .e2 p, .e3 p { font-size: 17px; color: var(--color-muted); }
      [data-defect="on"] main { margin: 90px 0 0 70px; width: 1140px; flex-wrap: nowrap; column-gap: 0; }
      [data-defect="on"] .e1, [data-defect="on"] .e2, [data-defect="on"] .e3 { width: 380px; margin-top: 0; padding: 0 28px; border-left: 4px solid var(--color-text); }
      [data-defect="on"] .e1 h2, [data-defect="on"] .e2 h2, [data-defect="on"] .e3 h2 { font-size: 68px; line-height: 1; font-weight: 700; margin-bottom: 28px; }
      [data-defect="on"] .e1 p, [data-defect="on"] .e2 p, [data-defect="on"] .e3 p { font-size: 22px; font-style: normal; color: var(--color-text); }

    </style>
  </head>
  <body>
    <main>
      <section class="e1"><h2>Harvest Fair</h2><p>Saturday on the village green, from ten until dusk.</p></section>
      <section class="e2"><h2>Lantern Walk</h2><p>Friday evening, meet at the bridge.</p></section>
      <section class="e3"><h2>Pie Contest</h2><p>Sunday noon, in the market hall.</p></section>
    </main>
  </body>
</html>
