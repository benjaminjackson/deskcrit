<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: white-space-scattered--2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Chips with a 6 px gap. Off: the chips sit in a narrow block at the top left, with a large empty page
         around it. On: the same chips stretch over the whole page, so every gap is 6 px and no open area is left (OQ-17). */
      .wrap { display: flex; flex-wrap: wrap; gap: 6px; margin: 40px 0 0 48px; width: 420px; }
      .chip { flex: 1 1 auto; background: #dbeafe; color: #1e3a8a; font-size: 14px; padding: 8px 10px; text-align: center; }
      [data-defect="on"] .wrap { margin: 6px; width: auto; align-content: stretch; height: 788px; }
      [data-defect="on"] .chip { display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap"></div>
    <script>
      var words = "river stone lamp harbour cedar copper meadow signal ladder marble orchard kettle anchor pepper violet quarry window ribbon saddle tunnel velvet walnut yarrow zephyr badger cobalt dune ember fennel gravel heron indigo juniper kiln lantern mosaic nectar olive prism quilt rowan sable thistle umber vessel willow".split(" ");
      var html = "";
      for (var index = 0; index < 90; index++) {
        html += '<div class="chip">' + words[index % words.length] + (index >= words.length ? " " + (index % 7 + 2) : "") + "</div>";
      }
      document.getElementById("wrap").innerHTML = html;
    </script>
  </body>
</html>
