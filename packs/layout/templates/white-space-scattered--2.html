<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <title>Layout fixture: white-space-scattered 2</title>
    <style>
      /* A web dashboard for a bike-share operator: a left menu, a title row, four number tiles, a chart panel, and a table panel. The defect gives the menu, the title, the tiles, and the panels one equal 24 px gap with a 24 px page margin. The clean page has a wide main margin, a 12 px gap inside the tile row, and 56 px between the tile row and the panels. (OQ-17) */
      body { display: flex; background: #eef1f5; padding: 0; }
      .menu { width: 220px; background: #14213d; color: #fff; padding: 32px 24px; }
      .menu b { display: block; font-size: 18px; margin-bottom: 28px; } .menu p { font-size: 15px; padding: 8px 0; opacity: .85; }
      .main { flex: 1; padding: 40px 72px 0 72px; display: flex; flex-direction: column; }
      .main h1 { font-size: 28px; margin-bottom: 24px; }
      .tiles { display: flex; gap: 12px; margin-bottom: 56px; }
      .tile { flex: 1; background: #fff; border-radius: 10px; padding: 14px 16px; }
      .tile small { color: var(--color-muted); font-size: 13px; display: block; margin-bottom: 2px; } .tile b { font-size: 26px; }
      .panels { display: flex; gap: 12px; }
      .panel { background: #fff; border-radius: 10px; padding: 16px; flex: 1; height: 400px; }
      .panel h3 { font-size: 15px; margin-bottom: 8px; }
      .bars { display: flex; align-items: flex-end; gap: 10px; height: 220px; } .bars i { flex: 1; background: #3a6ea5; border-radius: 4px 4px 0 0; }
      .row { display: flex; justify-content: space-between; font-size: 14px; padding: 7px 0; border-bottom: 1px solid #e6e9ee; color: var(--color-muted); } .row b { color: var(--color-text); font-weight: 400; }
      [data-defect="on"] .menu { margin: 24px 0 24px 24px; border-radius: 12px; padding: 24px; }
      [data-defect="on"] .main { padding: 24px; }
      [data-defect="on"] .main h1 { margin-bottom: 24px; }
      [data-defect="on"] .tiles { gap: 24px; margin-bottom: 24px; }
      [data-defect="on"] .tile { padding: 24px; }
      [data-defect="on"] .panels { gap: 24px; flex: 1; }
      [data-defect="on"] .panel { height: auto; padding: 24px; }
      [data-defect="on"] .bars { height: 300px; }
    </style>
  </head>
  <body>
    <div class="menu"><b>Spokeline</b><p>Overview</p><p>Stations</p><p>Trips</p><p>Repairs</p><p>Members</p></div>
    <div class="main">
      <h1>Fleet overview</h1>
      <div class="tiles"><div class="tile"><small>Trips today</small><b>4,812</b></div><div class="tile"><small>Bikes out</small><b>731</b></div><div class="tile"><small>In repair</small><b>58</b></div><div class="tile"><small>New members</small><b>126</b></div></div>
      <div class="panels">
        <div class="panel"><h3>Trips by hour</h3><div class="bars"><i style="height:20%"></i><i style="height:35%"></i><i style="height:80%"></i><i style="height:55%"></i><i style="height:40%"></i><i style="height:50%"></i><i style="height:95%"></i><i style="height:60%"></i><i style="height:30%"></i></div></div>
        <div class="panel"><h3>Busiest stations</h3><div class="row"><span>Ferry Landing</span><b>412</b></div><div class="row"><span>Library Square</span><b>388</b></div><div class="row"><span>Mill Street</span><b>301</b></div><div class="row"><span>North Park</span><b>276</b></div><div class="row"><span>Old Market</span><b>243</b></div><div class="row"><span>Canal Basin</span><b>231</b></div><div class="row"><span>Hill Road</span><b>198</b></div><div class="row"><span>Station Yard</span><b>187</b></div><div class="row"><span>Pier 4</span><b>160</b></div></div>
      </div>
    </div>
  </body>
</html>
