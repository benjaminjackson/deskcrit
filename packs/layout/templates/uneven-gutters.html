<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: uneven-gutters</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Four cards in a row with 32 px gaps. The defect makes the second gap much wider and the
         third narrower, so the gutters are visibly uneven (OQ-17). */
      main { margin: 80px 64px 0; }
      h1 { font-size: 32px; font-weight: 700; margin-bottom: 40px; }
      .row { display: flex; }
      .card { width: 260px; height: 420px; border: 2px solid var(--color-border); border-radius: 8px; padding: 24px; background: #f6f8fa; margin-right: 32px; }
      .card:last-child { margin-right: 0; }
      .card h2 { font-size: 20px; margin-bottom: 8px; }
      .card p { color: var(--color-muted); }
      [data-defect="on"] .second { margin-right: 80px; }
      [data-defect="on"] .third { margin-right: 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Choose a plan</h1>
      <div class="row">
        <div class="card"><h2>Starter</h2><p>One project, two members, and a week of history.</p></div>
        <div class="card second"><h2>Team</h2><p>Ten projects, twenty members, and a month of history.</p></div>
        <div class="card third"><h2>Studio</h2><p>Fifty projects, unlimited members, and a year of history.</p></div>
        <div class="card"><h2>Archive</h2><p>Read-only access to every project for audits.</p></div>
      </div>
    </main>
  </body>
</html>
