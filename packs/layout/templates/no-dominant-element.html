<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: no-dominant-element</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A landing page for a swimming club with three offers. The off side makes the first offer one huge
         headline and the other two small quiet notes. The on side sets all three as equal bold white
         headlines in three equal coloured panels (OQ-17). */
      main { margin: 80px 96px 0; display: flex; gap: 40px; flex-wrap: wrap; }
      .o1 h2 { font-size: 88px; line-height: 1.02; font-weight: 700; margin-bottom: 20px; }
      .o1 p { font-size: 22px; color: var(--color-muted); width: 760px; }
      .o2, .o3 { width: 440px; margin-top: 56px; }
      .o2 h2, .o3 h2 { font-size: 20px; font-weight: 400; margin-bottom: 6px; }
      .o2 p, .o3 p { font-size: 16px; color: var(--color-muted); }
      [data-defect="on"] main { margin: 72px 56px 0; flex-wrap: nowrap; gap: 24px; }
      [data-defect="on"] .o1, [data-defect="on"] .o2, [data-defect="on"] .o3 { width: 360px; height: 560px; margin-top: 0; padding: 40px 32px; border-radius: 12px; color: #fff; }
      [data-defect="on"] .o1 { background: #c2410c; }
      [data-defect="on"] .o2 { background: #15803d; }
      [data-defect="on"] .o3 { background: #7e22ce; }
      [data-defect="on"] .o1 h2, [data-defect="on"] .o2 h2, [data-defect="on"] .o3 h2 { font-size: 52px; line-height: 1.05; font-weight: 700; margin-bottom: 20px; }
      [data-defect="on"] .o1 p, [data-defect="on"] .o2 p, [data-defect="on"] .o3 p { font-size: 20px; color: #fff; width: auto; }

    </style>
  </head>
  <body>
    <main>
      <section class="o1"><h2>Learn to swim</h2><p>Small adult classes on Tuesday evenings, with a coach in the water beside you.</p></section>
      <section class="o2"><h2>Join the lanes</h2><p>Open lane swimming every morning from six, with three speeds to choose from.</p></section>
      <section class="o3"><h2>Family hour</h2><p>Sunday afternoons in the shallow pool, with floats and toys for the children.</p></section>
    </main>
  </body>
</html>
