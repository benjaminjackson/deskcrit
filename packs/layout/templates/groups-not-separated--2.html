<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: groups-not-separated--2</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A settings menu: three groups of four full-width bars. Off: bars 8 px apart, groups 32 px apart (4 times the bar gap), headings plain bold text.
         On: every gap is 12 px, so the groups run together into one even list (OQ-17). */
      main { margin: 32px 0 0 96px; width: 560px; }
      .bar { height: 40px; line-height: 40px; padding: 0 16px; background: #e8eef7; margin-bottom: 8px; font-size: 17px; }
      .bar.head { font-weight: 700; }
      .bar.end { margin-bottom: 32px; }
      .bar.last { margin-bottom: 0; }
      [data-defect="on"] .bar, [data-defect="on"] .bar.end { margin-bottom: 12px; }
      [data-defect="on"] .bar.last { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="bar head">Account</div><div class="bar">Profile</div><div class="bar">Password</div><div class="bar end">Email</div>
      <div class="bar head">Display</div><div class="bar">Theme</div><div class="bar">Text size</div><div class="bar end">Language</div>
      <div class="bar head">Privacy</div><div class="bar">Visibility</div><div class="bar">Downloads</div><div class="bar last">Sign out</div>
    </main>
  </body>
</html>
