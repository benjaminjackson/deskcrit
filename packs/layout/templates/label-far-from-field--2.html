<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: label-far-from-field (2)</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A two-column form. Each label sits 5 px above its field, and rows are 30 px apart. The defect puts 34 px
         between a label and its own field and 5 px between it and the field above (OQ-17). */
      body { background: #f2efe9; font-family: var(--font-serif); }
      .card { margin: 56px 0 0 120px; width: 880px; background: #fff; border: 1px solid #ddd5c6; padding: 36px 40px; }
      h1 { font-size: 32px; margin-bottom: 26px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; row-gap: 30px; }
      label { display: block; font-family: var(--font-sans); font-size: 15px; font-weight: 700; margin-top: 0; margin-bottom: 5px; }
      .field { height: 46px; border: 2px solid #9a9486; border-radius: 4px; background: #fffefb; }
      [data-defect="on"] .grid { row-gap: 3px; }
      [data-defect="on"] label { margin-bottom: 38px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Request a seed catalogue</h1>
      <div class="grid">
        <div><label>First name</label><div class="field"></div></div>
        <div><label>Last name</label><div class="field"></div></div>
        <div><label>Street address</label><div class="field"></div></div>
        <div><label>Town</label><div class="field"></div></div>
        <div><label>Postal code</label><div class="field"></div></div>
        <div><label>Region</label><div class="field"></div></div>
      </div>
    </div>
  </body>
</html>
