<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: figure-merges-with-ground--4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A sign-up card on a dotted background. Without the defect the card is a plain white panel with dark text and a deep green button. The defect makes the card transparent so the heading, the field labels, and the button sit straight on a dense dot pattern, and the button takes the dot colour. */
      body { background: #cfe3d4; background-image: radial-gradient(circle, #5f8f6c 0 5px, transparent 6px); background-size: 22px 22px; }
      .card { margin: 100px auto 0; width: 620px; padding: 44px 48px; background: #fff; border-radius: 12px; border: 2px solid #2f5a3c; }
      h1 { font-size: 36px; font-weight: 700; color: #1d3a27; margin-bottom: 10px; }
      p { font-size: 20px; margin-bottom: 24px; color: #1d3a27; }
      .field { height: 52px; border: 2px solid #2f5a3c; border-radius: 8px; background: #fff; margin-bottom: 20px; padding: 0 16px; line-height: 48px; font-size: 18px; color: #4b6a55; }
      .button { display: inline-block; background: #1d5a33; color: #fff; font-weight: 700; font-size: 20px; padding: 14px 34px; border-radius: 8px; }
      [data-defect="on"] .card { background: none; border-color: transparent; }
      [data-defect="on"] .field { background: none; border-color: #5f8f6c; color: #5f8f6c; }
      [data-defect="on"] h1, [data-defect="on"] p { color: #3f7350; }
      [data-defect="on"] .button { background: #5f8f6c; color: #cfe3d4; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Join the seed swap</h1>
      <p>Tell us where to send the spring newsletter.</p>
      <div class="field">Your name</div>
      <div class="field">Email address</div>
      <span class="button">Sign me up</span>
    </div>
  </body>
</html>
