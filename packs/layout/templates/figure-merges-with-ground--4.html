<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: figure-merges-with-ground--4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A farmers' market page: a white nav bar over rows of fruit and vegetables on dark crates. A white headline and a short line sit across the lower rows. The defect removes the dark gradient from the bottom edge and the text shadow (OQ-17). */
      .nav { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 64px; border-bottom: 1px solid var(--color-border); }
      .logo { font-size: 22px; font-weight: 700; color: #a23b1a; }
      .links { display: flex; gap: 32px; color: var(--color-muted); font-size: 15px; }
      .hero { position: relative; height: 728px; overflow: hidden; background: #6b4a30; }
      .hero svg { position: absolute; left: 0; top: 0; }
      .scrim { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(20, 12, 6, 0.88) 0%, rgba(20, 12, 6, 0.75) 40%, rgba(20, 12, 6, 0) 70%); }
      [data-defect="on"] .scrim { display: none; }
      .copy { position: absolute; left: 80px; bottom: 80px; width: 900px; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
      [data-defect="on"] .copy { text-shadow: none; }
      .copy h1 { font-size: 76px; line-height: 1.02; font-weight: 700; margin-bottom: 14px; }
      .copy p { font-size: 24px; }
    </style>
  </head>
  <body>
    <div class="nav"><div class="logo">Millgate Market</div><div class="links"><span>Stalls</span><span>Seasonal</span><span>Hours</span><span>Contact</span></div></div>
    <div class="hero">
      <svg id="tex" width="1280" height="728" viewBox="0 0 1280 728"></svg>
      <div class="scrim"></div>
      <div class="copy"><h1>Fresh from the field, every Saturday</h1><p>Sixty stalls in the old corn hall, open from eight until two.</p></div>
    </div>
    <script>
      var seed = 31;
      function random() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
      var markup = '';
      var palette = [[8, 70, 44], [28, 80, 48], [95, 50, 40], [350, 55, 42], [48, 75, 52], [280, 30, 36]];
      for (var row = 0; row < 7; row++) {
        var rowY = 30 + row * 104;
        markup += '<rect x="0" y="' + (rowY + 52) + '" width="1280" height="52" fill="hsl(25,35%,' + (20 + row * 2) + '%)"/>';
        for (var column = 0; column < 60; column++) {
          var pick = palette[Math.floor(random() * palette.length)];
          var radius = 16 + random() * 8;
          var cx = column * 22 + random() * 10, cy = rowY + 30 + random() * 30;
          markup += '<circle cx="' + cx.toFixed(0) + '" cy="' + cy.toFixed(0) + '" r="' + radius.toFixed(0) + '" fill="hsl(' + pick[0] + ',' + pick[1] + '%,' + (pick[2] + random() * 10).toFixed(0) + '%)"/>';
        }
      }
      document.getElementById('tex').innerHTML = markup;
    </script>
  </body>
</html>
