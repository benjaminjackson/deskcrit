<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: uneven-gutters--4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A pricing page: four solid teal plan cards on a white page, 24 px apart, so each gap is a white stripe. The defect makes the third gap 120 px wide. (OQ-17) */
      main { margin: 64px 80px 0; }
      h1 { font-size: 30px; font-weight: 700; margin-bottom: 48px; }
      .row { display: flex; }
      .plan { width: 240px; height: 440px; background: #0f766e; color: #fff; border-radius: 6px; padding: 24px; margin-right: 24px; }
      .plan:last-child { margin-right: 0; }
      .plan h2 { font-size: 22px; margin-bottom: 8px; }
      .plan .cost { font-size: 40px; font-weight: 700; margin-bottom: 14px; }
      .plan p { font-size: 16px; opacity: .85; }
      [data-defect="on"] .third { margin-right: 120px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Choose a plan</h1>
      <div class="row">
        <div class="plan"><h2>Solo</h2><div class="cost">5</div><p>One user, one project.</p></div>
        <div class="plan"><h2>Duo</h2><div class="cost">9</div><p>Two users, five projects.</p></div>
        <div class="plan third"><h2>Team</h2><div class="cost">24</div><p>Ten users, shared folders.</p></div>
        <div class="plan"><h2>Studio</h2><div class="cost">60</div><p>Unlimited users and projects.</p></div>
      </div>
    </main>
  </body>
</html>
