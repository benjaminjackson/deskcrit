<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: figure-merges-with-ground</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A banner with a headline and a button. Without the defect the banner is one plain dark
         color. The defect fills it with busy stripes close in tone to the text and button (OQ-17). */
      .banner { margin: 64px; height: 520px; border-radius: 12px; background: #1f3a5f; padding: 88px 72px; }
      h1 { font-size: 56px; font-weight: 700; color: #e8eef5; width: 760px; line-height: 1.15; margin-bottom: 24px; }
      p { font-size: 22px; color: #e8eef5; width: 640px; margin-bottom: 40px; }
      .button { display: inline-block; background: #d7e2ee; color: #1f3a5f; font-weight: 700; font-size: 18px; padding: 14px 28px; border-radius: 8px; }
      [data-defect="on"] .banner {
        background: repeating-linear-gradient(115deg, #dfe7f0 0 18px, #9fb3c8 18px 30px, #f3f6fa 30px 52px, #c4d2e0 52px 64px);
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <h1>Spring timetable for the valley railway</h1>
      <p>Trains run every hour from the first of April, with extra services on market days.</p>
      <span class="button">See the timetable</span>
    </div>
  </body>
</html>
