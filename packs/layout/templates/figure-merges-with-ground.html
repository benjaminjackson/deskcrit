<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: figure-merges-with-ground</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A plant nursery home page: white nav bar over a hero made of about 1,400 overlapping mid-green leaves. A white headline, one line of text and an outlined button sit on the left of the leaves. The defect removes the dark gradient that lies between the leaves and the text (OQ-17). */
      .nav { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 64px; border-bottom: 1px solid var(--color-border); }
      .logo { font-size: 22px; font-weight: 700; color: #1f4d2b; }
      .links { display: flex; gap: 32px; color: var(--color-muted); font-size: 15px; }
      .hero { position: relative; height: 728px; overflow: hidden; background: #3f6b3a; }
      .hero svg { position: absolute; left: 0; top: 0; }
      .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8, 30, 14, 0.82) 0%, rgba(8, 30, 14, 0.72) 45%, rgba(8, 30, 14, 0) 80%); }
      [data-defect="on"] .scrim { display: none; }
      .copy { position: absolute; left: 96px; top: 190px; width: 620px; color: #fff; }
      .copy h1 { font-size: 68px; line-height: 1.05; font-weight: 700; margin-bottom: 24px; }
      .copy p { font-size: 22px; font-weight: 400; margin-bottom: 36px; }
      .btn { display: inline-block; padding: 14px 30px; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 17px; }
    </style>
  </head>
  <body>
    <div class="nav"><div class="logo">Fernhill Nursery</div><div class="links"><span>Plants</span><span>Pots</span><span>Care guides</span><span>Visit</span></div></div>
    <div class="hero">
      <svg id="tex" width="1280" height="728" viewBox="0 0 1280 728"></svg>
      <div class="scrim"></div>
      <div class="copy"><h1>Ferns and shade plants for every corner</h1><p>Grown on the hill and ready to plant this weekend.</p><span class="btn">Browse the greenhouse</span></div>
    </div>
    <script>
      var seed = 7;
      function random() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
      var markup = '';
      for (var index = 0; index < 1400; index++) {
        var x = random() * 1280, y = random() * 728, rx = 12 + random() * 24, ry = rx * (0.3 + random() * 0.2);
        var turn = random() * 180, hue = 85 + random() * 50, sat = 35 + random() * 30, light = 26 + random() * 30;
        markup += '<ellipse cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" rx="' + rx.toFixed(0) + '" ry="' + ry.toFixed(0) + '" transform="rotate(' + turn.toFixed(0) + ' ' + x.toFixed(0) + ' ' + y.toFixed(0) + ')" fill="hsl(' + hue.toFixed(0) + ',' + sat.toFixed(0) + '%,' + light.toFixed(0) + '%)"/>';
      }
      document.getElementById('tex').innerHTML = markup;
    </script>
  </body>
</html>
