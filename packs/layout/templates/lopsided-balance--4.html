<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: lopsided-balance--4</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* An app page: a dark sidebar full of menu items on the left. Off: the main area holds a
         row of stat cards and a chart block. On: the main area holds only one small line. */
      .app { display: flex; height: 800px; }
      .side { width: 400px; background: #172033; color: #dfe5f0; padding: 40px 32px; }
      .side h2 { font-size: 26px; margin-bottom: 28px; color: #fff; }
      .side div { font-size: 19px; padding: 14px 0; border-bottom: 1px solid #2c3850; }
      .main { flex: 1; padding: 48px 56px; }
      .main h1 { font-size: 34px; margin-bottom: 28px; }
      .cards { display: flex; gap: 20px; margin-bottom: 24px; }
      .card { flex: 1; height: 150px; border: 1px solid var(--color-border); border-radius: 10px; padding: 20px; background: #eef3fa; }
      .card b { display: block; font-size: 40px; margin-top: 8px; }
      .chart { height: 360px; border-radius: 10px; background: #d5e4f7; }
      [data-defect="on"] .cards, [data-defect="on"] .chart { display: none; }
      [data-defect="on"] .main h1 { font-size: 15px; font-weight: 400; color: var(--color-muted); }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="side">
        <h2>Workspace</h2>
        <div>Overview</div><div>Orders</div><div>Shipments</div><div>Returns</div><div>Suppliers</div>
        <div>Invoices</div><div>Reports</div><div>Staff rota</div><div>Settings</div><div>Help centre</div>
      </div>
      <div class="main">
        <h1>Orders this week</h1>
        <div class="cards">
          <div class="card">New<b>128</b></div>
          <div class="card">Packed<b>96</b></div>
          <div class="card">Sent<b>74</b></div>
        </div>
        <div class="chart"></div>
      </div>
    </div>
  </body>
</html>
