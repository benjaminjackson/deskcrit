<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: white-space-scattered--3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A grid of 96 numbered cells with a 6 px gap. Off: small cells in a block at the top left with a large
         empty page. On: the cells fill the whole page, so no open area is left (OQ-17). */
      .grid { display: grid; grid-template-columns: repeat(12, 34px); grid-auto-rows: 30px; gap: 6px; margin: 48px 0 0 48px; }
      .cell { background: #fde68a; color: #78350f; font-size: 12px; display: flex; align-items: center; justify-content: center; }
      [data-defect="on"] .grid { margin: 6px; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(8, 1fr); height: 788px; width: 1268px; }
      [data-defect="on"] .cell { font-size: 26px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script>
      var html = "";
      for (var index = 1; index <= 96; index++) {
        html += '<div class="cell">' + index + "</div>";
      }
      document.getElementById("grid").innerHTML = html;
    </script>
  </body>
</html>
