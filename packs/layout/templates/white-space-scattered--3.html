<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <title>Layout fixture: white-space-scattered 3</title>
    <style>
      /* A product page for a ceramic kettle: a shop bar, a large product picture drawn with shapes, and a details column with title, price, colour choices, a button, and a spec list. The defect gives the bar, the picture, the details, and the page margin one equal 24 px gap. The clean page has a wide margin, a 64 px gap between the picture and the details, and 8 px gaps between the lines inside the details. (OQ-17) */
      body { display: flex; flex-direction: column; background: #fbfaf8; padding: 0 140px; }
      .bar { height: 72px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--color-muted); } .bar b { color: var(--color-text); font-size: 20px; }
      .layout { flex: 1; display: flex; gap: 72px; padding-bottom: 56px; }
      .pic { flex: 1; background: #e9dfd2; border-radius: 12px; position: relative; }
      .kettle { position: absolute; left: 50%; top: 52%; width: 220px; height: 210px; margin: -105px 0 0 -110px; background: #35564b; border-radius: 40% 40% 24px 24px; }
      .kettle::before { content: ""; position: absolute; left: 80px; top: -26px; width: 60px; height: 26px; background: #27413a; border-radius: 30px 30px 0 0; }
      .kettle::after { content: ""; position: absolute; right: -42px; top: 40px; width: 52px; height: 18px; background: #35564b; transform: rotate(-28deg); border-radius: 6px; }
      .details { width: 380px; padding-top: 24px; }
      .details small { color: var(--color-muted); } .details h1 { font-size: 34px; line-height: 1.15; margin: 6px 0 8px; }
      .price { font-size: 24px; font-weight: 700; margin-bottom: 30px; }
      .colors { display: flex; gap: 8px; margin-bottom: 30px; } .colors i { width: 28px; height: 28px; border-radius: 50%; } 
      .btn { display: block; background: #35564b; color: #fff; text-align: center; padding: 14px; border-radius: 8px; font-weight: 700; margin-bottom: 40px; }
      .spec { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid #e5e1da; color: var(--color-muted); } .spec b { font-weight: 400; color: var(--color-text); }
      [data-defect="on"] body { padding: 0 24px 24px; }
      [data-defect="on"] .bar { height: 56px; }
      [data-defect="on"] .layout { gap: 24px; padding-bottom: 0; }
      [data-defect="on"] .details { background: #fff; border: 1px solid #e5e1da; border-radius: 12px; padding: 24px; width: 420px; }
      [data-defect="on"] .price, [data-defect="on"] .colors, [data-defect="on"] .btn { margin-bottom: 24px; }
    </style>
  </head>
  <body>
    <div class="bar"><b>Hearthware</b><span>Kitchen &nbsp;·&nbsp; Tableware &nbsp;·&nbsp; Gifts &nbsp;·&nbsp; Cart (0)</span></div>
    <div class="layout">
      <div class="pic"><div class="kettle"></div></div>
      <div class="details"><small>Kettles</small><h1>Moss stoneware kettle, 1.2 L</h1><div class="price">$96.00</div><div class="colors"><i style="background:#35564b"></i><i style="background:#c9b79c"></i><i style="background:#2b3a55"></i></div><span class="btn">Add to cart</span><div class="spec"><span>Capacity</span><b>1.2 litres</b></div><div class="spec"><span>Material</span><b>Glazed stoneware</b></div><div class="spec"><span>Works on</span><b>Gas and electric</b></div></div>
    </div>
  </body>
</html>
