<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: label-far-from-field (3)</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A delivery address form on a beige card, with stacked labels and one row of two fields. Each label
         sits 6 px above its own field and 30 px below the field before it. The defect puts each label 3 px
         under the field before it and 38 px above its own field (OQ-17). */
      body { background: #efe9dd; }
      .card { margin: 40px auto 0; width: 620px; background: #fffdf8; border-radius: 10px; padding: 32px 40px; }
      h1 { font-size: 26px; margin-bottom: 8px; }
      .field { margin-top: 30px; }
      .field:first-of-type { margin-top: 24px; }
      label { display: block; font-size: 15px; font-weight: 700; color: #4a3f2c; margin-bottom: 6px; }
      .box { height: 40px; border: 1px solid #b9ad97; border-radius: 6px; background: #fff; }
      .row { display: grid; grid-template-columns: 2fr 1fr; column-gap: 20px; }
      [data-defect="on"] .field { margin-top: 3px; }
      [data-defect="on"] .field:first-of-type { margin-top: 24px; }
      [data-defect="on"] label { margin-bottom: 38px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Where should we send the seeds?</h1>
      <div class="field"><label>Full name</label><div class="box"></div></div>
      <div class="field"><label>Street and house number</label><div class="box"></div></div>
      <div class="field row">
        <div><label>Town</label><div class="box"></div></div>
        <div><label>Postcode</label><div class="box"></div></div>
      </div>
      <div class="field"><label>Delivery note</label><div class="box"></div></div>
    </div>
  </body>
</html>
