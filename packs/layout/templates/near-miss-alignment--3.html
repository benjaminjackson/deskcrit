<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: near-miss-alignment--3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A column of five settings rows that share one left edge. On the off side the third row is indented 110 px, a clear break. The defect indents it only 14 px, so the edge almost lines up but misses. Nothing else changes (OQ-17). */
      body { background: #f7f8fa; }
      main { margin: 56px 0 0 220px; width: 640px; }
      h1 { font-size: 30px; font-weight: 700; margin-bottom: 28px; }
      .row { display: flex; align-items: center; gap: 20px; height: 84px; margin-bottom: 14px; padding: 0 24px; background: #fff; border: 2px solid #d5dbe3; border-radius: 10px; }
      .icon { width: 40px; height: 40px; border-radius: 8px; background: #4d7c6f; }
      .row span { font-size: 20px; }
      .stray { margin-left: 110px; }
      [data-defect="on"] .stray { margin-left: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Account settings</h1>
      <div class="row"><div class="icon"></div><span>Change password</span></div>
      <div class="row"><div class="icon"></div><span>Email preferences</span></div>
      <div class="row stray"><div class="icon"></div><span>Connected devices</span></div>
      <div class="row"><div class="icon"></div><span>Download my data</span></div>
      <div class="row"><div class="icon"></div><span>Close account</span></div>
    </main>
  </body>
</html>
