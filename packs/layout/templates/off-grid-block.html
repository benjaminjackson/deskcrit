<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: off-grid-block</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Four wide solid bands stacked in one column, all from x=140 to x=1000. The defect moves the third band 100 px to the right, so it starts and ends on no line the others use. (OQ-17) */
      h1 { position: absolute; left: 140px; top: 48px; font-size: 32px; font-weight: 700; }
      .band { position: absolute; left: 140px; width: 860px; height: 120px; padding: 24px 32px; color: #fff; }
      .band h2 { font-size: 24px; margin-bottom: 6px; }
      [data-defect="on"] .odd { left: 240px; }
    </style>
  </head>
  <body>
    <h1>Garden planner</h1>
    <div class="band" style="top:130px;background:#1f4e79"><h2>Seed trays</h2><p>Sow tomatoes indoors six weeks before the last frost.</p></div>
    <div class="band" style="top:280px;background:#2b7a4b"><h2>Raised beds</h2><p>Fill new beds with compost and topsoil in early spring.</p></div>
    <div class="band odd" style="top:430px;background:#b4531a"><h2>Pruning</h2><p>Pinch the side shoots off tomatoes once a week.</p></div>
    <div class="band" style="top:580px;background:#7b2d8e"><h2>Harvest</h2><p>Pick beans every few days so the plants keep flowering.</p></div>
  </body>
</html>
