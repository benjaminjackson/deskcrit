<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: off-grid-block--3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A narrow left column of three solid blocks (x=80 to 480) and a wide right column of three solid blocks (x=520 to 1200). The defect moves the middle block of the right column to start at x=600 and end at x=1120. (OQ-17) */
      h1 { position: absolute; left: 80px; top: 40px; font-size: 32px; font-weight: 700; }
      .blk { position: absolute; padding: 22px 28px; height: 150px; color: #fff; }
      .blk h2 { font-size: 22px; margin-bottom: 6px; }
      .l { left: 80px; width: 400px; background: #334155; }
      .r { left: 520px; width: 680px; background: #0f766e; }
      [data-defect="on"] .odd { left: 600px; width: 520px; }
    </style>
  </head>
  <body>
    <h1>Trip board</h1>
    <div class="blk l" style="top:120px"><h2>Flights</h2><p>Out on Friday, back on Monday.</p></div>
    <div class="blk l" style="top:300px"><h2>Hotel</h2><p>Two nights near the station.</p></div>
    <div class="blk l" style="top:480px"><h2>Budget</h2><p>Keep it under four hundred.</p></div>
    <div class="blk r" style="top:120px"><h2>Saturday</h2><p>Old town walk, lunch by the river.</p></div>
    <div class="blk r odd" style="top:300px"><h2>Sunday</h2><p>Market in the morning, museum after.</p></div>
    <div class="blk r" style="top:480px"><h2>Packing</h2><p>Light jacket, walking shoes, charger.</p></div>
  </body>
</html>
