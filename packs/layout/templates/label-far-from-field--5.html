<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: label-far-from-field (5)</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* Checkboxes in rows, each with its label to the right. The label sits 10 px from its own box and 60 px
         from the next box. The defect puts the label 60 px from its own box and 10 px from the next (OQ-17). */
      body { background: #f6f7fb; }
      main { margin: 56px 0 0 100px; width: 1000px; }
      h1 { font-size: 30px; margin-bottom: 8px; }
      .lede { color: var(--color-muted); margin-bottom: 32px; }
      .row { display: flex; align-items: center; margin-bottom: 36px; }
      .box { width: 26px; height: 26px; border: 2px solid #5a6a85; border-radius: 4px; background: #fff; flex: none; }
      .text { font-size: 20px; margin-left: 10px; margin-right: 60px; white-space: nowrap; }
      [data-defect="on"] .text { margin-left: 70px; margin-right: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Filter the trail list</h1>
      <p class="lede">Show only trails that offer all of the ticked features.</p>
      <div class="row"><div class="box"></div><div class="text">Dogs allowed</div><div class="box"></div><div class="text">Step-free path</div><div class="box"></div><div class="text">Picnic tables</div><div class="box"></div><div class="text">Open at night</div></div>
      <div class="row"><div class="box"></div><div class="text">Toilets</div><div class="box"></div><div class="text">Bike hire</div><div class="box"></div><div class="text">Guided walks</div><div class="box"></div><div class="text">Free parking</div></div>
      <div class="row"><div class="box"></div><div class="text">Cafe on site</div><div class="box"></div><div class="text">Shaded route</div><div class="box"></div><div class="text">Lake view</div><div class="box"></div><div class="text">Bird hide</div></div>
    </main>
  </body>
</html>
