<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: lopsided-balance--3</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A gallery page: three dark tiles in a column on the left. Off: a bright accent panel with
         text on the right balances them. On: the panel is gone and the right side is empty. */
      main { display: flex; gap: 40px; margin: 40px 80px 0; }
      .tiles { width: 560px; display: flex; flex-direction: column; gap: 16px; }
      .tile { height: 220px; border-radius: 10px; background: #1b1f27; color: #e6e9ee; padding: 24px; font-weight: 700; font-size: 22px; }
      .panel { width: 560px; height: 692px; border-radius: 10px; background: #14213d; color: #fff; padding: 56px 48px; }
      .panel h2 { font-size: 40px; line-height: 1.15; margin-bottom: 20px; }
      .panel p { font-size: 20px; }
      [data-defect="on"] .panel { display: none; }
      [data-defect="on"] .tile { background: #0d0f14; }
    </style>
  </head>
  <body>
    <main>
      <div class="tiles">
        <div class="tile">Harbour at dawn</div>
        <div class="tile">Net sheds</div>
        <div class="tile">Lighthouse stairs</div>
      </div>
      <div class="panel">
        <h2>Prints from the coast road</h2>
        <p>Twelve black and white studies, printed to order and shipped flat in a card sleeve.</p>
      </div>
    </main>
  </body>
</html>
