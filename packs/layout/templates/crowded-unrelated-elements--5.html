<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout fixture: crowded-unrelated-elements--5</title>
    <!-- base.js sets html[data-defect] from ?defect=on|off before the page draws (OQ-17). -->
    <script src="../../_renderer/base.js"></script>
    <link rel="stylesheet" href="../../_renderer/base.css">
    <style>
      /* A table of results, then a footer sentence about something else (a news item). Off: a clear
         gap separates them. On: the news sentence sits pressed under the last table row. */
      main { margin: 48px 100px 0; }
      h1 { font-size: 30px; margin-bottom: 18px; }
      table { width: 100%; border-collapse: collapse; }
      th { text-align: left; font-size: 15px; color: #fff; background: #3d2a6b; padding: 12px 16px; }
      td { font-size: 18px; padding: 12px 16px; border-bottom: 1px solid var(--color-border); }
      tr:last-child td { border-bottom: 0; background: #ece8f5; }
      .news { margin-top: 64px; font-family: var(--font-serif); }
      .news h2 { font-size: 24px; margin-bottom: 6px; }
      .news p { font-size: 19px; color: var(--color-muted); }
      [data-defect="on"] .news { margin-top: 0; }
      [data-defect="on"] .news h2 { margin-top: -2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pond dipping league, spring term</h1>
      <table>
        <tr><th>Team</th><th>Played</th><th>Species found</th><th>Points</th></tr>
        <tr><td>Newt Squad</td><td>6</td><td>41</td><td>28</td></tr>
        <tr><td>Reed Rangers</td><td>6</td><td>37</td><td>25</td></tr>
        <tr><td>Mud Larks</td><td>6</td><td>33</td><td>22</td></tr>
        <tr><td>Dragonfly Club</td><td>6</td><td>30</td><td>19</td></tr>
        <tr><td>Tadpole Troop</td><td>6</td><td>24</td><td>14</td></tr>
        <tr><td>Water Boatmen</td><td>6</td><td>21</td><td>11</td></tr>
      </table>
      <div class="news">
        <h2>The village hall roof is being repaired</h2>
        <p>Work starts in May. Meetings move to the school until the end of June.</p>
      </div>
    </main>
  </body>
</html>
