        - fixtures/heavy-rules-and-boxes--2.negative.png
        - fixtures/heavy-rules-and-boxes--3.negative.png
        - fixtures/heavy-rules-and-boxes--4.negative.png
        - fixtures/heavy-rules-and-boxes--5.negative.png
