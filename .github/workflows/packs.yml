# The pack checks (crit-q25.4, crit-mk9.3, PRD FR-54, EV-3).
#
# The fixture-rules job runs on every pull request and every push to main. It needs no secret.
# It runs the offline FR-54 fixture-rules check in evals/packs-fixture-rules.test.ts. It installs
# only the root package: never packs/package.json or Playwright, because CI never renders a
# fixture (FR-54, NFR-3, OQ-17).
name: Packs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixture-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the fixture rules
        run: npx vitest run evals/packs-fixture-rules.test.ts
